# Tier 6 Benchmark: Large-Scale Phonon Calculation
# Phonon dispersion requiring many force calculations

id: BENCH-T6-003
name: Large-Scale Phonon Calculation
tier: 6
category: hpc-scale-research

description: |
  Calculate the phonon dispersion of silicon using the finite-displacement
  method with a large supercell. This requires many independent force
  calculations, making it ideal for parallel execution on HPC using job arrays.

prompt: |
  **CRITICAL INSTRUCTIONS - READ CAREFULLY:**

  1. You are EXECUTING this task autonomously - you do ALL the work yourself
  2. You must CREATE ALL required files listed below in the workspace directory
  3. Do NOT stop after literature research - that is only Step 1 of 7
  4. The task is INCOMPLETE until you have phonon plots and a report
  5. Use the Write tool to create files, and actually submit HPC jobs

  **START by using TodoWrite to create a checklist of ALL 7 STEPS:**
  - [ ] Step 1: Literature research (save to literature/notes.md)
  - [ ] Step 2: Get Si structure and create supercell (structures/POSCAR_supercell)
  - [ ] Step 3: Generate displacement files (scripts/generate_displacements.py)
  - [ ] Step 4: Create SLURM job array script (jobs/job_array.slurm)
  - [ ] Step 5: Submit jobs and collect forces
  - [ ] Step 6: Post-process and calculate phonons (analysis/)
  - [ ] Step 7: Write report with plots (report.md)

  **Research Question:**
  Calculate the phonon dispersion and density of states for silicon using
  the finite-displacement method with classical MD.

  **Background:**
  Phonon calculations using finite displacements require:
  1. Create a supercell large enough to avoid periodic image interactions
  2. Displace each atom in x, y, z directions (positive and negative)
  3. Calculate forces on all atoms for each displacement
  4. Build the dynamical matrix from force constants
  5. Diagonalize to get phonon frequencies

  For N atoms in the supercell, you need 6N force calculations.
  This is embarrassingly parallel - perfect for HPC job arrays.

  **Your Study:**

  **Step 1: Literature Research**
  - Find silicon phonon dispersion (experimental and calculated)
  - Find appropriate Si interatomic potential for phonons
  - Recommended: Stillinger-Weber or Tersoff potential

  **Step 2: System Setup**
  - Get Si diamond structure from Materials Project
  - Create supercell: at least 3×3×3 conventional cells (216 atoms)
  - Larger supercells (4×4×4 = 512 atoms) give better accuracy

  **Step 3: Plan Force Calculations**
  For a 3×3×3 supercell (216 atoms):
  - Need 216 × 6 = 1,296 force calculations
  - Each calculation is independent
  - Can run as SLURM job array

  For a 4×4×4 supercell (512 atoms):
  - Need 512 × 6 = 3,072 force calculations
  - Even more HPC-appropriate

  **Step 4: Create Displacement Files**
  - Write a script to generate all displaced configurations
  - Each displacement: shift one atom by small amount (±0.01 Å)
  - Save as separate data files or use LAMMPS variables

  **Step 5: Submit Parallel Calculations**
  Use SLURM job array:
  ```bash
  #SBATCH --array=0-1295  # For 216-atom supercell
  ```
  Each array task:
  - Reads one displaced configuration
  - Runs single-point energy/force calculation
  - Outputs forces to file

  **Step 6: Post-Processing**
  When all calculations complete:
  - Collect all force outputs
  - Build force constant matrix
  - Calculate dynamical matrix
  - Compute phonon dispersion along high-symmetry paths
  - Calculate phonon DOS

  You can use phonopy or write your own post-processing.

  **Step 7: Report**
  - Phonon dispersion plot along Γ-X-K-Γ-L path
  - Phonon DOS
  - Comparison to experimental data
  - Discussion of potential accuracy

  **BEFORE FINISHING - VERIFY ALL DELIVERABLES EXIST:**
  - [ ] structures/POSCAR_supercell (3×3×3 or larger Si supercell)
  - [ ] displacements/ directory with displacement files
  - [ ] jobs/job_array.slurm (SLURM array script)
  - [ ] analysis/phonon_dispersion.png
  - [ ] analysis/phonon_dos.png
  - [ ] report.md

  If any are missing, GO BACK and complete them. Do not finish until done.

  Work in: workspaces/benchmarks/BENCH-T6-003/

