# Tier 11 Benchmark: Distributed MLIP Training
# HPC + ML Hybrid - Multi-GPU MACE training on HPC

id: BENCH-T11-005
name: Distributed MLIP Training
tier: 11
category: hpc-ml-hybrid

description: |
  Train or fine-tune an MLIP using multiple GPUs on HPC. This tests:
  1. Preparing training datasets in the correct format
  2. Setting up distributed training with PyTorch DDP
  3. Configuring multi-GPU SLURM jobs
  4. Monitoring training and evaluating results

  Key insight: Training MLIPs on large datasets benefits from multi-GPU
  parallelism. MACE foundation models were trained on 100s of GPUs.
  Even fine-tuning benefits from 2-4 GPUs for faster iteration.

prompt: |
  **Scientific Challenge: Fine-tune MLIP for Perovskite Oxides**

  Universal MLIPs work well for many materials but can have higher errors
  for specific chemistries. You need to fine-tune MACE for better accuracy
  on perovskite oxide structures (ABO₃).

  **Your Task: Multi-GPU MACE Fine-Tuning**

  1. **Prepare Training Dataset**
     - Target chemistry: Perovskite oxides (SrTiO₃, BaTiO₃, etc.)
     - Generate 2000+ configurations:
       * Get structures from Materials Project (various perovskites)
       * Apply random strains (±3%)
       * Generate rattled structures (atomic displacements)
       * Include some MD snapshots at 300K
     - For each configuration, calculate:
       * Energy (using reference MLIP or literature DFT)
       * Forces (optional but helpful)
     - Save in MACE-compatible format (extended XYZ)

  2. **Prepare Fine-Tuning Configuration**
     - Start from MACE-MP-0 pretrained weights
     - Configure fine-tuning hyperparameters:
       * Lower learning rate (1e-4 to 1e-5)
       * Fewer epochs (50-100 for fine-tuning)
       * Appropriate batch size for multi-GPU
     - Use MACE's fine-tuning scripts or commands

  3. **Set Up Multi-GPU Job**
     - Request 2-4 A100 GPUs on HPC
     - Configure PyTorch distributed training
     - Set up NCCL for GPU communication
     - Handle distributed environment variables

  4. **Write Training Script and SLURM Job**
     - SLURM script requesting multiple GPUs
     - Distributed launch (torchrun or similar)
     - Proper CUDA_VISIBLE_DEVICES handling
     - Training checkpoints saved periodically

  5. **Submit and Monitor Training**
     - Submit job to HPC
     - Monitor training loss
     - Check for convergence
     - Save best model checkpoint

  6. **Evaluate Fine-Tuned Model**
     - Compare accuracy: original vs fine-tuned MACE
     - Test on held-out perovskite structures
     - Calculate MAE for energy and forces
     - Demonstrate improvement on target chemistry

  **Technical Requirements:**
  - Must use 2+ GPUs simultaneously
  - Must show distributed training setup
  - Training must make progress (loss decreases)
  - Final model must be usable

  **Expected Outcomes:**
  - Fine-tuning typically improves accuracy 2-5x on target chemistry
  - Energy MAE should drop from ~30 meV/atom to ~10 meV/atom
  - Training time: 1-4 hours with 2-4 GPUs

  Work in: workspaces/benchmarks/BENCH-T11-005/

skills_required:
  - mlip-simulation
  - hpc-cluster
  - data-analysis

time_limit_minutes: 180

setup_files: []

expected_outputs:
  files:
    - name: "dataset/"
      description: "Training data directory"
    - name: "train.xyz"
      description: "Extended XYZ training file"
    - name: "test.xyz"
      description: "Held-out test structures"
    - name: "train_config.yaml"
      description: "MACE training configuration"
    - name: "train_mace.slurm"
      description: "Multi-GPU SLURM script"
    - name: "train_mace.py"
      description: "Training launch script"
    - name: "checkpoints/"
      description: "Training checkpoints"
    - name: "finetuned_model.model"
      description: "Final fine-tuned MACE model"
    - name: "evaluation_report.md"
      description: "Before/after accuracy comparison"

grading:
  categories:
    - name: dataset_preparation
      weight: 20
      criteria:
        - description: "Generated diverse perovskite dataset"
          points: 6
          grader_looks_for: |
            Dataset should include:
            - Multiple perovskite compositions (SrTiO₃, BaTiO₃, etc.)
            - Strained structures
            - Rattled/displaced structures
            - 500+ configurations minimum
        - description: "Correct extended XYZ format"
          points: 6
          grader_looks_for: |
            Format must have:
            - energy property in header
            - forces property per atom (if included)
            - Lattice vectors
            - Parseable by MACE
        - description: "Train/test split implemented"
          points: 4
          grader_looks_for: |
            - Separate train and test files
            - Test set held out (not used in training)
            - Reasonable split (80/20 or 90/10)
        - description: "Labels from reasonable source"
          points: 4
          grader_looks_for: |
            Energy/force labels from:
            - DFT calculations
            - Existing MLIP (for distillation)
            - Or clearly documented source

    - name: distributed_setup
      weight: 30
      criteria:
        - description: "Multi-GPU SLURM configuration"
          points: 8
          grader_looks_for: |
            SLURM script must have:
            - --gres=gpu:2 or higher
            - --ntasks-per-node matching GPUs
            - Correct partition (aa100)
            - Appropriate memory allocation
        - description: "Distributed training launch"
          points: 10
          grader_looks_for: |
            Must use distributed training:
            - torchrun/torch.distributed.launch
            - Or horovodrun
            - Or MACE's built-in distributed
            - Correct nproc_per_node setting
        - description: "Environment variables set correctly"
          points: 7
          grader_looks_for: |
            Should handle:
            - MASTER_ADDR, MASTER_PORT
            - WORLD_SIZE, RANK
            - CUDA_VISIBLE_DEVICES
            - Or rely on SLURM to set these
        - description: "NCCL or communication backend configured"
          points: 5
          grader_looks_for: |
            - NCCL backend for GPU-GPU communication
            - Or gloo as fallback
            - No communication errors in logs

    - name: training_execution
      weight: 25
      criteria:
        - description: "Training job submitted and ran"
          points: 6
          grader_looks_for: |
            - Job submitted successfully
            - Used multiple GPUs (visible in logs)
            - Ran for meaningful duration
        - description: "Training made progress (loss decreased)"
          points: 8
          grader_looks_for: |
            Training logs show:
            - Initial loss value
            - Loss decreasing over epochs
            - No NaN or explosion
            - Reasonable convergence
        - description: "Checkpoints saved"
          points: 5
          grader_looks_for: |
            - Checkpoint files exist
            - Saved periodically during training
            - Final model saved
        - description: "Training completed or ran substantially"
          points: 6
          grader_looks_for: |
            - At least 10 epochs completed
            - Or ran for 1+ hours
            - Final model file exists

    - name: evaluation
      weight: 20
      criteria:
        - description: "Compared original vs fine-tuned model"
          points: 8
          grader_looks_for: |
            Evaluation shows:
            - Test set predictions with both models
            - MAE/RMSE for each
            - Clear improvement demonstrated
        - description: "Quantified improvement on perovskites"
          points: 7
          grader_looks_for: |
            - Specific numbers: original MAE vs fine-tuned MAE
            - Improvement factor calculated
            - Results on held-out test set
        - description: "Discussed training process"
          points: 5
          grader_looks_for: |
            Report includes:
            - Training time
            - Number of GPUs used
            - Convergence behavior
            - Any issues encountered

    - name: technical_quality
      weight: 5
      criteria:
        - description: "Code is reproducible"
          points: 3
          grader_looks_for: |
            - Scripts can be re-run
            - Dependencies documented
            - Random seeds set if applicable
        - description: "Model file is loadable"
          points: 2
          grader_looks_for: |
            - Final model can be loaded
            - Works for inference
            - No format errors

metadata:
  difficulty: very_hard
  estimated_time_minutes: 150

  hpc_resources:
    partition: aa100
    gpus: "2-4"
    time_limit: "08:00:00"
    distributed: true

  ml_requirements:
    framework: "MACE (mace-torch)"
    task: "Fine-tuning from pretrained"
    base_model: "MACE-MP-0"
    distributed_backend: "PyTorch DDP with NCCL"

  dataset_requirements:
    material_class: "Perovskite oxides (ABO₃)"
    minimum_structures: 500
    format: "Extended XYZ with energy/forces"

  scientific_context:
    goal: "Improve MLIP accuracy for specific chemistry"
    expected_improvement: "2-5x reduction in MAE"
    target_mae: "<15 meV/atom for perovskites"

  skills_tested:
    - distributed_training
    - multi_gpu_hpc
    - dataset_preparation
    - model_fine_tuning
    - pytorch_ddp
    - training_monitoring

  key_challenge: |
    Setting up distributed training correctly is complex.
    The agent must understand PyTorch DDP, SLURM GPU allocation,
    and MACE's training interface.

  common_failures:
    - "Single GPU when multi-GPU requested"
    - "Wrong distributed launch command"
    - "NCCL initialization failure"
    - "Dataset format incompatible with MACE"
    - "Forgetting to load pretrained weights"
    - "Learning rate too high (divergence)"
    - "Not enough training data"

notes: |
  This benchmark tests a cutting-edge workflow: distributed MLIP training.
  While foundation models use 100s of GPUs, fine-tuning on 2-4 GPUs is
  practical and valuable for domain-specific improvements.

  The perovskite oxide target is chosen because:
  1. Important material class (ferroelectrics, catalysts)
  2. Universal MLIPs are decent but not great on these
  3. Plenty of structures available from Materials Project
  4. Fine-tuning shows clear improvement

  This is one of the hardest benchmarks because distributed training
  has many failure modes and the agent must understand both ML training
  and HPC systems.
