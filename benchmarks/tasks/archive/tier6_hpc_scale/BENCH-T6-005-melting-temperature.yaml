# Tier 6 Benchmark: Production-Quality Melting Temperature
# Publication-quality phase boundary calculation

id: BENCH-T6-005
name: Melting Temperature Calculation
tier: 6
category: hpc-scale-research

description: |
  Calculate the melting temperature of aluminum using the solid-liquid
  coexistence method. This requires large system sizes and long simulation
  times to achieve publication-quality accuracy, making it a true HPC problem.

prompt: |
  **CRITICAL INSTRUCTIONS - READ CAREFULLY:**

  1. You are EXECUTING this task autonomously - you do ALL the work yourself
  2. You must CREATE simulation inputs and RUN actual calculations
  3. Do NOT stop after literature research - that is only Step 1 of 6
  4. The task is INCOMPLETE until you have determined the melting temperature
  5. Use Write tool to create files, Bash to run LAMMPS simulations

  **START by using TodoWrite to create a checklist of ALL 6 STEPS:**
  - [ ] Step 1: Literature research on Al Tm and EAM potentials
  - [ ] Step 2: Create two-phase solid-liquid system (~15,000 atoms)
  - [ ] Step 3: Run NPT simulations at 5+ temperatures (900-980 K)
  - [ ] Step 4: Analyze phase evolution to bracket Tm
  - [ ] Step 5: Determine Tm and compare to experiment
  - [ ] Step 6: Write report.md with methodology and results

  **Research Question:**
  What is the melting temperature of aluminum according to the EAM potential,
  and how does it compare to the experimental value (933 K)?

  **Background:**
  The melting temperature can be calculated using the two-phase (solid-liquid
  coexistence) method:
  1. Create a system with both solid and liquid phases
  2. Run NPT simulation at various temperatures
  3. At T < Tm: solid grows, liquid shrinks
  4. At T > Tm: liquid grows, solid shrinks
  5. At T = Tm: interface is stable

  This method requires:
  - Large systems (10,000+ atoms) for good interface statistics
  - Long simulations to observe phase evolution
  - Multiple temperatures to bracket Tm

  **Your Study:**

  **Step 1: Literature Research**
  - Find experimental Tm for Al (933 K)
  - Find EAM potential for Al (Zhou, Mishin, or similar)
  - Find any reported Tm from MD with same potential

  **Step 2: Create Two-Phase System**
  Design initial configuration:
  - Total: ~12,000-20,000 atoms
  - Half solid FCC Al, half liquid Al
  - Interface perpendicular to one axis
  - Example: 20×10×10 unit cells solid | 20×10×10 liquid

  Creating the initial state:
  1. Create solid FCC Al at correct density
  2. Melt half by heating to 2000K briefly
  3. Quench to target temperature
  4. OR: Create solid, delete half, fill with liquid snapshot

  **Step 3: Temperature Bracketing**
  Run simulations at multiple temperatures:
  - T = 900 K, 920 K, 940 K, 960 K, 980 K
  - Start with same two-phase configuration
  - Run NPT at each temperature

  For each run:
  - Equilibrate interface: 100 ps
  - Production: 500+ ps
  - Monitor: potential energy, volume, interface position

  **Step 4: Determine Tm**
  Analyze interface behavior:
  - T < Tm: System crystallizes (PE decreases, volume decreases)
  - T > Tm: System melts (PE increases, volume increases)
  - T = Tm: Interface position fluctuates but doesn't drift

  Find Tm by interpolation or bisection.

  **Step 5: Uncertainty Estimation**
  Quantify uncertainty:
  - Run multiple independent simulations
  - Or analyze fluctuations at near-Tm temperatures
  - Report Tm ± uncertainty

  **Step 6: Research Report**
  Write publication-quality report:
  - Complete methodology description
  - Potential energy vs time for each T
  - Volume vs time for each T
  - Interface snapshots at different T
  - Tm with uncertainty
  - Comparison to experiment and other simulations

  Work in: workspaces/benchmarks/BENCH-T6-005/

