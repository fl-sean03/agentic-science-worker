  estimated_time_minutes: 180
  async_completion: true  # Jobs may complete after benchmark timeout
  hpc_resources:
    small_jobs:
      partition: atesting
      cores: 4
    large_jobs:
      partition: amilan
      cores: 32-64
    time_limit: "04:00:00"
  skills_tested:
    - convergence_studies
    - scale_up_methodology
    - resource_estimation
    - scientific_analysis
  notes: |
    This benchmark tests true HPC-scale research. The 32k atom simulation
    is impractical on a workstation but routine on HPC. The scientific
    question (finite-size effects) is real and important for production MD.
