    - name: "report.md"
      description: "Full research report"

  values:
    diffusion_A:
      description: "Diffusion coefficient of A particles"
      expected_range: [1e-5, 1e-2]  # In LJ units
      unit: "σ²/τ"
    diffusion_B:
      description: "Diffusion coefficient of B particles"
      expected_range: [1e-5, 1e-2]
      unit: "σ²/τ"

