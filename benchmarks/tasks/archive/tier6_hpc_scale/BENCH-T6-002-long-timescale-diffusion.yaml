        - Recognized slow dynamics challenge
        - Planned appropriate production length
        - Considered checkpointing

    - name: hpc_execution
      weight: 25
      criteria:
        - Successfully submitted long jobs
        - Appropriate resources for long runs
        - Checkpointing if needed
