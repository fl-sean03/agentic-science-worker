metadata:
  difficulty: expert
  estimated_time_minutes: 240
  async_completion: true
  long_running: true
  hpc_resources:
    partition: amilan
    cores: 32-64
    time_limit: "24:00:00"  # May need long QoS
  skills_tested:
    - long_simulation_planning
    - glass_physics
    - timescale_estimation
    - production_md
  notes: |
    This benchmark tests the agent's ability to handle genuinely long
    simulations. The supercooled KALJ system has slow dynamics that
    require orders of magnitude more simulation time than normal liquids.
    This is a real research problem studied extensively in the glass physics community.
