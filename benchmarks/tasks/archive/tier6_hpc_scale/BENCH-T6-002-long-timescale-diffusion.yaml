      description: "LAMMPS input for equilibration"
    - name: "inputs/kalj_production.lmp"
      description: "LAMMPS input for production"
    - name: "jobs/job_equilibration.slurm"
      description: "HPC job for equilibration"
    - name: "jobs/job_production.slurm"
      description: "HPC job for production"
    - name: "analysis/msd_analysis.png"
