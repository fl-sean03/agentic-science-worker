# Tier 2 Benchmark: Argon Self-Diffusion Study
# Multi-skill task: LAMMPS simulation + Data analysis

id: BENCH-T2-001
name: Argon Self-Diffusion Coefficient
tier: 2
category: simulation-workflow

description: |
  Calculate the self-diffusion coefficient of liquid argon at 94.4K.
  Requires setting up an MD simulation, running it, and analyzing MSD
  to extract the diffusion coefficient. Must compare to experimental values.

prompt: |
  Calculate the self-diffusion coefficient of liquid argon at 94.4K
  (the triple point temperature) using molecular dynamics simulation.

  Requirements:
  1. Use Lennard-Jones potential with standard argon parameters
     (find the correct values - do not invent them)
  2. Create a system of at least 256 atoms at liquid density (~1.4 g/cm³)
  3. Equilibrate the system at 94.4K using NVT ensemble
  4. Run a production NVE simulation (at least 50 ps)
  5. Calculate the mean square displacement (MSD)
  6. Extract the diffusion coefficient from the linear regime of MSD
  7. Compare your result to the experimental value of 2.43 × 10⁻⁵ cm²/s
     (Rahman, Phys. Rev. 136, A405, 1964)

  Deliverables:
  - LAMMPS input file
  - MSD vs time plot (save as diffusion_analysis.png)
  - Written report with:
    - LJ parameters used (with source)
    - Calculated diffusion coefficient with units
    - Comparison to experimental value
    - Discussion of sources of error

  Work in: workspaces/benchmarks/t2-001-argon-diffusion/

skills_required:
  - lammps-simulation
  - data-analysis

time_limit_minutes: 30

milestones:
  - id: M1
    description: "LJ parameters identified"
    weight: 0.15
    validation: |
      ε = 0.238 kcal/mol (or 0.0104 eV, 119.8 K)
      σ = 3.405 Å
      Source cited

  - id: M2
    description: "Simulation input created"
    weight: 0.20
    validation: |
      Valid LAMMPS input with:
      - Correct parameters
      - 256+ atoms
      - Equilibration step
      - Production NVE run
      - MSD computation configured

  - id: M3
    description: "Simulation completed"
    weight: 0.20
    validation: |
      log.lammps shows completion
      MSD data file generated

  - id: M4
    description: "MSD analysis completed"
    weight: 0.25
    validation: |
      MSD plot generated
      Linear fit performed
      D calculated as slope/6

  - id: M5
    description: "Report with comparison"
    weight: 0.20
    validation: |
      D value reported with units
      Comparison to 2.43e-5 cm²/s
      Reasonable agreement (within 50%)

expected_outputs:
  files:
    - workspaces/benchmarks/t2-001-argon-diffusion/input.lmp
    - workspaces/benchmarks/t2-001-argon-diffusion/log.lammps
    - workspaces/benchmarks/t2-001-argon-diffusion/diffusion_analysis.png
    - workspaces/benchmarks/t2-001-argon-diffusion/report.md

  values:
    diffusion_coefficient:
      description: "Calculated self-diffusion coefficient"
      expected_range: [1.2e-5, 3.6e-5]  # cm²/s, within 50% of exp
      unit: "cm²/s"
    relative_error:
      description: "Error vs experimental"
      expected_range: [0, 0.5]  # Within 50%

grading:
  total_points: 100

  categories:
    parameter_provenance:
      weight: 20
      checks:
        - name: "Correct LJ epsilon"
          points: 8
          validation: |
            ε ≈ 0.238 kcal/mol or equivalent
        - name: "Correct LJ sigma"
          points: 7
          validation: |
            σ ≈ 3.405 Å
        - name: "Source cited"
          points: 5
          validation: |
            Reference provided for parameters

    simulation_quality:
      weight: 30
      checks:
        - name: "Appropriate system size"
          points: 8
          validation: |
            N >= 256 atoms
        - name: "Correct temperature"
          points: 7
          validation: |
            T = 94.4 K (±5 K)
        - name: "Proper equilibration"
          points: 8
          validation: |
            NVT equilibration performed
        - name: "Production run adequate"
          points: 7
          validation: |
            NVE run >= 50 ps

    analysis_correctness:
      weight: 30
      checks:
        - name: "MSD calculated"
          points: 10
          validation: |
            MSD data extracted from simulation
        - name: "Linear regime identified"
          points: 10
          validation: |
            Fit performed on diffusive regime
        - name: "D = slope/6 applied"
          points: 10
          validation: |
            Einstein relation correctly used

    result_quality:
      weight: 20
      checks:
        - name: "Result in correct range"
          points: 10
          validation: |
            D between 1.2e-5 and 3.6e-5 cm²/s
        - name: "Correct units"
          points: 5
          validation: |
            Units explicitly stated as cm²/s
        - name: "Comparison made"
          points: 5
          validation: |
            Comparison to Rahman 1964 value

clear_metrics:
  cost:
    max_tokens: 30000
    max_simulation_time: 600  # seconds
    max_api_calls: 15

  latency:
    target_completion: 1800  # 30 minutes

  assurance:
    parameters_must_be_cited: true
    simulation_safety_checks: true

reference_solution:
  location: reference/solutions/t2-001-argon-diffusion/
  notes: |
    Rahman's 1964 simulation: D = 2.43 × 10⁻⁵ cm²/s
    LJ parameters: ε/kB = 119.8 K, σ = 3.405 Å
    Modern simulations typically get D ≈ 2.0-2.8 × 10⁻⁵ cm²/s

