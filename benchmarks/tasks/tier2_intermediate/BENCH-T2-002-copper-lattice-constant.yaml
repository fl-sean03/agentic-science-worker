# Tier 2 Benchmark: Copper Lattice Constant from DFT
# Multi-skill task: Materials database + Quantum ESPRESSO

id: BENCH-T2-002
name: Copper Lattice Constant DFT Calculation
tier: 2
category: dft-workflow

description: |
  Calculate the equilibrium lattice constant of FCC copper using DFT.
  Requires obtaining structure from database, running QE calculation,
  and comparing to experimental value.

prompt: |
  Determine the equilibrium lattice constant of FCC copper using
  DFT with Quantum ESPRESSO.

  Steps:
  1. Get the copper crystal structure from Materials Project
  2. Set up a QE variable-cell relaxation (vc-relax) calculation
  3. Use PBE exchange-correlation functional
  4. Use appropriate pseudopotential for Cu
  5. Converge with respect to k-points and cutoff
  6. Extract the optimized lattice constant
  7. Compare to experimental value (3.615 Å at 298K)

  Requirements:
  - ecutwfc >= 40 Ry (test convergence)
  - k-point grid >= 8x8x8
  - Report convergence tests (optional but good practice)

  Deliverables:
  - QE input file for vc-relax
  - Calculated lattice constant (in Angstroms)
  - Comparison to experimental value (3.615 Å)
  - Brief discussion of DFT accuracy for metals

  Work in: workspaces/benchmarks/t2-002-cu-lattice/

skills_required:
  - materials-database
  - quantum-espresso

time_limit_minutes: 45

milestones:
  - id: M1
    description: "Cu structure obtained"
    weight: 0.15
    validation: |
      Cu FCC structure from Materials Project
      mp-30 or equivalent

  - id: M2
    description: "QE input prepared"
    weight: 0.25
    validation: |
      Valid vc-relax input
      PBE functional
      Appropriate cutoffs and k-points

  - id: M3
    description: "Calculation completed"
    weight: 0.30
    validation: |
      QE output shows convergence
      Final lattice parameters extracted

  - id: M4
    description: "Result analysis"
    weight: 0.30
    validation: |
      Lattice constant reported
      Comparison to 3.615 Å
      Within ~2% (DFT-PBE accuracy)

expected_outputs:
  files:
    - workspaces/benchmarks/t2-002-cu-lattice/cu.in
    - workspaces/benchmarks/t2-002-cu-lattice/cu.out
    - workspaces/benchmarks/t2-002-cu-lattice/report.md

  values:
    lattice_constant:
      description: "DFT-optimized lattice constant"
      expected_range: [3.55, 3.70]  # Å, PBE typically overestimates slightly
      unit: "Angstrom"
    percent_error:
      description: "Error vs experimental"
      expected_range: [0, 3]  # percent

grading:
  total_points: 100

  categories:
    structure_retrieval:
      weight: 15
      checks:
        - name: "Correct structure obtained"
          points: 10
          validation: |
            FCC Cu structure, space group Fm-3m
        - name: "MP-ID reported"
          points: 5
          validation: |
            Materials Project ID documented

    calculation_setup:
      weight: 35
      checks:
        - name: "Correct calculation type"
          points: 10
          validation: |
            calculation = 'vc-relax'
        - name: "Appropriate cutoffs"
          points: 10
          validation: |
            ecutwfc >= 40 Ry
        - name: "Adequate k-points"
          points: 10
          validation: |
            At least 8x8x8 k-grid
        - name: "Valid pseudopotential"
          points: 5
          validation: |
            Pseudopotential exists and is appropriate for PBE

    execution_success:
      weight: 25
      checks:
        - name: "Calculation converged"
          points: 15
          validation: |
            "JOB DONE" in output, no errors
        - name: "Cell relaxation completed"
          points: 10
          validation: |
            Final cell parameters available

    result_quality:
      weight: 25
      checks:
        - name: "Lattice constant reasonable"
          points: 15
          validation: |
            a between 3.55-3.70 Å
        - name: "Comparison made"
          points: 5
          validation: |
            Comparison to 3.615 Å experimental
        - name: "DFT accuracy discussed"
          points: 5
          validation: |
            Acknowledgment of PBE limitations

clear_metrics:
  cost:
    max_tokens: 25000
    max_simulation_time: 1800  # 30 min for QE
    max_api_calls: 10

  latency:
    target_completion: 2700  # 45 minutes

  assurance:
    parameters_must_be_cited: true
    pseudopotential_source: true

reference_solution:
  location: reference/solutions/t2-002-cu-lattice/
  notes: |
    Experimental: a = 3.615 Å (298K)
    PBE typically gives: a ≈ 3.63-3.67 Å (slight overestimate)
    LDA typically gives: a ≈ 3.52-3.56 Å (underestimate)

