# Tier 11 Benchmark: Long-Timescale MLIP Dynamics
# HPC + ML Hybrid - Extended MLIP MD with checkpointing for rare events

id: BENCH-T11-004
name: Long-Timescale MLIP Dynamics
tier: 11
category: hpc-ml-hybrid

description: |
  Run extended MLIP molecular dynamics simulations on HPC to sample
  rare events that require long timescales. This tests:
  1. Setting up long-running HPC jobs with checkpointing
  2. Managing job continuation across wall time limits
  3. Analyzing trajectories for rare events
  4. Calculating diffusion coefficients with proper statistics

  Key insight: Local MD runs are limited to hours. Rare events like
  ion diffusion at moderate temperatures require microsecond timescales,
  achievable only with multi-day HPC runs.

prompt: |
  **Scientific Challenge: Li-ion Diffusion in Solid Electrolyte**

  Solid-state batteries require fast Li-ion conductors. Measuring Li diffusion
  at room temperature experimentally is difficult; MD simulation can help but
  requires very long simulations because diffusion is slow at 300-400K.

  **Target System: Li₃PS₄ (β-phase)**
  - Known solid electrolyte material
  - Li diffuses through PS₄ tetrahedra network
  - Experimental diffusion: ~10⁻⁸ cm²/s at 300K
  - Need ~1 microsecond MD to measure diffusion reliably

  **Your Task: Long-Timescale Diffusion Study**

  1. **Prepare the System**
     - Obtain or create Li₃PS₄ β-phase structure
     - Create supercell (3×3×3 or larger, ~500+ atoms)
     - Structure should have Li, P, S atoms

  2. **Design the Long Simulation**
     - Target: 1 nanosecond minimum (1 microsecond ideal)
     - Temperature: 400K (elevated for faster diffusion)
     - Timestep: 1-2 fs
     - Use MACE or CHGNet (must handle Li, P, S)

  3. **Implement Checkpointing Strategy**
     - HPC wall time limit: 24 hours typically
     - 1 ns at 1 fs timestep = 1,000,000 steps
     - Save checkpoint every 100,000 steps
     - Job must be restartable from checkpoint

  4. **Create SLURM Submission System**
     - Write job script with 24-hour wall time
     - Include checkpoint saving
     - Write continuation script (or use SLURM dependencies)
     - Document how to continue if job times out

  5. **Submit and Manage**
     - Submit initial job to HPC (aa100 for GPU)
     - Monitor progress
     - Continue from checkpoint if needed
     - Collect final trajectory

  6. **Analyze Diffusion**
     - Calculate Mean Square Displacement (MSD) of Li atoms
     - Fit MSD to get diffusion coefficient
     - Apply Einstein relation: D = MSD / (6t)
     - Estimate error bars from trajectory segments

  7. **Compare with Literature**
     - Literature D(Li) in Li₃PS₄: ~10⁻⁷ to 10⁻⁸ cm²/s at 300K
     - At 400K, expect faster: ~10⁻⁶ cm²/s
     - Discuss if MLIP result is reasonable

  **Technical Requirements:**
  - Simulation must use checkpointing
  - Must demonstrate restart capability
  - Minimum 1 ns total simulation time
  - MSD analysis with error estimation

  **Expected Physics:**
  - Li atoms hop between sites
  - P and S form relatively fixed framework
  - Diffusion should be 3D (isotropic in β-Li₃PS₄)
  - D increases with temperature (Arrhenius)

  Work in: workspaces/benchmarks/BENCH-T11-004/

skills_required:
  - mlip-simulation
  - hpc-cluster
  - data-analysis

time_limit_minutes: 120

setup_files: []

expected_outputs:
  files:
    - name: "li3ps4_supercell.xyz"
      description: "Initial Li₃PS₄ structure"
    - name: "run_md.py"
      description: "MLIP MD script with checkpointing"
    - name: "long_md.slurm"
      description: "SLURM script for long MD"
    - name: "continue_md.slurm"
      description: "Script for job continuation"
    - name: "trajectory.xyz"
      description: "Full or partial trajectory"
    - name: "checkpoint.pkl"
      description: "Checkpoint file for restart"
    - name: "msd_analysis.py"
      description: "MSD calculation script"
    - name: "diffusion_report.md"
      description: "Analysis and diffusion coefficient"

grading:
  categories:
    - name: structure_setup
      weight: 15
      criteria:
        - description: "Correct Li₃PS₄ structure obtained/created"
          points: 5
          grader_looks_for: |
            Structure should have:
            - Li, P, S atoms in correct ratio (3:1:4)
            - β-phase crystal structure (or reasonable approximation)
            - Obtained from Materials Project or created manually
        - description: "Appropriate supercell size"
          points: 5
          grader_looks_for: |
            - At least 200 atoms (ideally 500+)
            - Supercell avoids finite-size effects
            - Periodic boundary conditions
        - description: "MLIP can handle the chemistry"
          points: 5
          grader_looks_for: |
            - Verified MLIP supports Li, P, S
            - Tested with short relaxation/MD
            - No element coverage errors

    - name: checkpointing_implementation
      weight: 25
      criteria:
        - description: "Checkpoint saving implemented"
          points: 8
          grader_looks_for: |
            MD script must:
            - Save atomic positions periodically
            - Save velocities for restart
            - Save simulation state (step number, box)
            - Use pickle, ASE trajectory, or similar
        - description: "Restart from checkpoint works"
          points: 8
          grader_looks_for: |
            - Code can read checkpoint file
            - Continue from exact saved state
            - Step counter continues correctly
            - Demonstrated or clearly documented
        - description: "Checkpoint frequency appropriate"
          points: 5
          grader_looks_for: |
            - Save every 100,000 steps or similar
            - Not too frequent (I/O overhead)
            - Not too rare (lose progress on timeout)
        - description: "Job continuation strategy documented"
          points: 4
          grader_looks_for: |
            - Clear instructions for restart
            - Or SLURM dependency chain
            - Or automatic resubmission logic

    - name: hpc_execution
      weight: 25
      criteria:
        - description: "Valid SLURM script for long job"
          points: 6
          grader_looks_for: |
            - Wall time: 12-24 hours
            - GPU request for MLIP
            - Appropriate partition (aa100)
            - Output logging
        - description: "Job submitted and ran"
          points: 6
          grader_looks_for: |
            - Job submitted to HPC
            - Ran for significant time
            - Output exists
        - description: "Achieved meaningful simulation length"
          points: 8
          grader_looks_for: |
            - At least 100 ps of simulation
            - Ideally 1 ns or more
            - Trajectory saved for analysis
        - description: "Handled continuation or completion"
          points: 5
          grader_looks_for: |
            - Either job completed in one run
            - Or successfully continued from checkpoint
            - Or documented how to continue

    - name: diffusion_analysis
      weight: 25
      criteria:
        - description: "Calculated MSD correctly"
          points: 8
          grader_looks_for: |
            MSD calculation should:
            - Track Li atoms specifically
            - Handle periodic boundaries
            - Average over all Li atoms
            - Plot MSD vs time
        - description: "Extracted diffusion coefficient"
          points: 8
          grader_looks_for: |
            - Linear fit to MSD in diffusive regime
            - D = slope / 6 (3D diffusion)
            - Units: cm²/s or m²/s
            - Value reported with uncertainty
        - description: "Error estimation attempted"
          points: 5
          grader_looks_for: |
            - Split trajectory into segments
            - Calculate D for each segment
            - Report standard deviation
            - Or block averaging method
        - description: "Comparison with literature"
          points: 4
          grader_looks_for: |
            - Cited experimental/computational D values
            - Discussed if result is reasonable
            - Explained any discrepancies

    - name: scientific_quality
      weight: 10
      criteria:
        - description: "Physical interpretation of results"
          points: 5
          grader_looks_for: |
            Discussion of:
            - Li hopping mechanism
            - Temperature dependence
            - Comparison of framework vs Li mobility
        - description: "Limitations acknowledged"
          points: 5
          grader_looks_for: |
            - MLIP accuracy for ionic conductors
            - Finite-size effects
            - Statistical uncertainty from limited time

metadata:
  difficulty: hard
  estimated_time_minutes: 100

  hpc_resources:
    partition: aa100
    gpus: 1
    wall_time: "24:00:00"
    may_require_continuation: true

  ml_requirements:
    model: "MACE-MP-0 or CHGNet"
    required_elements: ["Li", "P", "S"]
    simulation_type: "NVT molecular dynamics"

  scientific_context:
    material: "Li₃PS₄ (β-phase)"
    property: "Li-ion diffusion coefficient"
    temperature_k: 400
    expected_D: "~10⁻⁶ cm²/s at 400K"
    target_timescale: "1 nanosecond minimum"

  skills_tested:
    - long_running_hpc_jobs
    - checkpointing
    - job_continuation
    - diffusion_analysis
    - msd_calculation
    - error_estimation

  key_challenge: |
    Managing long simulations that exceed single-job wall time limits.
    The agent must implement robust checkpointing and understand how
    to continue simulations.

  common_failures:
    - "No checkpointing - loses progress on timeout"
    - "Wrong MSD calculation (not unwrapping PBC)"
    - "D in wrong units"
    - "Too short simulation (MSD not in diffusive regime)"
    - "MLIP doesn't support required elements"
    - "Forgetting to save velocities in checkpoint"

notes: |
  Li₃PS₄ is a real solid electrolyte material actively researched for
  solid-state batteries. This benchmark tests a realistic workflow:
  using MLIP to study ionic diffusion at timescales impossible for DFT.

  The 400K temperature is chosen because:
  1. Diffusion is faster (more events in shorter time)
  2. Still below any phase transition
  3. Relevant for battery operating temperatures

  Even 100 ps may show some diffusion, but 1 ns is needed for
  reliable statistics. The checkpoint system is essential for
  reaching these timescales on typical HPC systems.
