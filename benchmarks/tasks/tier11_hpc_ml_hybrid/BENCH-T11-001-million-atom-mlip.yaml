# Tier 11 Benchmark: Million-Atom MLIP Simulation
# HPC + ML Hybrid - Large-scale MLIP MD that requires HPC GPU resources

id: BENCH-T11-001
name: Million-Atom MLIP Simulation
tier: 11
category: hpc-ml-hybrid

description: |
  Run a machine learning interatomic potential (MLIP) molecular dynamics simulation
  on a system too large to fit in local GPU memory. This benchmark tests the agent's
  ability to:
  1. Recognize when local resources are insufficient
  2. Prepare MLIP workflows for HPC execution
  3. Submit and manage GPU jobs on HPC
  4. Analyze results from large-scale simulations

  Key insight: Universal MLIPs like MACE-MP-0 can handle ~10-20k atoms on a 17GB
  local GPU. Research problems (grain boundaries, dislocations, cracks) often need
  100,000+ atoms, requiring HPC A100 GPUs (40-80GB memory).

prompt: |
  **Scientific Challenge: Grain Boundary Migration in Polycrystalline Copper**

  Grain boundaries control many material properties (strength, conductivity, corrosion).
  Studying grain boundary migration requires large systems to avoid finite-size effects.

  **Your Task: Run Large-Scale MLIP MD on HPC**

  1. **Assess the Problem Size**
     - A polycrystalline Cu system with realistic grain boundaries needs ~100,000 atoms
     - Estimate GPU memory requirements for MACE-MP-0 at this scale
     - Determine if this fits on local GPU (17GB RTX 5080)
     - Document your assessment

  2. **Create the Atomic Structure**
     - Build a polycrystalline copper system with 3-4 grains
     - Target size: 100,000 atoms (adjust as needed for memory)
     - Use appropriate methods (Voronoi tessellation or explicit grain construction)
     - Save as structure file compatible with MACE

  3. **Prepare HPC Job Submission**
     - Write a SLURM script for CURC Alpine aa100 partition
     - Request appropriate GPU resources (A100 with 40GB+ memory)
     - Set up the MLIP environment (conda with mace-torch)
     - Include proper module loads for CUDA compatibility

  4. **Create the MD Simulation Script**
     - Use MACE-MP-0 universal potential
     - Run NVT at 600K (enhanced diffusion for observing migration)
     - Simulation length: 100 ps minimum (more if time allows)
     - Save trajectory every 1000 steps
     - Include thermo output for monitoring

  5. **Submit and Monitor**
     - Submit the job to HPC
     - Monitor job status
     - Handle any failures appropriately
     - Retrieve results when complete

  6. **Analyze Results**
     - Calculate basic statistics (energy, temperature stability)
     - If time permits: visualize grain structure
     - Estimate grain boundary mobility if migration observed
     - Compare with literature values for Cu grain boundary migration

  **Important Constraints:**
  - You MUST use HPC for the large simulation - local GPU is insufficient
  - Use the aa100 partition which has A100 GPUs
  - Time limit: 4 hours wall time maximum
  - Document why HPC is necessary (memory analysis)

  **Expected Physics:**
  - At 600K, Cu grain boundaries are mobile
  - Grain boundary migration velocity typically 0.1-10 m/s at this temperature
  - System should remain crystalline (no melting - Cu melts at 1358K)

  Work in: workspaces/benchmarks/BENCH-T11-001/

skills_required:
  - mlip-simulation
  - hpc-cluster
  - data-analysis

time_limit_minutes: 120

setup_files: []

expected_outputs:
  files:
    - name: "memory_assessment.md"
      description: "Analysis of GPU memory requirements showing why HPC is needed"
    - name: "polycrystal_cu.xyz"
      description: "Polycrystalline Cu structure (or similar format)"
    - name: "run_mlip.slurm"
      description: "SLURM job script for HPC submission"
    - name: "run_mlip_md.py"
      description: "Python script for MACE MD simulation"
    - name: "job_output.log"
      description: "Output from HPC job"
    - name: "analysis_report.md"
      description: "Analysis of simulation results"

grading:
  categories:
    - name: resource_assessment
      weight: 20
      criteria:
        - description: "Correctly estimated MACE memory usage for 100k atoms"
          points: 5
          grader_looks_for: |
            Agent should show calculation like:
            - MACE memory ~0.3-0.5 GB per 1000 atoms for MP-0 model
            - 100k atoms → 30-50 GB memory
            - Local GPU has 17GB → insufficient
            - A100 has 40-80GB → sufficient
            Must cite or derive this estimate, not just assert it.
        - description: "Documented why local execution is impossible"
          points: 5
          grader_looks_for: |
            Clear statement that:
            - Tried or calculated local memory limit
            - System exceeds local GPU capacity
            - HPC GPU (A100) is required
        - description: "Selected appropriate HPC partition (aa100)"
          points: 5
          grader_looks_for: |
            SLURM script requests aa100 partition specifically
            for A100 GPUs with large memory.
        - description: "Requested reasonable GPU resources"
          points: 5
          grader_looks_for: |
            - gres=gpu:1 (at least one A100)
            - Wall time reasonable (1-4 hours)
            - Memory request appropriate if specified

    - name: structure_creation
      weight: 20
      criteria:
        - description: "Created polycrystalline structure with multiple grains"
          points: 8
          grader_looks_for: |
            Structure file should show:
            - Copper atoms (atomic number 29 or symbol Cu)
            - Multiple crystallographic orientations
            - ~100,000 atoms (±20% acceptable)
            - Reasonable box dimensions for this count
        - description: "Used appropriate method for grain construction"
          points: 6
          grader_looks_for: |
            Should use one of:
            - Voronoi tessellation (ase.build, ovito)
            - atomsk grain generation
            - Manual construction of bicrystal/tricrystal
            - pymatgen grain boundary builder
            Method should be documented.
        - description: "Structure is physically reasonable"
          points: 6
          grader_looks_for: |
            - FCC copper structure preserved within grains
            - Lattice parameter ~3.6 Å for Cu
            - No overlapping atoms (min distance >2 Å)
            - Periodic boundary conditions appropriate

    - name: hpc_submission
      weight: 25
      criteria:
        - description: "Valid SLURM script with correct directives"
          points: 6
          grader_looks_for: |
            Script must include:
            - #!/bin/bash shebang
            - #SBATCH --partition=aa100
            - #SBATCH --gres=gpu:1
            - #SBATCH --time=XX:XX:XX
            - #SBATCH --output specification
        - description: "Proper environment setup for MLIP on HPC"
          points: 8
          grader_looks_for: |
            Must set up MLIP environment:
            - module load anaconda (or similar)
            - conda activate with appropriate environment
            - CUDA compatibility (module load cuda/11.x or 12.x)
            - Proper Python with mace-torch installed
        - description: "Successfully submitted job to HPC"
          points: 6
          grader_looks_for: |
            Evidence of job submission:
            - sbatch command executed
            - Job ID obtained
            - squeue or job status checked
        - description: "Job completed without HPC-related errors"
          points: 5
          grader_looks_for: |
            No errors related to:
            - Module not found
            - GPU allocation failure
            - Environment issues
            - SLURM directive errors

    - name: simulation_quality
      weight: 20
      criteria:
        - description: "Used MACE-MP-0 or appropriate universal potential"
          points: 5
          grader_looks_for: |
            Python script should load:
            - mace_mp (MACE-MP-0 model)
            - Or explicitly downloaded MACE model
            - Not CHGNet or M3GNet (less scalable)
        - description: "Correct MD setup (NVT, temperature, timestep)"
          points: 5
          grader_looks_for: |
            - Temperature ~600K (or justified alternative)
            - NVT or NPT ensemble
            - Timestep 1-2 fs (appropriate for metals)
            - Adequate equilibration
        - description: "Simulation ran for meaningful duration"
          points: 5
          grader_looks_for: |
            - At least 100 ps simulation time
            - Or 50,000+ MD steps at 2 fs
            - Trajectory saved for analysis
        - description: "Results physically reasonable"
          points: 5
          grader_looks_for: |
            - Energy relatively stable (not drifting badly)
            - Temperature maintained at target
            - No system explosion or collapse
            - Cu remains solid (below melting point)

    - name: analysis
      weight: 15
      criteria:
        - description: "Extracted and plotted energy/temperature traces"
          points: 5
          grader_looks_for: |
            - Energy vs time plot
            - Temperature vs time plot
            - Statistics (mean, std) reported
        - description: "Discussed grain boundary behavior"
          points: 5
          grader_looks_for: |
            - Any observation of grain structure evolution
            - Or acknowledgment that longer simulation needed
            - Comparison with expected GB migration rates
        - description: "Compared with literature values"
          points: 5
          grader_looks_for: |
            - Cited Cu grain boundary migration studies
            - Typical migration rates: 0.1-10 m/s at 600K
            - Or explained why comparison not possible (too short sim)

metadata:
  difficulty: hard
  estimated_time_minutes: 90

  hpc_resources:
    partition: aa100
    gpus: 1
    gpu_memory_required_gb: 40
    time_limit: "04:00:00"

  ml_requirements:
    model: "MACE-MP-0"
    minimum_atoms: 50000
    target_atoms: 100000

  scientific_context:
    material: "Copper (Cu)"
    phenomenon: "Grain boundary migration"
    temperature_k: 600
    expected_outcome: "Stable polycrystal with potential GB migration"

  skills_tested:
    - large_scale_simulation
    - hpc_gpu_workflows
    - memory_management
    - mlip_deployment
    - async_job_management

  key_challenge: |
    The main test is recognizing that local resources are insufficient
    and correctly setting up the HPC pipeline. Many agents will try to
    force local execution or reduce system size too much.

  common_failures:
    - "Trying to run 100k atoms on local GPU"
    - "Reducing system to 10k atoms (defeats purpose)"
    - "Missing CUDA module on HPC"
    - "Wrong conda environment activation"
    - "Timeout due to insufficient wall time"

notes: |
  This benchmark tests the fundamental capability of recognizing when
  HPC resources are necessary and correctly using them. It combines:
  - ML knowledge (MACE memory scaling)
  - HPC skills (SLURM, modules, GPU jobs)
  - Materials science (grain boundaries, appropriate temperature)
  - Scientific judgment (system size vs accuracy tradeoff)
