# Tier 11 Benchmark: Massive High-Throughput Screening
# HPC + ML Hybrid - Screen 500+ materials using SLURM job arrays

id: BENCH-T11-002
name: Massive High-Throughput Screening
tier: 11
category: hpc-ml-hybrid

description: |
  Screen a large number of candidate materials using MLIP-based evaluation
  with HPC job arrays. This tests:
  1. Generating large candidate sets programmatically
  2. Setting up SLURM job arrays for parallel execution
  3. Collecting and aggregating results from many parallel jobs
  4. Ranking and filtering based on computed properties

  Key insight: Local screening can handle ~100 materials/day interactively.
  HPC job arrays can evaluate 500-1000+ materials in parallel, completing
  in hours what would take days locally.

prompt: |
  **Scientific Challenge: Finding Stable Ternary Oxide Compositions**

  You are searching for new stable ternary oxide compositions of the form
  A₂BO₄ (spinel-like) where A and B are transition metals. There are many
  possible combinations, and you need to screen them efficiently.

  **Your Task: High-Throughput MLIP Screening on HPC**

  1. **Generate Candidate Structures (Local)**
     - Create 500 candidate A₂BO₄ compositions
     - A elements: Ti, V, Cr, Mn, Fe, Co, Ni, Cu, Zn (9 options)
     - B elements: Ti, V, Cr, Mn, Fe, Co, Ni, Cu, Zn, Al, Ga (11 options)
     - Generate distinct A-B pairs (A ≠ B)
     - Create initial structures using spinel prototype (Fd-3m)
     - Save each structure as a separate file

  2. **Design the Screening Workflow**
     - Each structure needs: relaxation + energy calculation
     - Use CHGNet or M3GNet (faster than MACE for screening)
     - Calculate formation energy per atom
     - Estimate stability relative to competing phases

  3. **Create SLURM Job Array**
     - Write job array script for 500 structures
     - Use amilan partition (CPU) or aa100 (GPU)
     - Each task processes one structure
     - Time limit: 10-30 minutes per structure
     - Handle array indexing correctly ($SLURM_ARRAY_TASK_ID)

  4. **Implement Single-Structure Evaluator**
     - Script that takes structure index as argument
     - Loads corresponding structure file
     - Runs MLIP relaxation
     - Calculates energy
     - Saves result to indexed output file

  5. **Submit and Monitor**
     - Submit the job array
     - Monitor progress (how many completed?)
     - Handle any failed jobs
     - Know when all jobs are done

  6. **Aggregate Results**
     - Collect all individual results into one dataset
     - Calculate formation energies
     - Rank by stability
     - Identify top 20 candidates

  7. **Analysis Report**
     - List top 20 most stable compositions
     - Discuss chemical trends (which A-B pairs are stable?)
     - Compare with known stable ternary oxides
     - Identify candidates for DFT validation

  **Technical Requirements:**
  - Use SLURM job arrays (--array=0-499 or similar)
  - Each array task must be independent
  - Results must be collectable after all jobs finish
  - Must handle partial failures gracefully

  **Expected Results:**
  - Many compositions will be unstable (high formation energy)
  - Some known stable spinels should appear (Fe₃O₄, Co₃O₄, Mn₃O₄)
  - Top candidates should have formation energy < 0 eV/atom
  - Chemical trends: early TM + late TM often favorable

  Work in: workspaces/benchmarks/BENCH-T11-002/

skills_required:
  - mlip-simulation
  - hpc-cluster
  - data-analysis

time_limit_minutes: 90

setup_files: []

expected_outputs:
  files:
    - name: "candidates/"
      description: "Directory with 500 structure files"
    - name: "evaluate_structure.py"
      description: "Script to evaluate a single structure"
    - name: "screening.slurm"
      description: "SLURM job array script"
    - name: "results/"
      description: "Directory with individual result files"
    - name: "aggregate_results.py"
      description: "Script to combine all results"
    - name: "screening_results.csv"
      description: "Combined results with rankings"
    - name: "screening_report.md"
      description: "Analysis and top candidates"

grading:
  categories:
    - name: candidate_generation
      weight: 20
      criteria:
        - description: "Generated correct number of candidates (~500)"
          points: 5
          grader_looks_for: |
            - 400-500 structure files created
            - Or clear justification for different number
            - Files named systematically (indexed or named by composition)
        - description: "Structures are valid A₂BO₄ compositions"
          points: 5
          grader_looks_for: |
            - Spinel-like structure (Fd-3m or similar)
            - Correct stoichiometry: A₂BO₄
            - Transition metals for A and B sites
            - Oxygen atoms present
        - description: "Systematic enumeration of compositions"
          points: 5
          grader_looks_for: |
            - Code that generates all A-B pairs
            - Avoids duplicates (A-B same as B-A should be handled)
            - Covers diverse chemical space
        - description: "Structures physically reasonable"
          points: 5
          grader_looks_for: |
            - Reasonable lattice parameters (8-9 Å for spinels)
            - Correct number of atoms per unit cell
            - No overlapping atoms

    - name: job_array_setup
      weight: 25
      criteria:
        - description: "Valid SLURM job array specification"
          points: 8
          grader_looks_for: |
            SLURM script must have:
            - #SBATCH --array=0-499 (or similar range)
            - Correct partition specification
            - Reasonable time per task (10-30 min)
            - Output file pattern: %A_%a for array jobs
        - description: "Correct use of SLURM_ARRAY_TASK_ID"
          points: 8
          grader_looks_for: |
            Script correctly uses $SLURM_ARRAY_TASK_ID to:
            - Select which structure to process
            - Name output files uniquely
            - Avoid race conditions
        - description: "Independent task execution"
          points: 5
          grader_looks_for: |
            Each array task must:
            - Read only its own input
            - Write only its own output
            - Not depend on other tasks
        - description: "Appropriate resource requests"
          points: 4
          grader_looks_for: |
            - For CPU: reasonable core count
            - For GPU: one GPU per task
            - Memory appropriate for MLIP

    - name: screening_workflow
      weight: 20
      criteria:
        - description: "MLIP evaluation script is correct"
          points: 7
          grader_looks_for: |
            evaluate_structure.py should:
            - Take index or structure path as argument
            - Load appropriate MLIP (CHGNet/M3GNet/MACE)
            - Perform geometry relaxation
            - Calculate total energy
            - Save results to file
        - description: "Formation energy calculation attempted"
          points: 7
          grader_looks_for: |
            Should calculate:
            - E_formation = E_compound - sum(E_elements)
            - Or at least E_per_atom for comparison
            - Reference energies for elements (can be from MLIP)
        - description: "Results format suitable for aggregation"
          points: 6
          grader_looks_for: |
            Output files should be:
            - Machine readable (JSON, CSV, or similar)
            - Consistently formatted
            - Include composition and energy

    - name: job_execution
      weight: 15
      criteria:
        - description: "Job array submitted successfully"
          points: 5
          grader_looks_for: |
            - sbatch command with array job
            - Job ID returned
            - Jobs visible in queue
        - description: "Majority of jobs completed"
          points: 5
          grader_looks_for: |
            - At least 80% of array tasks completed
            - Failures are documented
            - Results exist for completed jobs
        - description: "Handled job monitoring and completion"
          points: 5
          grader_looks_for: |
            - Checked job status (squeue, sacct)
            - Waited for completion (or reasonable subset)
            - Knew when to proceed to aggregation

    - name: results_analysis
      weight: 20
      criteria:
        - description: "Successfully aggregated results"
          points: 6
          grader_looks_for: |
            - Single file with all results
            - Composition, energy for each
            - Sorted by stability metric
        - description: "Identified top candidates correctly"
          points: 6
          grader_looks_for: |
            - Top 20 listed with energies
            - Known stable compounds appear (if in candidate set)
            - Fe₃O₄, Co₃O₄, Mn₃O₄ related compositions
        - description: "Chemical trend analysis"
          points: 4
          grader_looks_for: |
            Discussion of:
            - Which element combinations are stable
            - Expected patterns (oxidation states, ionic radii)
        - description: "Recommendations for validation"
          points: 4
          grader_looks_for: |
            - Suggests DFT validation for top candidates
            - Acknowledges MLIP limitations
            - Scientific reasoning for selections

metadata:
  difficulty: hard
  estimated_time_minutes: 75

  hpc_resources:
    partition: "amilan or aa100"
    array_size: 500
    time_per_task: "00:20:00"
    total_tasks: 500

  ml_requirements:
    model: "CHGNet or M3GNet"
    task: "Geometry optimization + energy"
    structures_count: 500

  scientific_context:
    material_class: "Ternary transition metal oxides"
    structure_type: "Spinel (A₂BO₄)"
    target_property: "Thermodynamic stability"
    validation_method: "DFT for top candidates"

  skills_tested:
    - high_throughput_computing
    - slurm_job_arrays
    - result_aggregation
    - chemical_space_exploration
    - mlip_screening

  key_challenge: |
    The challenge is managing 500 parallel independent calculations
    and correctly aggregating results. Many agents struggle with
    job array syntax or result collection.

  common_failures:
    - "Submitting 500 individual jobs instead of array"
    - "Wrong SLURM_ARRAY_TASK_ID usage"
    - "Race conditions in result writing"
    - "Not waiting for all jobs to complete"
    - "Incorrect formation energy calculation"
    - "Missing reference energies for elements"

notes: |
  This benchmark tests high-throughput computing patterns essential for
  materials discovery. The 500-structure scale is realistic for initial
  screening of a chemical space. The job array pattern is fundamental
  to HPC workflows.

  Expected runtime: 2-4 hours for all jobs to complete, plus setup
  and analysis time. The benchmark can be considered successful even
  if some jobs fail, as long as the majority complete and results
  are properly aggregated.
