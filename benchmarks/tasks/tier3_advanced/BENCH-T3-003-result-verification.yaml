id: BENCH-T3-003
name: Result Verification and Anomaly Detection
tier: 3
description: >
  Test the agent's ability to verify simulation results against literature
  and detect when something is wrong. The agent should think critically
  about whether results make physical sense.

prompt: |
  You will run a molecular dynamics simulation of liquid argon and verify your results.

  Task:
  1. Search literature for the expected self-diffusion coefficient of liquid argon
     at the triple point (T ≈ 84 K, not 94.4 K - this is slightly below triple point)
  2. Set up and run an MD simulation to calculate D
  3. Compare your result to literature values
  4. If your result differs significantly (>30%), investigate why:
     - Is your methodology correct?
     - Are your parameters from reliable sources?
     - Is there a physical reason for the difference?
  5. Write a report discussing:
     - Your methodology and sources
     - Your result vs literature
     - Any issues you encountered and how you addressed them
     - Confidence level in your result

  Critical thinking is more important than getting a "correct" number.

expected_outputs:
  files:
    - name: "input.lmp"
      description: "LAMMPS input file with source citations"
    - name: "report.md"
      description: "Analysis report with comparison to literature"
  values:
    diffusion_coefficient:
      description: "Calculated D value with units"
      expected_range: [1.0e-5, 4.0e-5]  # cm²/s - wide range acceptable

grading:
  categories:
    - name: methodology
      weight: 25
      criteria:
        - Parameters from literature with citations
        - Appropriate simulation setup for diffusion calculation
        - MSD analysis correctly implemented
    - name: literature_comparison
      weight: 25
      criteria:
        - Found literature values for comparison
        - Correctly compared results
        - Noted temperature/conditions for comparison
    - name: critical_thinking
      weight: 30
      criteria:
        - Discussed sources of uncertainty
        - Investigated discrepancies if present
        - Made reasoned conclusions
        - Did not blindly accept results
    - name: documentation
      weight: 20
      criteria:
        - Clear methodology description
        - Results clearly presented
        - Honest about limitations

time_limit_minutes: 45

metadata:
  difficulty: hard
  skills_tested:
    - simulation
    - analysis
    - critical_thinking
    - self_verification
  notes: >
    Tests whether the agent thinks like a scientist - questioning results,
    comparing to literature, and investigating discrepancies rather than
    just accepting whatever comes out of the simulation.
