# Tier 3 Benchmark: Hydrogen Diffusion in Palladium
# Advanced research workflow: Literature → Database → Simulation → Analysis

id: BENCH-T3-001
name: Hydrogen Diffusion in Palladium
tier: 3
category: research-workflow

description: |
  Complete study of hydrogen diffusion in palladium - a classic problem in
  materials science with applications in hydrogen storage and purification.
  Requires literature research, structure setup, MD simulation, and analysis.

prompt: |
  Conduct a computational study of hydrogen diffusion in palladium metal.

  This is an open-ended research task. You should:

  1. **Literature Review**
     - Find the experimental diffusion coefficient of H in Pd at 300K
     - Identify suitable force field parameters (EAM, MEAM, or other)
     - Note any computational studies for comparison

  2. **Structure Preparation**
     - Get Pd FCC structure from Materials Project
     - Create a supercell large enough for diffusion study
     - Insert hydrogen atoms at interstitial sites (octahedral or tetrahedral)
     - Determine appropriate H concentration for dilute limit

  3. **Simulation**
     - Equilibrate the H-Pd system at 300K
     - Run production MD long enough to observe diffusive behavior
     - Calculate mean square displacement of hydrogen atoms

  4. **Analysis**
     - Extract diffusion coefficient from MSD
     - Compare to experimental/literature values
     - Discuss sources of error and force field accuracy

  5. **Report**
     - Write a scientific report summarizing methodology and results
     - Include figures: structure visualization, MSD plot, diffusion analysis
     - Discuss implications for hydrogen storage/permeation

  Work in: workspaces/benchmarks/t3-001-h-pd-diffusion/

skills_required:
  - literature-search
  - materials-database
  - lammps-simulation
  - data-analysis

time_limit_minutes: 90

milestones:
  - id: M1
    description: "Literature review completed"
    weight: 0.15
    validation: |
      - Experimental D value found (~2.9 × 10⁻⁹ m²/s at 300K)
      - Force field identified with citation
      - At least 2 relevant papers cited

  - id: M2
    description: "Pd structure obtained and prepared"
    weight: 0.15
    validation: |
      - Pd FCC from Materials Project
      - Appropriate supercell size (>200 Pd atoms)
      - H atoms inserted at interstitial sites

  - id: M3
    description: "Simulation setup complete"
    weight: 0.15
    validation: |
      - Valid LAMMPS input with H-Pd potential
      - Appropriate H concentration (dilute)
      - Temperature control at 300K

  - id: M4
    description: "MD simulation completed"
    weight: 0.20
    validation: |
      - Equilibration performed
      - Production run sufficient for diffusion
      - MSD data collected for H atoms

  - id: M5
    description: "Diffusion analysis completed"
    weight: 0.20
    validation: |
      - MSD vs time plotted
      - Linear regime identified
      - D calculated with correct formula

  - id: M6
    description: "Report with comparison"
    weight: 0.15
    validation: |
      - D value reported with units
      - Comparison to experimental
      - Discussion of accuracy/limitations

expected_outputs:
  files:
    - workspaces/benchmarks/t3-001-h-pd-diffusion/literature_review.md
    - workspaces/benchmarks/t3-001-h-pd-diffusion/input.lmp
    - workspaces/benchmarks/t3-001-h-pd-diffusion/data.hpd
    - workspaces/benchmarks/t3-001-h-pd-diffusion/log.lammps
    - workspaces/benchmarks/t3-001-h-pd-diffusion/msd_analysis.png
    - workspaces/benchmarks/t3-001-h-pd-diffusion/report.md

  values:
    diffusion_coefficient:
      description: "H diffusion coefficient in Pd at 300K"
      expected_range: [1e-10, 1e-8]  # m²/s, wide range for computational
      unit: "m²/s"
    experimental_comparison:
      description: "Within order of magnitude of experiment"
      expected: true

grading:
  total_points: 100

  categories:
    literature_quality:
      weight: 15
      checks:
        - name: "Found experimental value"
          points: 5
          validation: |
            D ≈ 2-4 × 10⁻⁹ m²/s at 300K referenced
        - name: "Force field sourced"
          points: 5
          validation: |
            EAM/MEAM potential with citation
        - name: "Relevant papers cited"
          points: 5
          validation: |
            >= 2 computational studies referenced

    structure_preparation:
      weight: 20
      checks:
        - name: "Pd structure correct"
          points: 8
          validation: |
            FCC Pd, correct lattice constant
        - name: "Supercell appropriate"
          points: 6
          validation: |
            Large enough for diffusion (>200 atoms)
        - name: "H insertion reasonable"
          points: 6
          validation: |
            Interstitial sites, dilute concentration

    simulation_quality:
      weight: 30
      checks:
        - name: "Valid force field"
          points: 10
          validation: |
            H-Pd potential runs without errors
        - name: "Equilibration adequate"
          points: 8
          validation: |
            Temperature/energy stable before production
        - name: "Production run sufficient"
          points: 8
          validation: |
            Long enough to see diffusive MSD
        - name: "MSD computed correctly"
          points: 4
          validation: |
            H atom MSD tracked

    analysis_quality:
      weight: 20
      checks:
        - name: "MSD analysis correct"
          points: 10
          validation: |
            Linear regime fit, D = slope/(2*dim)
        - name: "Reasonable result"
          points: 5
          validation: |
            Within 1-2 orders of magnitude of exp
        - name: "Good visualization"
          points: 5
          validation: |
            Clear MSD plot with fit

    report_quality:
      weight: 15
      checks:
        - name: "Complete methodology"
          points: 5
          validation: |
            All steps documented
        - name: "Results presented"
          points: 5
          validation: |
            D value, comparison, figures
        - name: "Discussion of limitations"
          points: 5
          validation: |
            Sources of error acknowledged

clear_metrics:
  cost:
    max_tokens: 60000
    max_simulation_time: 3600
    max_api_calls: 30

  latency:
    target_completion: 5400  # 90 minutes

  assurance:
    parameters_must_be_cited: true
    force_field_validation: required

reference_solution:
  location: reference/solutions/t3-001-h-pd-diffusion/
  notes: |
    Experimental D(H in Pd) ≈ 2.9 × 10⁻⁹ m²/s at 300K
    Computational values vary widely depending on potential
    EAM potentials: Zhou (2004), Sheng (2011)
    Challenge: Getting correct H interstitial sites and dynamics

