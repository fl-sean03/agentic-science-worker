# Tier 3 Benchmark: Silicon Band Structure Study
# Advanced DFT workflow: Database → SCF → Bands → Analysis

id: BENCH-T3-002
name: Silicon Band Structure Calculation
tier: 3
category: dft-workflow

description: |
  Calculate the electronic band structure of silicon and identify
  key features (band gap, effective masses, band character).
  Classic DFT benchmark for semiconductor physics.

prompt: |
  Perform a complete band structure calculation of silicon using
  Quantum ESPRESSO and analyze the results.

  This research task requires:

  1. **Structure Setup**
     - Get Si diamond structure from Materials Project
     - Set up QE input with appropriate parameters
     - Select suitable pseudopotential

  2. **SCF Calculation**
     - Converge the charge density
     - Test k-point and cutoff convergence
     - Document convergence choices

  3. **Band Structure Calculation**
     - Define high-symmetry k-path: Γ → X → W → K → Γ → L
     - Calculate bands along this path
     - Ensure sufficient k-points for smooth bands

  4. **Analysis**
     - Plot the band structure
     - Identify the band gap (direct vs indirect)
     - Find the valence band maximum and conduction band minimum locations
     - Compare to experimental band gap (1.12 eV)
     - Discuss DFT band gap underestimation

  5. **Report**
     - Scientific report with methodology
     - Band structure plot with labeled high-symmetry points
     - Discussion of DFT accuracy for semiconductors

  Work in: workspaces/benchmarks/t3-002-si-bands/

skills_required:
  - materials-database
  - quantum-espresso
  - data-analysis

time_limit_minutes: 75

milestones:
  - id: M1
    description: "Structure and pseudopotential ready"
    weight: 0.15
    validation: |
      Si diamond structure obtained
      Appropriate Si pseudopotential selected

  - id: M2
    description: "SCF converged"
    weight: 0.20
    validation: |
      SCF calculation completed
      Convergence documented

  - id: M3
    description: "Bands calculation completed"
    weight: 0.25
    validation: |
      High-symmetry path defined correctly
      Band calculation finished

  - id: M4
    description: "Band analysis completed"
    weight: 0.25
    validation: |
      Band gap identified
      VBM/CBM locations determined
      Plot generated

  - id: M5
    description: "Report with comparison"
    weight: 0.15
    validation: |
      Comparison to 1.12 eV experimental
      DFT limitations discussed

expected_outputs:
  files:
    - workspaces/benchmarks/t3-002-si-bands/si_scf.in
    - workspaces/benchmarks/t3-002-si-bands/si_bands.in
    - workspaces/benchmarks/t3-002-si-bands/si_scf.out
    - workspaces/benchmarks/t3-002-si-bands/si_bands.out
    - workspaces/benchmarks/t3-002-si-bands/band_structure.png
    - workspaces/benchmarks/t3-002-si-bands/report.md

  values:
    band_gap:
      description: "DFT band gap"
      expected_range: [0.4, 0.8]  # eV, PBE underestimates
      unit: "eV"
    gap_type:
      description: "Direct or indirect gap"
      expected: "indirect"
    vbm_location:
      description: "Valence band maximum location"
      expected: "Gamma"
    cbm_location:
      description: "Conduction band minimum location"
      expected: "near X (Delta minimum)"

grading:
  total_points: 100

  categories:
    setup_quality:
      weight: 20
      checks:
        - name: "Correct structure"
          points: 8
          validation: |
            Si diamond, correct lattice constant
        - name: "Appropriate pseudopotential"
          points: 6
          validation: |
            ONCV, PAW, or NC Si pseudopotential
        - name: "Reasonable cutoffs"
          points: 6
          validation: |
            ecutwfc >= 30 Ry

    scf_quality:
      weight: 20
      checks:
        - name: "SCF converged"
          points: 12
          validation: |
            Convergence achieved
        - name: "Adequate k-points"
          points: 8
          validation: |
            k-grid >= 6x6x6 for SCF

    bands_calculation:
      weight: 25
      checks:
        - name: "K-path correct"
          points: 10
          validation: |
            Includes Γ, X, W, K, L points
        - name: "Bands completed"
          points: 10
          validation: |
            bands.out shows completion
        - name: "Sufficient k-points on path"
          points: 5
          validation: |
            Smooth bands (>50 points total)

    analysis_quality:
      weight: 25
      checks:
        - name: "Band gap identified"
          points: 10
          validation: |
            Eg reported in eV
        - name: "Gap type correct"
          points: 8
          validation: |
            Identified as indirect
        - name: "Good band plot"
          points: 7
          validation: |
            Clear plot with labeled points

    report_quality:
      weight: 10
      checks:
        - name: "Comparison to experiment"
          points: 5
          validation: |
            Discusses 1.12 eV experimental value
        - name: "DFT limitations"
          points: 5
          validation: |
            Band gap underestimation explained

reference_solution:
  location: reference/solutions/t3-002-si-bands/
  notes: |
    Experimental Si band gap: 1.12 eV (indirect)
    DFT-PBE typically gives: 0.5-0.7 eV
    VBM at Γ, CBM along Δ (Γ-X) direction

