# Tier 1 Benchmark: NVT Equilibration
# Single-skill task testing LAMMPS MD at constant temperature

id: BENCH-T1-002
name: NVT Temperature Equilibration
tier: 1
category: lammps-simulation

description: |
  Run NVT molecular dynamics to equilibrate a system at target temperature.
  Tests understanding of thermostats and equilibration monitoring.

prompt: |
  Run an NVT molecular dynamics simulation to equilibrate a
  Lennard-Jones argon system at 94.4 K (triple point temperature).

  Requirements:
  - Start from an FCC lattice with 256 atoms
  - LJ parameters for argon: ε = 0.238 kcal/mol, σ = 3.405 Å
  - Density: approximately 1.4 g/cm³ (liquid argon density)
  - Use Nosé-Hoover thermostat with damping parameter 100 timesteps
  - Timestep: 1 fs
  - Run for 10,000 steps
  - Output thermodynamic data every 100 steps

  Report:
  1. Initial and final temperatures
  2. Average temperature over last 5000 steps
  3. Temperature fluctuation (standard deviation)

  Work in: workspaces/benchmarks/t1-002-nvt/

skills_required:
  - lammps-simulation

time_limit_minutes: 15

expected_outputs:
  files:
    - workspaces/benchmarks/t1-002-nvt/input.lmp
    - workspaces/benchmarks/t1-002-nvt/log.lammps
  values:
    average_temperature:
      description: "Average temperature over last half of run"
      expected_range: [90, 100]  # K, should be close to 94.4 K
      unit: "K"
    temperature_stddev:
      description: "Temperature standard deviation"
      expected_range: [1, 15]  # Reasonable fluctuation for this system size
      unit: "K"

grading:
  total_points: 100

  categories:
    setup_correctness:
      weight: 25
      checks:
        - name: "Correct thermostat"
          points: 10
          validation: |
            fix ... nvt OR fix ... temp/rescale with Nose-Hoover
        - name: "Target temperature correct"
          points: 5
          validation: |
            Target temp is 94.4 K (or close)
        - name: "Appropriate timestep"
          points: 5
          validation: |
            timestep between 0.5 and 2 fs
        - name: "Thermo output configured"
          points: 5
          validation: |
            thermo command present with reasonable frequency

    execution_success:
      weight: 25
      checks:
        - name: "Simulation completed full run"
          points: 15
          validation: |
            Log shows 10000 steps completed
        - name: "No explosions or errors"
          points: 10
          validation: |
            No unreasonable energies, no ERROR messages

    analysis_quality:
      weight: 25
      checks:
        - name: "Temperature statistics calculated"
          points: 15
          validation: |
            Agent computed average and std dev
        - name: "Correct analysis period"
          points: 10
          validation: |
            Statistics from equilibrated portion (last 5000 steps)

    result_quality:
      weight: 25
      checks:
        - name: "Temperature converged to target"
          points: 15
          validation: |
            |avg_temp - 94.4| < 5 K
        - name: "Reasonable fluctuations"
          points: 10
          validation: |
            stddev within expected range for system size

reference_solution:
  location: reference/solutions/t1-002-nvt/
  notes: |
    For 256 atoms at 94.4 K, expect temperature fluctuations
    of approximately √(2/3N) * T ≈ 5 K

metadata:
  author: "benchmark-system"
  created: "2025-01-16"
  difficulty: "easy"
  estimated_tokens: 3000
  tags:
    - lammps
    - nvt
    - thermostat
    - equilibration
