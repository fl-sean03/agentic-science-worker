# Tier 14 Benchmark: Simple Compute Choice
# Test agent's ability to choose appropriate backend when primary is unavailable

id: BENCH-T14-001
name: Simple Compute Choice
tier: 14
category: compute-decision

description: |
  Test the agent's ability to choose an appropriate compute backend when the
  primary option (HPC) is unavailable. The agent should recognize the
  constraint and select a viable alternative.

prompt: |
  **Task: Run Argon Diffusion Simulation**

  Calculate the self-diffusion coefficient of liquid argon at 94.4K using
  a Lennard-Jones potential and molecular dynamics simulation.

  **Compute Situation:**
  - HPC cluster is currently UNREACHABLE (network/VPN issue)
  - You have local compute available (RTX 5080 GPU, 24 cores)
  - You have VAST AI cloud available (~$0.25/hr for RTX 4090)

  **Job Requirements:**
  - ~500 atoms, ~100,000 timesteps
  - Expected runtime: 10-30 minutes
  - GPU acceleration helpful but not required

  **Your Task:**

  1. **Assess compute options**
     - Which backends are available?
     - What are the tradeoffs?
     - Document your decision

  2. **Make a choice and justify**
     - Select the most appropriate backend
     - Explain why this is the best choice

  3. **Execute the simulation**
     - Run the job on your chosen backend
     - Track actual runtime and resource usage

  4. **Report results**
     - Diffusion coefficient with comparison to literature
     - Compute choice rationale
     - Cost/time analysis

  Work in: workspaces/benchmarks/BENCH-T14-001/

constraints:
  hpc_available: false
  vast_available: true
  local_available: true
  job_scale: small

expected_behavior:
  decision: local_preferred
  rationale: |
    For a small job (<30 min), local compute is preferred because:
    - No cost (vs VAST billing)
    - No setup overhead
    - Local GPU is capable
    Only use VAST if local is insufficient or if time is critical.

skills_required:
  - lammps-simulation
  - data-analysis
  - vast-cloud

time_limit_minutes: 45

expected_outputs:
  files:
    - name: "compute_decision.md"
      description: "Documentation of compute choice rationale"
    - name: "inputs/argon.lmp"
      description: "LAMMPS input file"
    - name: "results/diffusion.txt"
      description: "Calculated diffusion coefficient"
    - name: "results/timing.txt"
      description: "Job timing information"
    - name: "report.md"
      description: "Full report with results and analysis"

  values:
    diffusion_coefficient:
      description: "Calculated D value"
      expected_range: [1.5e-5, 3.5e-5]
      unit: "cm²/s"
    compute_backend_used:
      description: "Which backend was used"
      expected: "local"

grading:
  categories:
    - name: situation_assessment
      weight: 20
      criteria:
        - Correctly identified HPC unavailable
        - Assessed local capabilities
        - Considered VAST option
        - Understood job requirements

    - name: decision_quality
      weight: 30
      criteria:
        - Made appropriate choice (local for small job)
        - Justified decision clearly
        - Considered cost vs time
        - Didn't overcomplicate

    - name: execution
      weight: 30
      criteria:
        - Job ran successfully
        - Correct results obtained
        - Timing tracked
        - No errors

    - name: documentation
      weight: 20
      criteria:
        - Clear decision documentation
        - Rationale well-explained
        - Results properly reported
        - Cost/time analysis included

metadata:
  difficulty: easy
  estimated_time_minutes: 30
  skills_tested:
    - backend_selection
    - constraint_handling
    - cost_awareness
  notes: |
    This is the simplest compute decision benchmark. The correct answer is
    to use local compute since the job is small and HPC isn't needed. Using
    VAST would be wasteful but not wrong per se.
