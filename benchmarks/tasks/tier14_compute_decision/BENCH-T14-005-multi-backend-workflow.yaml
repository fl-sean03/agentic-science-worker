# Tier 14 Benchmark: Multi-Backend Workflow
# Test agent's ability to orchestrate work across multiple compute backends

id: BENCH-T14-005
name: Multi-Backend Workflow
tier: 14
category: compute-decision

description: |
  Test the agent's ability to design and execute a workflow that uses
  different compute backends for different phases based on their
  requirements.

prompt: |
  **Task: Complete Research Workflow**

  Conduct a study of lithium diffusion in Li3PS4 (solid electrolyte).
  This involves multiple phases with different compute requirements:

  **Phase 1: Literature & Setup (CPU, local)**
  - Search literature for Li3PS4 diffusion methodology
  - Find appropriate MLIP or force field
  - Download/generate crystal structure
  - Prepare input files

  **Phase 2: Structure Relaxation (GPU, fast)**
  - Relax Li3PS4 structure with MACE-MP
  - Optimize lattice parameters
  - Verify stability

  **Phase 3: NVT Equilibration (GPU, medium)**
  - Run 50ps NVT at target temperature
  - Equilibrate system
  - Verify temperature stability

  **Phase 4: Production MD (GPU, long)**
  - Run 500ps production trajectory
  - Track Li positions over time
  - This is the longest phase

  **Phase 5: Analysis (CPU, local)**
  - Calculate MSD from trajectory
  - Extract diffusion coefficient
  - Compare to literature

  **Compute Options:**
  - Local: Good for phases 1, 2, 5. Possible for 3, 4 but slow.
  - VAST AI: Good for GPU phases (2, 3, 4). Pay per hour.
  - HPC: Good for phase 4 (long production). Currently unavailable.

  **Your Task:**

  1. **Design multi-backend workflow**
     - Which backend for each phase?
     - What are the handoffs?
     - How to manage data transfer?

  2. **Optimize for efficiency**
     - Minimize total time
     - Minimize cost
     - Balance appropriately

  3. **Execute (with simplifications)**
     - Run phases 1, 2, 5 locally
     - For phases 3, 4: either run locally (short version)
       or use VAST if available
     - Document what you would do at full scale

  4. **Report**
     - Multi-backend strategy
     - Actual vs planned execution
     - Cost and time analysis

  Work in: workspaces/benchmarks/BENCH-T14-005/

constraints:
  hpc_available: false
  vast_available: true
  local_available: true
  budget_soft_limit: 5  # dollars

expected_behavior:
  workflow:
    phase1: local
    phase2: local_or_vast  # Small, local fine
    phase3: local_or_vast  # Medium, either works
    phase4: vast_preferred # Long, GPU beneficial
    phase5: local
  rationale: |
    - CPU phases always local (free, sufficient)
    - Short GPU phases: local preferred (avoid VAST overhead)
    - Long GPU phases: VAST advantageous (dedicated GPU)
    - Data handoffs: SCP between local and VAST

skills_required:
  - literature-search
  - materials-database
  - mlip-simulation
  - vast-cloud
  - data-analysis

time_limit_minutes: 120

expected_outputs:
  files:
    - name: "workflow_design.md"
      description: "Multi-backend workflow plan"
    - name: "phase1_literature/"
      description: "Literature search results"
    - name: "phase1_setup/"
      description: "Input files and structure"
    - name: "phase2_relaxation/"
      description: "Relaxed structure"
    - name: "phase3_equilibration/"
      description: "Equilibration results"
    - name: "phase4_production/"
      description: "Production trajectory (or simplified)"
    - name: "phase5_analysis/"
      description: "MSD analysis and diffusion coefficient"
    - name: "backend_usage_log.md"
      description: "Log of which backend used where"
    - name: "cost_time_summary.md"
      description: "Total cost and time breakdown"
    - name: "report.md"
      description: "Full research report"

  values:
    diffusion_coefficient:
      description: "Li diffusion coefficient"
      expected_range: [1e-9, 1e-6]
      unit: "cm²/s"
    backends_used:
      description: "Number of distinct backends used"
      expected_range: [1, 3]
    total_cost:
      description: "Total cloud cost"
      expected_range: [0, 5]
      unit: "dollars"

grading:
  categories:
    - name: workflow_design
      weight: 30
      criteria:
        - Clear phase breakdown
        - Appropriate backend assignments
        - Data transfer plan
        - Handoff points identified

    - name: optimization
      weight: 25
      criteria:
        - Time-efficient choices
        - Cost-effective choices
        - Reasonable tradeoffs
        - Overhead minimized

    - name: execution
      weight: 25
      criteria:
        - All phases completed (or simplified)
        - Results obtained
        - Backends used as planned
        - Handoffs worked

    - name: documentation
      weight: 20
      criteria:
        - Backend usage logged
        - Cost/time tracked
        - Strategy well-documented
        - Lessons learned noted

metadata:
  difficulty: hard
  estimated_time_minutes: 90
  skills_tested:
    - workflow_orchestration
    - multi_backend_management
    - data_transfer
    - optimization
  notes: |
    This is the most complex compute decision benchmark. It tests the
    agent's ability to think holistically about a multi-phase workflow
    and make appropriate compute choices for each phase.
