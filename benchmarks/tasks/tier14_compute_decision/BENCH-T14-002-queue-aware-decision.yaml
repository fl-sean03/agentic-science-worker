# Tier 14 Benchmark: Queue-Aware Decision
# Test agent's ability to factor in queue times when choosing compute

id: BENCH-T14-002
name: Queue-Aware Compute Decision
tier: 14
category: compute-decision

description: |
  Test the agent's ability to factor HPC queue times into compute decisions.
  The agent should check queue status and weigh waiting time against
  cloud compute costs.

prompt: |
  **Task: MACE Phonon Calculation**

  Calculate phonon frequencies for copper using the MACE-MP potential.
  This requires GPU acceleration for reasonable performance.

  **Compute Situation:**
  - HPC cluster is accessible (check queue before deciding)
  - Local GPU available (RTX 5080)
  - VAST AI available (~$0.25/hr for RTX 4090)

  **Simulated Queue Status (for this benchmark):**
  The HPC aa100 (GPU) partition currently shows:
  - 47 jobs pending
  - Estimated wait time: 6-8 hours
  - Your job would need ~45 minutes once started

  **Your Task:**

  1. **Check queue status**
     - What's the current HPC GPU queue situation?
     - How long would you wait?

  2. **Analyze tradeoffs**
     - HPC: Free but 6-8 hour wait + 45 min runtime
     - VAST: ~$0.20 cost but immediate + 45 min runtime
     - Local: Free, immediate, but slower

  3. **Make and document decision**
     - Which option makes most sense?
     - What factors influenced your choice?
     - Would different circumstances change the decision?

  4. **Execute the calculation**
     - Run on chosen backend
     - Report phonon frequencies

  **Note for grading:** HPC VPN is currently unavailable for this benchmark.
  The simulated queue data above represents what you would see.

  Work in: workspaces/benchmarks/BENCH-T14-002/

constraints:
  hpc_available: false  # Simulated unavailable for benchmark
  vast_available: true
  local_available: true
  simulated_queue_wait_hours: 7
  job_runtime_minutes: 45

expected_behavior:
  decision: vast_or_local
  rationale: |
    With 6-8 hour queue wait vs immediate VAST execution:
    - If user values time: VAST ($0.20 to save 6+ hours)
    - If user values cost: Local (free, slightly slower)
    - HPC only makes sense if queue is short or job is long

skills_required:
  - mlip-simulation
  - vast-cloud
  - hpc-cluster

time_limit_minutes: 60

expected_outputs:
  files:
    - name: "queue_analysis.md"
      description: "Analysis of queue status and wait times"
    - name: "tradeoff_analysis.md"
      description: "Cost/time tradeoff analysis"
    - name: "compute_decision.md"
      description: "Final decision with rationale"
    - name: "scripts/phonon_mace.py"
      description: "MACE phonon calculation script"
    - name: "results/phonon_frequencies.txt"
      description: "Calculated phonon frequencies"
    - name: "report.md"
      description: "Full report"

  values:
    queue_wait_identified:
      description: "Correctly identified queue wait time"
      expected: true
    cost_estimated:
      description: "Estimated cloud cost"
      expected_range: [0.15, 0.30]
      unit: "dollars"

grading:
  categories:
    - name: queue_awareness
      weight: 25
      criteria:
        - Checked/acknowledged queue status
        - Understood wait time implications
        - Compared to job runtime
        - Factored urgency appropriately

    - name: tradeoff_analysis
      weight: 30
      criteria:
        - Quantified time vs cost tradeoff
        - Considered all options
        - Made reasonable assumptions explicit
        - Identified decision factors

    - name: decision_quality
      weight: 25
      criteria:
        - Decision matches analysis
        - Clear justification
        - Acknowledged alternatives
        - Appropriate for scenario

    - name: execution
      weight: 20
      criteria:
        - Calculation completed
        - Results reasonable
        - Timing tracked
        - Backend used as decided

metadata:
  difficulty: medium
  estimated_time_minutes: 45
  skills_tested:
    - queue_analysis
    - cost_benefit_analysis
    - time_value_assessment
  notes: |
    This tests queue-awareness. The "correct" answer depends on priorities:
    - Time-sensitive: VAST or local
    - Cost-sensitive: Local or wait for HPC
    Either is acceptable if well-justified.
