# Tier 5 Benchmark: HPC Connection and Validation
# Foundation test - can the agent connect and run a basic job?

id: BENCH-T5-001
name: HPC Connection and Validation
tier: 5
category: hpc-fundamentals

description: |
  Verify the agent can successfully connect to and use the CURC Alpine HPC cluster.
  This is the most basic HPC test - establishing connection, checking the environment,
  and running a simple job through the queue system.

prompt: |
  Verify you can access the CURC Alpine HPC cluster and run jobs successfully.

  Complete the following tasks:

  1. **Connect to HPC**
     - SSH to the Alpine cluster
     - Verify you're on a login node
     - Check your username and scratch space location

  2. **Check Environment**
     - List available scratch space quota
     - Check what modules are available
     - Find where LAMMPS is installed

  3. **Submit a Test Job**
     - Create a simple job script for the `atesting` partition
     - The job should: print hostname, date, loaded modules, and run `echo "Hello from HPC"`
     - Submit to `atesting` partition (1 node, 1 core, 10 minutes max)
     - Wait for completion (atesting queue is usually fast)

  4. **Verify Results**
     - Check job completed successfully
     - Read and report the job output
     - Note the compute node name where job ran

  5. **Create Summary Report**
     - Document connection details
     - Report scratch quota
     - Include job output
     - Confirm HPC access is working

  Work in: workspaces/benchmarks/BENCH-T5-001/

skills_required:
  - hpc-cluster

time_limit_minutes: 15

expected_outputs:
  files:
    - name: "job_test.slurm"
      description: "SLURM job script for test job"
    - name: "job_output.txt"
      description: "Output from the completed job"
    - name: "hpc_validation_report.md"
      description: "Summary report of HPC access validation"

grading:
  categories:
    - name: ssh_connection
      weight: 25
      criteria:
        - Successfully connected to HPC via SSH
        - Identified correct login node
        - Found scratch space path
        - No connection errors

    - name: environment_check
      weight: 20
      criteria:
        - Checked scratch quota
        - Listed available modules
        - Found LAMMPS installation path

    - name: job_submission
      weight: 30
      criteria:
        - Valid SLURM job script created
        - Correct partition (atesting)
        - Appropriate resource requests
        - Job submitted successfully

    - name: result_verification
      weight: 25
      criteria:
        - Job completed without errors
        - Output file retrieved
        - Results correctly reported
        - Compute node identified

metadata:
  difficulty: easy
  estimated_time_minutes: 10
  hpc_resources:
    partition: atesting
    nodes: 1
    cores: 1
    time_limit: "00:10:00"
  skills_tested:
    - ssh_connection
    - slurm_basics
    - job_monitoring
  notes: |
    This is the gateway test for all HPC benchmarks. If the agent cannot
    pass this, it cannot proceed to more complex HPC tasks.
