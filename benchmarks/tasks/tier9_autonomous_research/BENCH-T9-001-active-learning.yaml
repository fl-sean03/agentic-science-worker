      description: "Pre-training MLIP errors"
    - name: "candidates/candidate_pool.xyz"
      description: "Pool of candidate configurations"
    - name: "active_learning/iteration_log.csv"
      description: "Log of each AL iteration"
    - name: "training_data/dft_calculations/*.out"
      description: "DFT calculation outputs"
    - name: "models/finetuned_model.pt"
      description: "Fine-tuned MLIP model"
    - name: "evaluation/learning_curve.png"
      description: "Error vs training set size"
    - name: "evaluation/al_vs_random.png"
      description: "Active learning vs random comparison"
    - name: "report.md"
      description: "Full active learning report"

  values:
    final_mixing_error:
      description: "Final mixing enthalpy error"
      expected_range: [0.01, 0.10]
      unit: "eV/atom"
    baseline_mixing_error:
      description: "Baseline MACE-MP-0 error"
      expected_range: [0.05, 0.30]
      unit: "eV/atom"
    data_efficiency_gain:
      description: "AL vs random efficiency (lower error with same data)"
      expected_range: [1.2, 3.0]
      unit: "x improvement"

grading:
  categories:
    - name: active_learning_design
      weight: 25
      criteria:
        - Clear AL workflow defined
        - Uncertainty estimation method chosen
        - Candidate pool diverse
        - Selection strategy justified

    - name: implementation
      weight: 30
      criteria:
        - DFT calculations executed correctly
        - Model fine-tuning performed
        - Iterations properly tracked
        - Budget respected (50 calcs)

    - name: evaluation
      weight: 25
      criteria:
        - Baseline established
        - Final accuracy measured
        - Comparison to random sampling
        - Learning curve generated

    - name: scientific_insight
      weight: 20
      criteria:
        - Data efficiency quantified
        - AL benefit demonstrated
        - Practical recommendations
        - Limitations discussed

