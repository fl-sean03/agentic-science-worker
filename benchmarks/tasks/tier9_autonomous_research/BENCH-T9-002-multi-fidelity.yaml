# Tier 9 Benchmark: Multi-Fidelity Workflow
# Combine cheap and expensive calculations intelligently

id: BENCH-T9-002
name: Multi-Fidelity Workflow
tier: 9
category: autonomous-research

description: |
  Design and execute a multi-fidelity workflow that combines cheap calculations
  (MLIP, PBE) with expensive calculations (hybrid DFT) to efficiently predict
  accurate band gaps. This tests cost-aware autonomous computation.

prompt: |
  **Task: Multi-Fidelity Band Gap Prediction**

  Accurate band gaps require expensive hybrid DFT (HSE06), but you can't run
  HSE on everything. Your task is to design a multi-fidelity workflow that
  achieves HSE-level accuracy while minimizing HSE calculations.

  **Background:**
  - PBE: Fast but systematically underestimates band gaps (~40% too low)
  - HSE06: Accurate but ~100x more expensive than PBE
  - MLIP: Very fast but doesn't directly predict band gaps
  - Strategy: Use cheap methods to prioritize expensive calculations

  **Cost Model:**
  - MLIP relaxation: 1 unit
  - PBE SCF: 10 units
  - HSE SCF: 1000 units
  - Total budget: 25,000 units (≈ 25 HSE or 2500 PBE)

  **Step 1: Define Material Set**
  Select 20 semiconductors/insulators:
  - Si, Ge, GaAs, GaN, AlN, ZnO, ZnS, MgO, NaCl, LiF
  - CdS, CdSe, TiO2, SrTiO3, BaTiO3, PbS, SnO2, Cu2O, Fe2O3, WO3

  Get structures from Materials Project.

  **Step 2: Tier 1 - MLIP Screening**
  For all 20 materials:
  - Relax with MACE-MP-0
  - Filter out any unstable/metallic (if identifiable)
  - Cost: 20 units

  **Step 3: Tier 2 - PBE Band Gaps**
  For all 20 materials:
  - Run PBE SCF calculation
  - Calculate band gap from eigenvalues
  - Record PBE band gaps
  - Cost: 200 units

  **Step 4: Tier 3 - Select HSE Candidates**
  You can only afford ~5-10 HSE calculations. Select wisely:
  - Option A: Uniform sampling across gap range
  - Option B: Focus on materials where accuracy matters most
  - Option C: Active learning (high uncertainty)

  Justify your selection strategy.

  **Step 5: Tier 4 - HSE Calculations**
  Run HSE06 for selected materials (5-10):
  - Use HSE functional in QE
  - Calculate accurate band gaps
  - Cost: 5000-10000 units

  **Step 6: Build Correction Model**
  Train a correction model: E_g(HSE) ≈ f(E_g(PBE))

  Options:
  - Linear fit: E_g(HSE) = a × E_g(PBE) + b
  - Polynomial fit
  - Separate fits for different material classes

  **Step 7: Predict Remaining Gaps**
  Apply correction model to materials without HSE:
  - Predict HSE-quality band gaps
  - Estimate uncertainty

  **Step 8: Validation**
  Use 2-3 remaining HSE calculations to validate:
  - Compare predicted vs actual HSE gaps
  - Quantify correction model accuracy
  - Cost: 2000-3000 units

  Total cost should be under 25,000 units.

  **Step 9: Report**
  Write report including:
  - Multi-fidelity workflow diagram
  - Cost breakdown by tier
  - HSE selection strategy and justification
  - Correction model details
  - Predicted band gaps for all materials
  - Validation accuracy
  - Comparison: What would full HSE cost? (200,000 units)
  - Cost savings achieved

  Work in: workspaces/benchmarks/BENCH-T9-002/

skills_required:
  - quantum-espresso
  - materials-database
  - data-analysis

time_limit_minutes: 300

expected_outputs:
  files:
    - name: "tier1_mlip/relaxed_structures/"
      description: "MLIP-relaxed structures"
    - name: "tier2_pbe/band_gaps.csv"
      description: "PBE band gaps for all materials"
    - name: "tier3_selection/selection_justification.md"
      description: "HSE candidate selection rationale"
    - name: "tier4_hse/hse_results.csv"
      description: "HSE band gaps for selected materials"
    - name: "correction_model/model.py"
      description: "Trained correction model"
    - name: "predictions/all_predictions.csv"
      description: "Final predicted band gaps"
    - name: "validation/validation_results.csv"
      description: "Validation of correction model"
    - name: "analysis/cost_breakdown.png"
      description: "Cost analysis visualization"
    - name: "report.md"
      description: "Full multi-fidelity report"

  values:
    total_cost:
      description: "Total computational cost (units)"
      expected_range: [10000, 25000]
      unit: "cost units"
    prediction_mae:
      description: "MAE of predicted vs true HSE gaps"
      expected_range: [0.1, 0.5]
      unit: "eV"
    cost_savings:
      description: "Cost reduction vs full HSE"
      expected_range: [5, 20]
      unit: "x reduction"

grading:
  categories:
    - name: workflow_design
      weight: 25
      criteria:
        - Clear multi-fidelity strategy
        - Cost model respected
        - Sensible tier structure
        - HSE selection justified

    - name: execution
      weight: 30
      criteria:
        - All tiers executed correctly
        - DFT calculations converged
        - Cost budget respected
        - Results properly collected

    - name: correction_model
      weight: 25
      criteria:
        - Model trained properly
        - Predictions generated
        - Validation performed
        - Uncertainty estimated

    - name: cost_analysis
      weight: 20
      criteria:
