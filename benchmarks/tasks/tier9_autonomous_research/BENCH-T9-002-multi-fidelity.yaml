metadata:
  difficulty: expert
  estimated_time_minutes: 300
  dft_required: true
  hse_required: true
  skills_tested:
    - multi_fidelity_methods
    - cost_aware_computation
    - band_gap_calculation
    - transfer_learning
  notes: |
    This benchmark tests cost-aware autonomous computation. Real research
    has limited computational budgets, and intelligent allocation of
    expensive calculations is crucial. The agent must balance accuracy
    vs cost and justify their resource allocation decisions.
