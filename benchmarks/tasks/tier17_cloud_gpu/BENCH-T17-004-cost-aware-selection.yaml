# Tier 17 Benchmark: Cost-Aware GPU Selection
# Test optimal GPU selection balancing performance vs cost

id: BENCH-T17-004
name: Cost-Aware GPU Selection
tier: 17
category: cloud-gpu

description: |
  Test the agent's ability to make cost-effective GPU selection decisions.
  Given a computational task, the agent must estimate performance on different
  GPUs, calculate total costs, and make an optimal selection.

prompt: |
  **Task: Optimize GPU Selection for MACE Calculations**

  You need to run MACE relaxations on a batch of structures. Your goal is to
  select the most cost-effective GPU option from VAST.ai.

  **The Workload:**
  - 10 bulk metal structures (~50-100 atoms each)
  - Full relaxation (geometry optimization) with MACE-MP-0
  - Need converged structures and final energies

  **IMPORTANT: You must complete ALL steps below.**

  **Step 1: Analyze Available GPUs**

  Search VAST.ai for available options:
  ```bash
  vastai search offers "gpu_name=RTX_4090 dph<0.50 rentable=true"
  vastai search offers "gpu_name=RTX_3090 dph<0.35 rentable=true"
  vastai search offers "gpu_name=A100_PCIE dph<1.00 rentable=true"
  ```

  For each GPU class, note:
  - Typical hourly rate
  - Expected performance (estimate)
  - Availability

  **Step 2: Estimate Job Duration**

  Based on your knowledge of MACE performance:
  - RTX 3090: ~X min per relaxation
  - RTX 4090: ~Y min per relaxation
  - A100: ~Z min per relaxation

  Estimate total job time for each GPU type.

  **Step 3: Calculate Total Costs**

  For each option, calculate:
  ```
  Total cost = (hourly rate) × (estimated hours) + (setup overhead)
  ```

  Consider setup overhead (~5 min for environment).

  **Step 4: Make Selection and Justify**

  Document your decision:
  - Which GPU did you select?
  - Why is this the optimal choice?
  - What would be better for larger/smaller jobs?

  **Step 5: Execute the Job**

  1. Provision your selected GPU
  2. Setup MACE environment
  3. Create 10 simple bulk structures (Cu, Ag, Au, Pt, Pd, Ni, Fe, Co, Al, Ti)
  4. Run relaxations
  5. Record actual runtime

  **Step 6: Cost Analysis**

  Compare predicted vs actual:
  - Estimated time: X min
  - Actual time: Y min
  - Estimated cost: $X.XX
  - Actual cost: $Y.YY
  - Accuracy: Z%

  **Step 7: Cleanup and Report**

  1. Destroy instance
  2. Verify no orphans remain
  3. Write cost analysis report

  **CRITICAL: Instance Management**

  - Check for orphans before starting
  - Destroy instance immediately after job completion
  - Document instance lifecycle

  **Deliverables:**
  Create in workspaces/benchmarks/BENCH-T17-004/:

  ```
  analysis/
  ├── gpu_comparison.md         # GPU options analysis
  ├── cost_estimates.csv        # Predicted costs
  ├── selection_justification.md
  results/
  ├── relaxation_results.json   # All 10 relaxations
  ├── actual_timing.csv         # Per-structure timing
  report/
  ├── cost_analysis.md          # Predicted vs actual
  ├── recommendations.md        # When to use each GPU
  instance_audit.md             # Instance lifecycle
  ```

  Work in: workspaces/benchmarks/BENCH-T17-004/

skills_required:
  - vast-cloud
  - mlip-simulation
  - data-analysis

time_limit_minutes: 45

cost_limit_dollars: 0.50

expected_outputs:
  files:
    - name: "analysis/gpu_comparison.md"
      description: "GPU options analysis"
    - name: "analysis/selection_justification.md"
      description: "Decision rationale"
    - name: "results/relaxation_results.json"
      description: "Relaxation outputs"
    - name: "report/cost_analysis.md"
      description: "Predicted vs actual costs"
    - name: "instance_audit.md"
      description: "Instance lifecycle proof"

  values:
    estimate_accuracy:
      description: "How close was cost estimate to actual"
      expected_range: [50, 150]
      unit: "%"
    total_cost:
      description: "Actual cost incurred"
      expected_range: [0.05, 0.40]
      unit: "dollars"

grading:
  categories:
    - name: cost_analysis
      weight: 30
      criteria:
        - Multiple GPU options considered
        - Performance estimates reasonable
        - Cost calculations correct
        - Setup overhead included

    - name: decision_quality
      weight: 25
      criteria:
        - Selection well-justified
        - Trade-offs discussed
        - Scaling considerations noted
        - Alternative scenarios mentioned

    - name: execution
      weight: 25
      criteria:
        - All 10 relaxations completed
        - Timing recorded accurately
        - Results properly stored
        - Job ran on selected GPU

    - name: accuracy_assessment
      weight: 20
      criteria:
        - Estimate vs actual compared
        - Discrepancies explained
        - Lessons learned documented
        - Instance properly cleaned up

metadata:
  difficulty: medium
  estimated_time_minutes: 30
  estimated_cost_dollars: 0.30
  skills_tested:
    - cost_optimization
    - performance_estimation
    - cloud_compute
    - decision_making
  notes: |
    This benchmark tests the agent's ability to make informed cost-performance
    decisions. The key insight is that the cheapest GPU is not always the
    most cost-effective - total cost depends on job duration. For MACE,
    RTX 4090 is typically optimal due to good performance at moderate price.
