# Tier 17 Benchmark: File Transfer Workflow
# Test complete local→cloud→local data pipeline

id: BENCH-T17-003
name: File Transfer Workflow
tier: 17
category: cloud-gpu

description: |
  Test the agent's ability to execute a complete workflow that spans local
  and cloud compute: prepare locally, execute on cloud, retrieve results.
  This is the core pattern for using VAST.ai effectively.

prompt: |
  **Task: Local→Cloud→Local Simulation Workflow**

  Execute a complete workflow where you prepare inputs locally, run the
  simulation on a VAST.ai GPU, and analyze results locally.

  **Simulation:** NaCl melting point estimation via two-phase coexistence.

  **Phase 1: Local Preparation**

  1. Create LAMMPS input for NaCl solid-liquid coexistence:
     - ~2000 atoms total
     - Half solid, half liquid configuration
     - Born-Mayer-Huggins potential for NaCl
     - NVT at estimated melting point (~1074 K)

  2. Prepare files:
     - `nacl.data` - Initial structure
     - `nacl_melt.in` - LAMMPS input script
     - `run_on_vast.sh` - Script to run on cloud

  **Phase 2: Cloud Execution**

  1. Provision RTX 4090 instance
  2. Setup LAMMPS with GPU support:
     ```bash
     apt-get update && apt-get install -y lammps
     # Or build from source with GPU
     ```
  3. Upload input files via SCP
  4. Run simulation (target: 100ps, ~5-10 min on GPU)
  5. Monitor progress
  6. Download results:
     - `log.lammps`
     - `trajectory.dump` (or `nacl.lammpstrj`)
     - Any restart files

  **Phase 3: Local Analysis**

  1. Parse trajectory to extract:
     - Temperature vs time
     - Potential energy vs time
     - Structure factor or RDF to identify phases

  2. Determine if system reached equilibrium
  3. Estimate melting point from coexistence

  **CRITICAL: Instance Management**

  Before starting:
  ```bash
  # Check for orphan instances from previous runs
  vastai show instances
  # Destroy any found
  ```

  After completing:
  ```bash
  # Verify cleanup
  vastai show instances
  # Must show 0 running instances
  ```

  **Deliverables:**
  Create in workspaces/benchmarks/BENCH-T17-003/:

  ```
  local_prep/
  ├── nacl.data
  ├── nacl_melt.in
  └── run_on_vast.sh
  cloud_results/
  ├── log.lammps
  └── trajectory.dump
  analysis/
  ├── temperature_plot.png
  ├── energy_plot.png
  └── analysis.md
  workflow_log.md        # Complete timeline
  cost_analysis.md       # Cost breakdown
  instance_audit.md      # Instance creation/destruction proof
  ```

  Work in: workspaces/benchmarks/BENCH-T17-003/

skills_required:
  - vast-cloud
  - lammps-simulation
  - data-analysis

time_limit_minutes: 60

cost_limit_dollars: 0.50

expected_outputs:
  files:
    - name: "local_prep/nacl_melt.in"
      description: "LAMMPS input script"
    - name: "cloud_results/log.lammps"
      description: "Simulation log from cloud"
    - name: "analysis/analysis.md"
      description: "Analysis report"
    - name: "instance_audit.md"
      description: "Instance lifecycle proof"

  values:
    simulation_completed:
      description: "Simulation ran to completion"
      expected: true
    results_retrieved:
      description: "Results downloaded successfully"
      expected: true
    instances_remaining:
      description: "Orphan instances after benchmark"
      expected: 0

grading:
  categories:
    - name: local_preparation
      weight: 20
      criteria:
        - Valid LAMMPS input created
        - Appropriate system size
        - Correct potential used
        - Files organized properly

    - name: cloud_execution
      weight: 30
      criteria:
        - Instance provisioned correctly
        - Files transferred successfully
        - Simulation ran on GPU
        - Results retrieved before destruction

    - name: analysis
      weight: 25
      criteria:
        - Trajectory parsed correctly
        - Plots generated
        - Physical interpretation provided
        - Results are reasonable

    - name: instance_management
      weight: 25
      criteria:
        - Checked for orphans before start
        - Instance destroyed after completion
        - No instances remain
        - Audit trail documented

metadata:
  difficulty: medium
  estimated_time_minutes: 45
  estimated_cost_dollars: 0.35
  skills_tested:
    - cloud_workflow
    - file_transfer
    - simulation_execution
    - data_analysis
  notes: |
    This benchmark tests the complete local↔cloud workflow pattern.
    The instance_management category is critical - agents that leak
    instances will fail this benchmark even if science is correct.
