# Tier 17 Benchmark: Multi-Instance Parallel Jobs
# Test running parallel jobs across multiple VAST instances

id: BENCH-T17-005
name: Multi-Instance Parallel Jobs
tier: 17
category: cloud-gpu

description: |
  Test the agent's ability to coordinate parallel calculations across multiple
  VAST.ai instances. This requires provisioning multiple GPUs, distributing
  work, collecting results, and properly cleaning up all instances.

prompt: |
  **Task: Parallel H Adsorption Screening Across Multiple GPUs**

  Screen 5 metal surfaces for hydrogen adsorption using parallel VAST.ai instances.
  This tests your ability to coordinate multiple cloud resources simultaneously.

  **The Science:**
  Calculate H adsorption energy on (111) surfaces of: Cu, Ag, Au, Pt, Pd

  **IMPORTANT: You must complete ALL steps below. Do NOT skip any steps.**

  **Step 1: Check for Orphan Instances**
  ```bash
  vastai show instances
  ```
  Destroy any BENCH-* labeled instances before proceeding.

  **Step 2: Plan Work Distribution**

  Strategy options:
  a) 5 instances (one per metal) - fastest but highest cost
  b) 2-3 instances (distribute work) - balanced
  c) 1 instance sequential - cheapest but slowest

  Choose option (b) for this benchmark: use 2 instances.

  Document your distribution:
  - Instance 1: Cu, Ag, Au (3 metals)
  - Instance 2: Pt, Pd (2 metals)

  **Step 3: Provision Multiple Instances**

  1. Search for 2 RTX 4090 instances:
     ```bash
     vastai search offers "gpu_name=RTX_4090 dph<0.45 rentable=true num_gpus=1" --limit 5
     ```

  2. Create both instances with label prefix "BENCH-T17-005-":
     - BENCH-T17-005-inst1
     - BENCH-T17-005-inst2

  3. Wait for both to reach "running" status

  **Step 4: Setup Environments (Parallel)**

  On BOTH instances simultaneously:
  1. Install ASE and MACE
  2. Verify GPU access with nvidia-smi
  3. Test MACE import

  **Step 5: Create and Distribute Input Files**

  For each metal, create (111) slab with H adatom:
  - 3x3 surface cell
  - 4 layers, bottom 2 fixed
  - H at fcc hollow site (initial guess)
  - Vacuum: 12 Å

  Upload to respective instances.

  **Step 6: Run Calculations in Parallel**

  Execute relaxations on both instances simultaneously:
  - Monitor both jobs
  - Track individual completion times
  - Handle any failures

  **Step 7: Collect All Results**

  Download from both instances:
  - Relaxed structures
  - Final energies
  - Timing logs

  **Step 8: Aggregate and Analyze**

  Calculate adsorption energies:
  ```
  E_ads = E(slab+H) - E(slab) - 0.5*E(H2)
  ```

  Rank metals by H binding strength.

  **Step 9: Cleanup ALL Instances**

  ```bash
  # Destroy both instances
  vastai destroy instance <id1>
  vastai destroy instance <id2>

  # Verify
  vastai show instances
  # Should show 0 BENCH-* instances
  ```

  **Step 10: Write Report**

  Include:
  - Parallelization strategy and rationale
  - Per-instance timing
  - Total wall time vs sequential estimate
  - Speedup achieved
  - Cost breakdown per instance
  - Results: H adsorption energies ranked

  **CRITICAL: Instance Management**

  - ALL instances must be destroyed at the end
  - Track each instance ID explicitly
  - Document creation and destruction times
  - Any orphaned instances = benchmark failure

  **Deliverables:**
  Create in workspaces/benchmarks/BENCH-T17-005/:

  ```
  planning/
  ├── work_distribution.md
  ├── instance_plan.md
  results/
  ├── inst1_results/          # Cu, Ag, Au
  │   ├── Cu_relaxed.xyz
  │   ├── Ag_relaxed.xyz
  │   └── Au_relaxed.xyz
  ├── inst2_results/          # Pt, Pd
  │   ├── Pt_relaxed.xyz
  │   └── Pd_relaxed.xyz
  ├── adsorption_energies.csv
  analysis/
  ├── timing_comparison.md
  ├── cost_breakdown.csv
  ├── speedup_analysis.md
  report.md                   # Full report
  instance_audit.md           # Both instances documented
  ```

  Work in: workspaces/benchmarks/BENCH-T17-005/

skills_required:
  - vast-cloud
  - mlip-simulation
  - data-analysis

time_limit_minutes: 75

cost_limit_dollars: 1.50

expected_outputs:
  files:
    - name: "planning/work_distribution.md"
      description: "Work distribution strategy"
    - name: "results/adsorption_energies.csv"
      description: "All 5 adsorption energies"
    - name: "analysis/speedup_analysis.md"
      description: "Parallel vs sequential comparison"
    - name: "report.md"
      description: "Complete report"
    - name: "instance_audit.md"
      description: "Both instances documented"

  values:
    metals_completed:
      description: "Number of metals successfully calculated"
      expected_range: [5, 5]
    instances_used:
      description: "Number of parallel instances"
      expected_range: [2, 3]
    instances_remaining:
      description: "Orphan instances after benchmark"
      expected: 0

grading:
  categories:
    - name: parallelization
      weight: 25
      criteria:
        - Multiple instances provisioned
        - Work distributed logically
        - Jobs ran in parallel (not sequential)
        - Strategy documented

    - name: execution
      weight: 25
      criteria:
        - All 5 metals calculated
        - Results retrieved from both instances
        - Timing recorded per instance
        - No failures or crashes

    - name: aggregation
      weight: 25
      criteria:
        - Results collected from all instances
        - Adsorption energies calculated correctly
        - Metals ranked appropriately
        - Scientific conclusions drawn

    - name: instance_management
      weight: 25
      criteria:
        - All instances tracked by ID
        - All instances destroyed
        - Zero orphans at end
        - Complete audit trail

metadata:
  difficulty: hard
  estimated_time_minutes: 60
  estimated_cost_dollars: 1.00
  skills_tested:
    - parallel_coordination
    - multi_instance_management
    - result_aggregation
    - resource_cleanup
  notes: |
    This is the most complex cloud benchmark - requiring coordination across
    multiple instances. The key challenge is proper cleanup - agents must
    track and destroy ALL instances. The parallelization speedup should be
    ~1.5-2x vs sequential, demonstrating the value of multi-instance work.
