# Tier 17 Benchmark: Hybrid Local-Cloud Pipeline
# Test seamless workflow spanning local preparation, cloud execution, local analysis

id: BENCH-T17-008
name: Hybrid Local-Cloud Pipeline
tier: 17
category: cloud-gpu

description: |
  Test a complete research workflow that spans local and cloud compute.
  This mimics real usage: prepare locally, run expensive calculations on
  cloud, analyze results locally. Tests seamless transitions and data integrity.

prompt: |
  **Task: Perovskite Stability Screening - Hybrid Workflow**

  Conduct a DFT screening study using a hybrid local-cloud pipeline.
  This tests your ability to coordinate complex workflows across environments.

  **Research Goal:**
  Screen 10 ABX3 perovskites for thermodynamic stability using DFT.
  Identify which compositions are likely stable.

  **IMPORTANT: You must complete ALL phases below.**

  ---
  **PHASE 1: LOCAL PREPARATION**
  ---

  **Step 1.1: Literature Context**

  Search for recent perovskite stability work:
  - What factors affect perovskite stability?
  - Tolerance factor, octahedral factor
  - Common stable compositions

  **Step 1.2: Select Compositions**

  Choose 10 perovskites to screen:
  - Mix of known stable and potentially unstable
  - Suggested: CaTiO3, SrTiO3, BaTiO3, PbTiO3, PbZrO3,
    KNbO3, NaNbO3, BiFeO3, LaAlO3, SrZrO3

  **Step 1.3: Prepare Structures**

  For each composition:
  1. Get prototype structure (cubic Pm-3m or use MP)
  2. Create QE input files
  3. Use consistent settings:
     - ecutwfc: 50 Ry
     - ecutrho: 400 Ry
     - k-points: 4x4x4
     - Appropriate pseudopotentials

  **Step 1.4: Organize for Cloud**

  Create cloud-ready package:
  ```
  cloud_inputs/
  ├── run_all.sh           # Master script
  ├── CaTiO3/
  │   ├── scf.in
  │   └── run.sh
  ├── SrTiO3/
  │   └── ...
  └── ...
  ```

  ---
  **PHASE 2: CLOUD EXECUTION**
  ---

  **Step 2.1: Provision Compute**

  Get A100 or RTX 4090 instance:
  - A100 preferred for DFT (better memory)
  - Budget: ~$1.00 for compute phase

  **Step 2.2: Setup QE Environment**

  On cloud instance:
  ```bash
  # Install QE with GPU support
  apt-get update
  apt-get install -y quantum-espresso
  # Or build from source for GPU
  ```

  **Step 2.3: Upload and Execute**

  1. Upload entire cloud_inputs/ directory
  2. Run calculations in batch:
     ```bash
     for dir in */; do
       cd $dir
       mpirun -np 4 pw.x < scf.in > scf.out
       cd ..
     done
     ```
  3. Monitor progress

  **Step 2.4: Download Results**

  Before destroying instance:
  1. Verify all calculations completed
  2. Download all scf.out files
  3. Download any data-file.xml if needed
  4. Verify file integrity

  **Step 2.5: Destroy Instance**

  Clean up cloud resources immediately after download.

  ---
  **PHASE 3: LOCAL ANALYSIS**
  ---

  **Step 3.1: Parse Outputs**

  For each calculation, extract:
  - Total energy
  - Forces (should be ~0 for cubic)
  - Convergence status
  - Calculation time

  **Step 3.2: Calculate Stability Metrics**

  For each perovskite:
  1. Energy per atom
  2. Formation energy vs binary oxides (if data available)
  3. Relative stability ranking

  **Step 3.3: Tolerance Factor Analysis**

  Calculate Goldschmidt tolerance factor:
  ```
  t = (r_A + r_O) / (sqrt(2) * (r_B + r_O))
  ```

  Correlate with DFT stability.

  **Step 3.4: Generate Visualizations**

  Create publication-quality figures:
  1. Energy vs composition bar chart
  2. Tolerance factor vs energy scatter plot
  3. Stability ranking table

  **Step 3.5: Write Report**

  Complete research report:
  - Introduction and methods
  - Computational details
  - Results and discussion
  - Stability predictions
  - Recommendations for synthesis

  **DELIVERABLES:**
  Create in workspaces/benchmarks/BENCH-T17-008/:

  ```
  phase1_local/
  ├── literature_notes.md
  ├── composition_selection.md
  ├── structures/              # CIF files
  ├── inputs/                  # QE inputs
  cloud_inputs/                # Ready for upload
  phase2_cloud/
  ├── outputs/                 # Downloaded results
  ├── completion_log.md
  phase3_analysis/
  ├── parsed_results.csv
  ├── stability_metrics.csv
  ├── energy_comparison.png
  ├── tolerance_factor_plot.png
  report.md                    # Complete research report
  workflow_timeline.md         # Phase timestamps
  cost_summary.md              # Cloud cost breakdown
  instance_audit.md            # Instance lifecycle
  ```

  Work in: workspaces/benchmarks/BENCH-T17-008/

