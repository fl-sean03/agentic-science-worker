# Tier 8 Benchmark: Phonon Calculation with MLIPs
# Calculate phonon dispersion and understand MLIP limitations

id: BENCH-T8-003
name: Phonon Calculation with MLIPs
tier: 8
category: ml-materials

description: |
  Calculate the phonon dispersion of silicon using universal MLIPs and quantify
  the known systematic frequency softening (~15% underestimation). This tests
  both technical phonon calculation skills and critical evaluation of ML model
  limitations.

prompt: |
  **Task: Calculate Si Phonon Dispersion with MLIP**

  Phonon calculations are critical for understanding thermal properties,
  stability, and vibrational spectra. Universal MLIPs have a KNOWN limitation:
  they systematically underpredict phonon frequencies by approximately 15%.

  Your task is to calculate Si phonons and quantify this systematic error.

  **Background:**
  Silicon phonon spectrum (experimental):
  - Optical modes at Γ: ~520 cm⁻¹ (15.6 THz)
  - Acoustic modes: linear near Γ
  - High-symmetry path: Γ-X-K-Γ-L

  **Step 1: Structure Setup**
  - Create Si diamond structure (a = 5.43 Å)
  - Build 3×3×3 supercell (54 atoms) for force constants
  - Verify structure is correct

  **Step 2: Force Constant Calculation**
  Using MACE-MP-0 and phonopy:
  1. Generate displaced configurations (finite displacement method)
  2. Calculate forces for each displacement
  3. Build force constant matrix

  Method options:
  - Use phonopy's ASE interface directly
  - Or: Generate displacements, calculate forces manually, feed to phonopy

  **Step 3: Phonon Dispersion**
  Calculate phonon dispersion along: Γ → X → K → Γ → L
  - Plot phonon band structure
  - Calculate phonon DOS
  - Identify optical and acoustic branches

  **Step 4: Comparison to Experiment**
  Compare your results to experimental Si phonon spectrum:
  - Optical frequency at Γ: experimental ~520 cm⁻¹
  - Your MLIP value: ??? cm⁻¹
  - Calculate % softening: (exp - calc) / exp × 100

  **Step 5: Quantify Systematic Error**
  The ~15% softening is a known MLIP issue. Analyze:
  - Is your softening consistent with literature reports?
  - Is the error uniform across frequencies?
  - Are acoustic modes affected differently than optical?

  **Step 6: Report**
  Write a report including:
  - Phonon dispersion plot
  - Phonon DOS plot
  - Quantified frequency softening (% error)
  - Discussion of MLIP phonon limitations
  - Recommendations for when MLIP phonons are/aren't appropriate

  **Key Insight:**
  This benchmark tests whether the agent understands that ML models have
  systematic limitations and can critically evaluate their predictions.

  Work in: workspaces/benchmarks/BENCH-T8-003/

skills_required:
  - data-analysis

time_limit_minutes: 60

expected_outputs:
  files:
    - name: "scripts/phonon_calculation.py"
      description: "Full phonon calculation script"
    - name: "results/phonon_dispersion.png"
      description: "Phonon band structure plot"
    - name: "results/phonon_dos.png"
      description: "Phonon density of states"
    - name: "results/force_constants.hdf5"
      description: "Calculated force constants"
    - name: "analysis/softening_analysis.csv"
      description: "Frequency comparison to experiment"
    - name: "report.md"
      description: "Analysis report with limitations discussion"

  values:
    optical_frequency:
      description: "Calculated optical frequency at Gamma"
      expected_range: [400, 500]  # cm⁻¹, should be ~15% below 520
      unit: "cm⁻¹"
    softening_percent:
      description: "Percent frequency underestimation"
      expected_range: [10, 25]  # Known ~15% softening
      unit: "%"

grading:
  categories:
    - name: phonon_methodology
      weight: 25
      criteria:
        - Correct supercell construction
        - Proper finite displacement setup
        - Force calculations correct
        - Phonopy integration working

    - name: dispersion_calculation
      weight: 25
      criteria:
        - Full high-symmetry path calculated
        - Both acoustic and optical branches visible
        - Dispersion plot is correct
        - DOS calculated

    - name: error_quantification
      weight: 25
      criteria:
        - Comparison to experimental values
        - Softening percentage calculated
        - Analysis of error across frequencies
        - Results consistent with literature

    - name: critical_analysis
      weight: 25
      criteria:
        - Acknowledges MLIP limitations
        - Discusses when phonons are reliable
        - Recommendations are practical
        - Report is scientifically sound

metadata:
  difficulty: medium-hard
  estimated_time_minutes: 60
  gpu_recommended: true
  skills_tested:
    - phonon_calculations
    - mlip_limitations
    - critical_evaluation
    - scientific_reporting
  notes: |
    This benchmark specifically tests whether the agent can critically
    evaluate ML model predictions. The ~15% phonon softening is a known
    issue across all major universal MLIPs (MACE, CHGNet, M3GNet).
    A good agent should discover and quantify this limitation.
