# Tier 8 Benchmark: MLIP vs Classical Potential Comparison
# Compare accuracy of universal MLIPs against classical potentials

id: BENCH-T8-002
name: MLIP vs Classical Comparison
tier: 8
category: ml-materials

description: |
  Compare the accuracy of universal Machine Learning Interatomic Potentials
  against classical empirical potentials (EAM) for copper. This demonstrates
  the accuracy advantage of MLIPs while understanding their computational cost.

prompt: |
  **Task: Compare MLIP vs Classical Potential Accuracy**

  Universal MLIPs promise near-DFT accuracy at classical MD cost. Your task is
  to quantitatively compare MLIP predictions against classical EAM potentials
  for copper - a well-studied FCC metal.

  **Background:**
  - EAM (Embedded Atom Method): Classical potential, very fast, fitted to specific properties
  - MACE/CHGNet/M3GNet: ML potentials, trained on DFT data, more transferable

  **Experimental Reference Values for Cu:**
  - Lattice constant: 3.615 Å
  - Bulk modulus: 137 GPa
  - C11: 168 GPa, C12: 121 GPa, C44: 75 GPa
  - Cohesive energy: 3.49 eV/atom

  **Step 1: Classical EAM Calculation**
  Using LAMMPS with the Mishin Cu EAM potential:
  1. Calculate equilibrium lattice constant
  2. Calculate bulk modulus (from E-V curve or stress-strain)
  3. Calculate elastic constants C11, C12, C44

  **Step 2: MACE-MP-0 Calculation**
  Using ASE with MACE calculator:
  1. Calculate equilibrium lattice constant
  2. Calculate bulk modulus
  3. Calculate elastic constants

  **Step 3: CHGNet Calculation**
  Using ASE with CHGNet calculator:
  1. Calculate equilibrium lattice constant
  2. Calculate bulk modulus
  3. Calculate elastic constants

  **Step 4: M3GNet Calculation**
  Using ASE with M3GNet calculator:
  1. Calculate equilibrium lattice constant
  2. Calculate bulk modulus
  3. Calculate elastic constants

  **Step 5: Comprehensive Comparison**
  Create a comparison table with:
  | Property | Experiment | EAM | MACE | CHGNet | M3GNet |
  |----------|------------|-----|------|--------|--------|
  | a (Å)    | 3.615      | ... | ...  | ...    | ...    |
  | B (GPa)  | 137        | ... | ...  | ...    | ...    |
  | C11 (GPa)| 168        | ... | ...  | ...    | ...    |
  | C12 (GPa)| 121        | ... | ...  | ...    | ...    |
  | C44 (GPa)| 75         | ... | ...  | ...    | ...    |

  Calculate percent errors vs experiment for each method.

  **Step 6: Analysis**
  Write a comparison report discussing:
  - Which method is most accurate overall?
  - Which properties are well/poorly predicted by each?
  - Computational cost comparison (time per calculation)
  - When would you use EAM vs MLIP?

  Work in: workspaces/benchmarks/BENCH-T8-002/

skills_required:
  - lammps-simulation
  - data-analysis

time_limit_minutes: 45

