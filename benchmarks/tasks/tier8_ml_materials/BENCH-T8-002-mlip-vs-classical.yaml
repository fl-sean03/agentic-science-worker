    eam_lattice_error:
      description: "EAM lattice constant % error"
      expected_range: [0, 3]
      unit: "%"
    best_method:
      description: "Method with lowest overall error"
      expected_values: ["MACE", "CHGNet", "M3GNet", "EAM"]

