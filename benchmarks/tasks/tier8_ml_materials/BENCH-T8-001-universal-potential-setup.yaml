# Tier 8 Benchmark: Universal Potential Setup
# Install and validate MLIP frameworks

id: BENCH-T8-001
name: Universal Potential Setup
tier: 8
category: ml-materials

description: |
  Set up and validate Machine Learning Interatomic Potential (MLIP) frameworks.
  This is the foundation for all ML-powered materials science - ensuring the
  agent can load and use pre-trained universal potentials.

prompt: |
  **Task: Set Up and Validate Universal MLIPs**

  Machine Learning Interatomic Potentials (MLIPs) have revolutionized computational
  materials science by providing near-DFT accuracy at classical MD cost. Your task
  is to set up and validate the major MLIP frameworks.

  **Step 1: Verify Installation**
  Check that the following packages are available:
  - mace-torch (MACE universal potential)
  - matgl (M3GNet, provides access to multiple models)
  - chgnet (CHGNet for charge-aware simulations)
  - ase (Atomic Simulation Environment)
  - phonopy (for phonon calculations)

  Report versions of all packages.

  **Step 2: Load Pre-trained Models**
  Load the following pre-trained universal potentials:
  - MACE-MP-0 (from mace.calculators)
  - M3GNet-MP-2021.2.8-PES (from matgl)
  - CHGNet (from chgnet.model)

  **Step 3: Validation Calculation**
  Create a simple silicon diamond structure (2 atoms, a=5.43 Å) and calculate:
  - Single-point energy with each model
  - Forces on atoms
  - Stress tensor (if available)

  **Step 4: Comparison**
  Create a table comparing:
  - Energy per atom from each model
  - Computational time for each calculation
  - Any warnings or issues encountered

  **Step 5: GPU Validation (if available)**
  If a GPU is available:
  - Load MACE with device="cuda"
  - Run the same calculation
  - Compare speed to CPU

  **Deliverables:**
  - validation_report.md: Summary of all checks
  - validation_script.py: Python script that performs validation
  - comparison_table.csv: Energy comparison across models

  Work in: workspaces/benchmarks/BENCH-T8-001/

skills_required:
  - lammps-simulation  # For comparison context
  - data-analysis

time_limit_minutes: 30

expected_outputs:
  files:
    - name: "validation_report.md"
      description: "Summary of installation validation"
    - name: "validation_script.py"
      description: "Reproducible validation script"
    - name: "comparison_table.csv"
      description: "Model comparison results"

  values:
    mace_energy:
      description: "MACE energy per atom for Si"
      expected_range: [-5.5, -4.5]
      unit: "eV/atom"
    m3gnet_energy:
      description: "M3GNet energy per atom for Si"
      expected_range: [-5.5, -4.5]
      unit: "eV/atom"
    chgnet_energy:
      description: "CHGNet energy per atom for Si"
      expected_range: [-5.5, -4.5]
      unit: "eV/atom"

grading:
  categories:
    - name: installation_verification
      weight: 25
      criteria:
        - All packages verified as installed
        - Versions reported correctly
        - Any missing packages identified
        - Import errors handled gracefully

    - name: model_loading
      weight: 25
      criteria:
        - MACE-MP-0 loaded successfully
        - M3GNet loaded successfully
        - CHGNet loaded successfully
        - GPU device handling correct

    - name: validation_calculations
      weight: 30
      criteria:
        - Si structure created correctly
        - Energy calculated with all models
        - Forces extracted properly
        - Results are physically reasonable

    - name: documentation
      weight: 20
      criteria:
        - Clear validation report
        - Reproducible script provided
        - Comparison table well-formatted
        - Issues documented if any

metadata:
  difficulty: easy
  estimated_time_minutes: 30
  gpu_recommended: true
  skills_tested:
    - mlip_basics
    - python_environment
    - model_loading
  prerequisites:
    - mace-torch
    - matgl
    - chgnet
    - ase
  notes: |
    This is the foundation benchmark for ML-powered materials science.
    All subsequent Tier 8+ benchmarks depend on successful MLIP setup.
    The agent should handle missing packages gracefully and report issues.
