# Tier 8 Benchmark: High-Throughput Stability Screening
# Screen materials for thermodynamic stability using MLIPs

id: BENCH-T8-004
name: High-Throughput Stability Screening
tier: 8
category: ml-materials

description: |
  Use universal MLIPs to screen candidate materials for thermodynamic stability.
  This is a realistic battery materials discovery workflow - identifying stable
  compounds in the Li-Mn-O system for cathode applications.

prompt: |
  **Task: Screen Li-Mn-O Cathode Materials for Stability**

  High-throughput computational screening is a key application of MLIPs.
  Your task is to screen candidate Li-Mn-O compounds for thermodynamic
  stability - a realistic battery cathode discovery workflow.

  **Background: Li-Mn-O Battery Cathodes**
  - LiMnO2: Layered cathode, ~4V
  - Li2MnO3: Li-rich cathode component
  - LiMn2O4: Spinel cathode, ~4V
  - Stability determines if compound can be synthesized

  Formation energy: ΔE_f = E_compound - Σ(n_i × E_element_i) / N_atoms

  **Step 1: Get Reference Energies**
  Calculate per-atom energies for reference states using MACE-MP-0:
  - Li metal (BCC)
  - Mn metal (complex structure, use α-Mn or get from MP)
  - O2 molecule (in a box, or use standard reference)

  Note: For oxygen, use the standard DFT oxygen correction or
  calculate O2 and apply the known correction factor.

  **Step 2: Generate Candidate Structures**
  Get structures from Materials Project or build manually:
  - LiMnO2 (layered, R-3m)
  - LiMnO2 (orthorhombic, Pmnm)
  - Li2MnO3 (monoclinic, C2/m)
  - LiMn2O4 (spinel, Fd-3m)
  - Li4Mn5O12 (if available)
  - MnO2 (various polymorphs)

  Aim for at least 6-8 candidate structures.

  **Step 3: Relax All Structures**
  For each candidate:
  1. Load structure
  2. Attach MACE-MP-0 calculator
  3. Relax cell and positions (BFGS, fmax=0.01 eV/Å)
  4. Record final energy

  **Step 4: Calculate Formation Energies**
  For each compound:
  - Count Li, Mn, O atoms
  - Calculate formation energy per atom
  - Negative = stable vs elements

  **Step 5: Assess Stability**
  Compare to Materials Project data:
  - Get MP formation energies for same compounds
  - Calculate MLIP vs MP differences
  - Identify any stability prediction errors

  **Step 6: Rank Candidates**
  Create ranking table:
  | Compound | E_form (MLIP) | E_form (MP) | Error | Stable? |
  |----------|---------------|-------------|-------|---------|

  Rank by stability (most negative E_form = most stable).

  **Step 7: Analysis Report**
  Write report including:
  - Methodology description
  - Ranking of candidates by stability
  - Comparison to Materials Project
  - Which compounds are predicted stable vs unstable
  - Discussion of MLIP accuracy for this chemistry
  - Recommendations for experimental synthesis priorities

  Work in: workspaces/benchmarks/BENCH-T8-004/

skills_required:
  - materials-database
  - data-analysis

time_limit_minutes: 90

expected_outputs:
  files:
    - name: "structures/*.cif"
      description: "Input structures for screening"
    - name: "scripts/screening_workflow.py"
      description: "Full screening script"
    - name: "results/formation_energies.csv"
      description: "Formation energies for all compounds"
    - name: "results/stability_ranking.csv"
      description: "Ranked list of candidates"
    - name: "results/comparison_plot.png"
      description: "MLIP vs MP formation energy comparison"
    - name: "report.md"
      description: "Screening report with recommendations"

  values:
    compounds_screened:
      description: "Number of compounds evaluated"
      expected_range: [6, 15]
    limn2o4_formation:
      description: "LiMn2O4 formation energy"
      expected_range: [-2.5, -1.5]  # eV/atom
      unit: "eV/atom"
    mlip_mp_mae:
      description: "Mean absolute error vs MP"
      expected_range: [0.02, 0.15]
      unit: "eV/atom"

grading:
  categories:
    - name: workflow_design
      weight: 20
      criteria:
        - Reference energies calculated correctly
        - Multiple candidates generated
        - Structures from reliable source
        - Systematic approach

    - name: calculations
      weight: 30
      criteria:
        - All structures relaxed properly
        - Formation energies calculated correctly
        - Results are physically reasonable
        - Efficient computation

    - name: validation
      weight: 25
      criteria:
        - Compared to Materials Project
        - Errors quantified
        - Discrepancies identified
        - Systematic errors noted

    - name: scientific_output
      weight: 25
      criteria:
        - Clear ranking produced
        - Recommendations provided
        - Limitations discussed
        - Report is actionable

metadata:
  difficulty: hard
  estimated_time_minutes: 90
  gpu_recommended: true
  skills_tested:
    - high_throughput_screening
    - formation_energy
    - battery_materials
    - validation
  notes: |
    This benchmark tests a realistic materials discovery workflow.
    The agent must handle multiple structures, calculate formation
    energies correctly, and validate against a trusted database.
    Li-Mn-O is chosen because it's relevant for batteries and has
    good Materials Project coverage for validation.
