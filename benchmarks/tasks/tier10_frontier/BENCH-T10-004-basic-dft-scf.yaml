# Tier 10 Benchmark: Basic DFT SCF Calculation
# Validate QE works with simple silicon SCF

id: BENCH-T10-004
name: Basic DFT SCF
tier: 10
category: dft-basics

description: |
  Basic validation that Quantum ESPRESSO works correctly. Run a simple
  SCF calculation on bulk silicon and verify the result matches expected
  values from literature.

prompt: |
  **Task: Run Basic QE SCF Calculation**

  Validate that Quantum ESPRESSO is working by running a simple SCF
  calculation on bulk silicon.

  **IMPORTANT: You must complete ALL steps below.**

  Acquiring the pseudopotential is NOT sufficient - you MUST:
  1. Create the input file
  2. Run pw.x
  3. Parse the output
  4. Document results

  Do NOT stop after downloading files. The actual calculation is required.

  ---

  **Step 1: Get Structure**

  Silicon diamond structure:
  - Space group: Fd-3m (227)
  - Lattice parameter: a = 5.43 Å
  - Basis: Si at (0,0,0) and (0.25,0.25,0.25)

  **Step 2: Acquire Pseudopotential**

  Find and download a PBE pseudopotential for Si:
  - Recommended: SSSP efficiency or precision
  - Example: `Si.pbe-n-rrkjus_psl.1.0.0.UPF`
  - Note the recommended cutoffs

  **Step 3: Create Input File**

  Create `si_scf.in`:
  ```fortran
  &CONTROL
      calculation = 'scf'
      prefix = 'si'
      outdir = './tmp'
      pseudo_dir = './pseudo'
  /
  &SYSTEM
      ibrav = 2
      celldm(1) = 10.26    ! a in Bohr (5.43 Å)
      nat = 2
      ntyp = 1
      ecutwfc = 40.0
      ecutrho = 320.0
  /
  &ELECTRONS
      conv_thr = 1.0d-8
  /
  ATOMIC_SPECIES
  Si  28.0855  Si.pbe-n-rrkjus_psl.1.0.0.UPF

  ATOMIC_POSITIONS crystal
  Si  0.00  0.00  0.00
  Si  0.25  0.25  0.25

  K_POINTS automatic
  6 6 6 1 1 1
  ```

  **Step 4: Run QE**

  Use the local GPU build:
  ```bash
  source /home/sf2/work/archive/gpu-tests-wsl/1-GPUTests/dft-qe/env/setup_nvhpc.sh
  /home/sf2/work/archive/gpu-tests-wsl/1-GPUTests/dft-qe/build-gpu/bin/pw.x < si_scf.in > si_scf.out
  ```

  Or CPU build:
  ```bash
  /home/sf2/work/archive/gpu-tests-wsl/1-GPUTests/dft-qe/build-cpu/bin/pw.x < si_scf.in > si_scf.out
  ```

  **Step 5: Parse Results**

  Extract from output:
  - Total energy (look for "!" line)
  - Number of SCF iterations
  - Convergence achieved?

  **Expected Results:**
  - Total energy: approximately -15.8 to -15.9 Ry (depends on pseudopotential)
  - SCF converged in < 20 iterations
  - No errors

  **Step 6: Verify**

  Compare your energy to:
  - Literature: Si cohesive energy ~4.6 eV/atom
  - Your result should be in reasonable range

  **Required Deliverables (create ALL of these):**

  You MUST create ALL of the following files:

  1. `pseudo/Si.*.UPF` - Downloaded pseudopotential
  2. `si_scf.in` - QE input file (you must write this)
  3. `si_scf.out` - QE output file (from running pw.x)
  4. `results.md` - Parsed results including:
     - Total energy value
     - Number of SCF iterations
     - Comparison to literature

  **Completion Checklist:**

  Before finishing, verify you have done ALL of these:
  - [ ] Downloaded pseudopotential
  - [ ] Created si_scf.in with correct structure
  - [ ] Ran pw.x and got si_scf.out
  - [ ] Parsed total energy from output
  - [ ] Created results.md with findings

  If any box is unchecked, you are NOT done.

  Work in: workspaces/benchmarks/BENCH-T10-004/

skills_required:
  - quantum-espresso
  - resource-acquisition

time_limit_minutes: 30

expected_outputs:
  files:
    - name: "si_scf.in"
      description: "QE input file"
    - name: "si_scf.out"
      description: "QE output file"
    - name: "results.md"
      description: "Parsed results"

  values:
    scf_converged:
      description: "SCF calculation converged"
      expected: true
    total_energy_ry:
      description: "Total energy in Rydberg"
      expected_range: [-16.5, -15.0]
    n_iterations:
      description: "Number of SCF iterations"
      expected_range: [3, 25]

grading:
  categories:
    - name: setup
      weight: 25
      criteria:
        - Pseudopotential acquired correctly
        - Input file valid syntax
        - Appropriate cutoffs used

    - name: execution
      weight: 35
      criteria:
        - QE ran without errors
        - SCF converged
        - Used GPU or CPU build correctly

    - name: results
      weight: 25
      criteria:
        - Energy in expected range
        - Reasonable iteration count
        - Results parsed correctly

    - name: documentation
      weight: 15
      criteria:
        - Results clearly documented
        - Comparison to literature
        - Any issues noted

metadata:
  difficulty: easy
  estimated_time_minutes: 15
  gpu_recommended: true
  skills_tested:
    - dft_basics
    - qe_execution
    - pseudopotential_acquisition
  notes: |
    This is a foundational DFT benchmark. Success here validates that
    QE is properly installed and the agent can run basic calculations.
    More complex DFT benchmarks (band structure, relaxation, phonons)
    depend on this working correctly.
