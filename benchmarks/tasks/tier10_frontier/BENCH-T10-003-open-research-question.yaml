# Tier 10 Benchmark: Open Research Question
# Investigate an unsolved scientific problem

id: BENCH-T10-003
name: Open Research Question
tier: 10
category: frontier-challenge

description: |
  Investigate an unsolved problem in the MLIP community - why do universal
  potentials systematically underpredict phonon frequencies by ~15%? This
  is a real, open research question. The agent may not solve it, but should
  make measurable progress toward understanding.

prompt: |
  **Open Research Question: Why Do MLIPs Underpredict Phonon Frequencies?**

  Universal MLIPs (MACE, CHGNet, M3GNet) systematically underpredict phonon
  frequencies by approximately 15%. This is a KNOWN but UNSOLVED problem
  in the computational materials community.

  Your task is to investigate this phenomenon, generate and test hypotheses,
  and make progress toward understanding the root cause.

  **The Problem:**
  - All major universal MLIPs show ~15% phonon frequency underestimation
  - This manifests as: overestimated entropy, underestimated heat capacity
  - The error is systematic, not random
  - It affects both acoustic and optical modes
  - The cause is not definitively established

  **Potential Hypotheses (from literature):**

  1. **Training Data Bias**
     - MLIPs trained mostly on relaxed structures
     - Phonons probe small displacements - underrepresented in training?
     - Potential energy surface (PES) may be "too soft" near minima

  2. **Architecture Limitation**
     - Message-passing may not capture certain force correlations
     - Cutoff effects on long-range interactions?
     - Descriptor smoothness causing soft PES?

  3. **Energy vs Force Weighting**
     - Training typically weights energy heavily
     - Forces (and curvature) may be secondary
     - Hessian (second derivative) never directly trained

  4. **DFT Training Data Issues**
     - DFT itself has errors
     - Functional dependence (PBE tends to soften bonds)
     - But MLIPs show MORE softening than DFT source data

  5. **Finite Temperature Effects**
     - Training data from 0K relaxations
     - Phonons assume harmonic approximation
     - Anharmonicity not properly captured?

  **Your Investigation:**

  **Step 1: Reproduce the Error**
  Quantify the phonon softening for 3 diverse materials:
  - Si (covalent semiconductor)
  - Cu (FCC metal)
  - MgO (ionic insulator)

  For each:
  1. Calculate phonon frequencies with MACE-MP-0
  2. Compare to experimental/DFT reference
  3. Quantify % softening

  Is the ~15% error consistent across materials?

  **Step 2: Test Hypothesis A - Training Data**
  Investigate if the PES is systematically too soft:
  1. Calculate E(displacement) curves along a phonon mode
  2. Compare MLIP curvature to DFT curvature
  3. Is the harmonic force constant underestimated?

  **Step 3: Test Hypothesis B - Model Comparison**
  Compare different MLIPs:
  - MACE-MP-0
  - CHGNet
  - M3GNet

  Do they all show similar softening? Or does architecture matter?

  **Step 4: Test Hypothesis C - Training Focus**
  Investigate energy vs force balance:
  - For a simple system, compare predicted forces to DFT
  - Are force errors correlated with phonon errors?
  - What is the force MAE for the systems studied?

  **Step 5: Test Hypothesis D - Cutoff Effects**
  Investigate if limited cutoff causes softening:
  - What is the MACE cutoff?
  - For long-wavelength acoustic modes, could cutoff matter?
  - Compare near-Γ vs zone-boundary phonons

  **Step 6: Synthesize Findings**
  Based on your tests:
  - Which hypotheses are supported by evidence?
  - Which can be ruled out?
  - What additional tests would be informative?

  **Step 7: Propose Next Steps**
  Based on your findings, propose:
  - Most likely explanation (with evidence)
  - Experiments to confirm
  - Potential fixes (if you have ideas)

  **Step 8: Research Report**

  Write a research report:

  1. **Introduction**
     - The phonon softening problem
     - Why it matters
     - Previous work on this issue

  2. **Methods**
     - Materials studied
     - Calculation setup
     - Hypotheses tested

  3. **Results**
     - Softening quantification
     - Each hypothesis test result
     - Supporting evidence

  4. **Discussion**
     - Which hypotheses are supported
     - Remaining questions
     - Limitations of your investigation

  5. **Conclusions**
     - Best current explanation
     - Recommended next steps
     - How to fix (if known)

  **Note on Expectations:**
  This is a REAL unsolved problem. You are not expected to definitively solve it.
  You ARE expected to:
  - Make measurable progress
  - Generate testable hypotheses
  - Provide evidence for/against explanations
  - Think like a researcher tackling an open question

  Work in: workspaces/benchmarks/BENCH-T10-003/

