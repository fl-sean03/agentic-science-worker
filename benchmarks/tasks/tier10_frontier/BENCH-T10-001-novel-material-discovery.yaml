grading:
  categories:
    - name: research_strategy
      weight: 20
      criteria:
        - Literature survey comprehensive
        - Hypotheses scientifically justified
        - Novel approach identified
        - Gap analysis performed

    - name: computational_screening
      weight: 25
      criteria:
        - Sufficient candidates generated
        - MLIP screening executed correctly
        - Filters appropriately applied
        - Results well-organized

    - name: validation
      weight: 20
      criteria:
        - DFT validation performed
        - Novelty verified
        - Stability assessed
        - False positives identified

    - name: scientific_insight
      weight: 20
      criteria:
        - Top candidate well-analyzed
        - Comparison to state-of-art
        - Limitations acknowledged
        - Synthesis considerations

    - name: report_quality
      weight: 15
      criteria:
        - Publication-quality writing
        - Complete methodology
        - Clear figures/tables
        - Actionable conclusions

