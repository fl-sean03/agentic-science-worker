      description: "Full screening results"
    - name: "screening/passing_candidates.csv"
      description: "Candidates passing filters"
    - name: "validation/dft_results.csv"
      description: "DFT validation results"
    - name: "novelty/novelty_check.md"
      description: "Novelty verification"
    - name: "analysis/top_candidate_analysis.md"
      description: "Deep analysis of best candidate"
    - name: "report.md"
      description: "Publication-quality research report"

