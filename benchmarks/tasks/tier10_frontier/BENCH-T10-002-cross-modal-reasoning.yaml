# Tier 10 Benchmark: Cross-Modal Scientific Reasoning
# Integrate computational and experimental data

id: BENCH-T10-002
name: Cross-Modal Scientific Reasoning
tier: 10
category: frontier-challenge

description: |
  Determine an unknown crystal structure from simulated XRD data by
  integrating pattern matching, crystallographic reasoning, and MLIP
  calculations. This tests the agent's ability to work across different
  data modalities - a key capability for autonomous experimental science.

prompt: |
  **Research Task: Structure Determination from XRD**

  A collaborator has synthesized a new material and provides you with its
  X-ray diffraction (XRD) pattern. Your task is to determine the crystal
  structure by combining pattern analysis with computational methods.

  **The Unknown Material:**
  - Composition: LiNiO2 (stoichiometry confirmed by other methods)
  - XRD pattern: Provided as peak positions and intensities
  - Crystal system: Unknown - you must determine this

  **Simulated XRD Data:**
  The following peaks were observed (Cu Kα, λ = 1.5406 Å):

  ```
  2θ (degrees) | Relative Intensity (%)
  ------------------------------------
  18.7         | 45
  36.6         | 25
  37.9         | 100  (strongest peak)
  38.5         | 55
  44.4         | 95
  48.7         | 30
  58.6         | 20
  64.5         | 75
  65.1         | 40
  ```

  **Step 1: Pattern Analysis**

  Analyze the XRD pattern:
  1. Calculate d-spacings from 2θ using Bragg's law: nλ = 2d sin(θ)
  2. Look for systematic absences (hints at space group)
  3. Identify possible crystal systems from peak ratios

  **Step 2: Literature Research**

  Research known LiNiO2 polymorphs:
  - What structures are reported in literature?
  - What are their XRD patterns?
  - Are there multiple polymorphs?

  Known forms include:
  - Layered R-3m (like LiCoO2)
  - Disordered rock salt
  - Other polymorphs?

  **Step 3: Generate Candidate Structures**

  Create candidate structures for pattern matching:
  1. Get known LiNiO2 structures from Materials Project
  2. Generate any additional plausible structures
  3. Relax with MLIP to get equilibrium structures

  **Step 4: Simulate XRD Patterns**

  For each candidate structure, simulate XRD pattern:
  - Use pymatgen's XRD calculator or similar
  - Generate theoretical 2θ positions and intensities
  - Match Cu Kα wavelength

  **Step 5: Pattern Matching**

  Compare simulated patterns to experimental:
  - Calculate peak position agreement
  - Calculate intensity correlation
  - Use R-factor or similar metric

  Matching metric:
  R = Σ|I_exp - I_calc| / Σ|I_exp|

  Lower R = better match.

  **Step 6: Structure Refinement**

  For best-matching structure:
  1. Optimize lattice parameters to improve match
  2. Consider small atomic displacements
  3. Re-calculate XRD after optimization

  **Step 7: Validation**

  Validate your structure determination:
  1. Is the match statistically significant?
  2. Can you rule out other candidates?
  3. Does the structure make chemical sense?

  Additional checks:
  - Calculate formation energy - is it stable?
  - Check bond lengths - are they reasonable?
  - Compare to literature structures

  **Step 8: Report Structure**

  Report your determined structure:
  - Space group
  - Lattice parameters (a, b, c, α, β, γ)
  - Atomic positions
  - Confidence level

  Include:
  - Comparison of experimental vs simulated XRD
  - Evidence ruling out alternatives
  - Remaining uncertainties

  **Step 9: Research Report**

  Write report including:
  - Problem description
  - Pattern analysis methodology
  - Candidate structures tested
  - Matching results (table with R-factors)
  - Final structure determination
  - Validation evidence
  - Comparison of exp vs calc XRD (figure)
  - Confidence assessment

  Work in: workspaces/benchmarks/BENCH-T10-002/

skills_required:
  - literature-search
  - materials-database
  - data-analysis

time_limit_minutes: 180

expected_outputs:
  files:
    - name: "xrd_analysis/d_spacings.csv"
      description: "Calculated d-spacings from peaks"
    - name: "candidates/candidate_structures/"
      description: "CIF files for candidate structures"
    - name: "xrd_simulation/simulated_patterns.csv"
      description: "Simulated XRD for each candidate"
    - name: "matching/r_factors.csv"
      description: "R-factors for each candidate"
    - name: "matching/best_match_comparison.png"
      description: "Exp vs calc XRD comparison"
    - name: "final_structure/determined_structure.cif"
      description: "Final determined structure"
    - name: "validation/validation_checks.md"
      description: "Structure validation"
    - name: "report.md"
      description: "Structure determination report"

  values:
    best_r_factor:
      description: "R-factor for best matching structure"
      expected_range: [0.0, 0.3]
    structure_identified:
      description: "Correct structure identified"
      expected_values: ["R-3m layered", "Fm-3m rock salt", "other"]
    lattice_a:
      description: "Determined lattice parameter a"
      expected_range: [2.8, 3.0]
      unit: "Å"

grading:
  categories:
    - name: pattern_analysis
      weight: 20
      criteria:
        - D-spacings correctly calculated
        - Crystal system reasoning
        - Systematic absence analysis
        - Professional XRD interpretation

    - name: candidate_generation
      weight: 20
      criteria:
        - Multiple candidates considered
        - Structures from reliable sources
        - MLIP relaxation performed
        - Reasonable candidate set

    - name: pattern_matching
      weight: 30
      criteria:
        - XRD simulation correct
        - R-factors calculated
        - Clear winner identified
        - Alternatives ruled out

    - name: validation
      weight: 15
      criteria:
        - Structure makes chemical sense
        - Formation energy reasonable
        - Bond lengths checked
        - Confidence assessed

    - name: scientific_communication
      weight: 15
      criteria:
        - Clear report
        - Good visualizations
        - Uncertainty discussed
        - Professional quality

metadata:
  difficulty: expert
  estimated_time_minutes: 180
  gpu_recommended: true
  skills_tested:
    - crystallography
    - xrd_analysis
    - structure_determination
    - cross_modal_reasoning
  notes: |
    This benchmark tests cross-modal reasoning - integrating experimental
    data (XRD) with computational methods (MLIP, structure generation).
    The provided XRD pattern corresponds to layered LiNiO2 (R-3m), but
    the agent must discover this through systematic analysis. This
    mimics real experimental-computational collaboration.
