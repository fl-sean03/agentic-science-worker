reference_solution:
  location: reference/solutions/t4-005-mlip-softening/
  notes: |
    Key findings from Deng et al. 2025:

    1. Softening Effect:
       - M3GNet, CHGNet, MACE-MP-0 all show systematic
         underprediction of energies for non-equilibrium configs
       - Surfaces: underpredicted by ~0.1-0.3 J/m²
       - Defects: formation energies too low
       - Barriers: migration barriers underestimated

    2. Root Cause:
       - Materials Project training data is biased toward
         equilibrium structures (relaxed configurations)
       - High-energy states underrepresented
       - Model learns "soft" PES curvature

    3. Implications:
       - Don't trust MLIP barriers without validation
       - Surface energies may be systematically wrong
       - Defect concentrations will be overestimated

    4. Solutions:
       - Fine-tuning with high-energy data
       - Active learning to improve coverage
       - Validate against DFT for critical properties

    DOI: 10.1038/s41524-024-01500-6

