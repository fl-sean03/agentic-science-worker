# Tier 4 Benchmark: Reproduce MLIP Systematic Softening Study
# Recent cutting-edge paper (January 2025) on universal MLIP limitations

id: BENCH-T4-005
name: Reproduce MLIP Systematic Softening Study
tier: 4
category: paper-reproduction

description: |
  Reproduce key findings from a cutting-edge 2025 paper revealing that
  universal machine learning potentials (M3GNet, CHGNet, MACE) systematically
  underpredict energies - a critical limitation for materials discovery.

  This tests the agent's ability to:
  1. Understand state-of-the-art ML potential literature
  2. Design validation experiments
  3. Critically evaluate model limitations
  4. Reproduce quantitative findings from recent research

prompt: |
  Your task is to reproduce key findings from this recent paper:

  **Deng, B. et al. "Systematic softening in universal machine learning
  interatomic potentials" npj Computational Materials 11, 9 (2025)**
  DOI: 10.1038/s41524-024-01500-6

  This paper reveals that universal MLIPs (M3GNet, CHGNet, MACE-MP-0)
  systematically underpredict energies for:
  - Surface energies
  - Defect formation energies
  - Migration barriers
  - High-energy atomic configurations

  **Your objectives:**

  1. Find and read the paper
  2. Understand the "systematic softening" phenomenon
  3. Design a validation experiment to test this finding:
     - Pick a simple system (e.g., Cu or Si surface)
     - Compare MLIP surface energy to DFT literature values
     - Quantify the systematic underprediction
  4. Discuss the implications for materials discovery workflows
  5. Propose how you would correct for this effect in your research

  **Key questions to address:**
  - Why does softening occur? (training data bias)
  - Which properties are most affected?
  - How large is the systematic error?
  - What does this mean for trusting MLIP predictions?

  Work in: workspaces/benchmarks/t4-005-mlip-softening/

