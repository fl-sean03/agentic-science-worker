id: BENCH-T4-007
name: Independent Research Question
tier: 4
description: >
  Test the agent's ability to conduct independent research on an open-ended
  scientific question. No parameters, methods, or expected answers are provided.
  The agent must approach this as a real researcher would.

prompt: |
  Research Question:
  "How does the self-diffusion coefficient of liquid argon change with temperature
  near the triple point? Is there a simple relationship (e.g., Arrhenius)?"

  You are a researcher investigating this question. You have:
  - Access to simulation tools (LAMMPS)
  - Access to literature (web search, Semantic Scholar)
  - Your scientific knowledge and reasoning

  Conduct a study to answer this question:
  1. Research what's known about temperature dependence of diffusion in liquids
  2. Design a computational study (choose temperatures, simulation parameters)
  3. Execute simulations at multiple temperatures
  4. Analyze your data to determine the temperature dependence
  5. Compare your findings to any theoretical predictions or literature data
  6. Write a research report with your methodology, results, and conclusions

  This is open-ended research. Use your judgment about methodology.
  Quality of scientific reasoning matters more than quantity of simulations.

expected_outputs:
  files:
    - name: "report.md"
      description: "Research report with methodology, results, and conclusions"
    - name: "literature_review.md"
      description: "Summary of relevant literature"
    - name: "data/"
      description: "Directory with simulation data and analysis"

grading:
  categories:
    - name: research_design
      weight: 25
      criteria:
        - Reasonable choice of temperatures
        - Appropriate simulation methodology
        - Justified decisions with citations or reasoning
    - name: execution
      weight: 20
      criteria:
        - Simulations completed without errors
        - Multiple temperatures studied
        - Analysis correctly performed
    - name: scientific_reasoning
      weight: 30
      criteria:
        - Results interpreted physically
        - Comparison to theory/literature
        - Uncertainties discussed
        - Conclusions supported by data
    - name: independence
      weight: 25
      criteria:
        - Found own parameters
        - Cited sources
        - Made reasoned methodological choices
        - Didn't rely on being told what to do

time_limit_minutes: 120

metadata:
  difficulty: expert
  skills_tested:
    - independent_research
    - experimental_design
    - scientific_reasoning
    - literature_integration
  notes: >
    This is the ultimate test of agentic behavior - can the agent conduct
    real research with minimal guidance? Tests the full researcher mindset.
