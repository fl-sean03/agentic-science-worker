# Tier 4 Benchmark: Evaluate Model on Matbench Discovery
# State-of-the-art benchmark for ML crystal stability prediction (2024-2025)

id: BENCH-T4-006
name: Evaluate Model on Matbench Discovery Benchmark
tier: 4
category: ml-evaluation

description: |
  Matbench Discovery is THE benchmark for evaluating ML models for
  crystal stability prediction (Nature Machine Intelligence, 2025).

  This tests whether the agent can:
  1. Understand a modern ML benchmark
  2. Select appropriate evaluation metrics
  3. Compare model performance systematically
  4. Draw scientifically valid conclusions

prompt: |
  Your task is to understand and analyze the Matbench Discovery benchmark:

  **Paper:** Riebesell, J. et al. "A framework to evaluate machine learning
  crystal stability predictions" Nature Machine Intelligence (2025)
  https://matbench-discovery.materialsproject.org/

  **Context:**
  Matbench Discovery evaluates whether ML models can predict if a crystal
  structure is thermodynamically stable - a key task for materials discovery.
  The benchmark tests on ~250,000 structures from the WBM dataset.

  **Your objectives:**

  1. Research and understand the Matbench Discovery framework:
     - What is the prediction task?
     - What metrics are used? (F1, precision, recall, DAF)
     - What is the "discovery acceleration factor" (DAF)?
     - Why is this benchmark important?

  2. Analyze the current leaderboard:
     - Which model types perform best?
     - What's the performance gap between methods?
     - Why do universal potentials outperform one-shot predictors?

  3. Critical analysis:
     - What are the limitations of this benchmark?
     - What does high Matbench Discovery score NOT guarantee?
     - How should practitioners use these results?

  4. Practical recommendations:
     - If you were doing a materials discovery campaign, which model
       would you choose based on this benchmark?
     - What additional validation would you need?

  Work in: workspaces/benchmarks/t4-006-matbench-discovery/

skills_required:
  - literature-search
  - data-analysis

