reference_solution:
  location: reference/solutions/t4-006-matbench-discovery/
  notes: |
    Matbench Discovery Key Points:

    1. Task:
       - Predict thermodynamic stability of crystals
       - Binary: stable (on hull) vs unstable (above hull)
       - Test set: ~250k WBM structures

    2. Top Performers (as of 2024):
       - CHGNet: F1 ≈ 0.67
       - MACE-MP-0: F1 ≈ 0.65
       - M3GNet: F1 ≈ 0.57
       - One-shot predictors: lower performance

    3. DAF (Discovery Acceleration Factor):
       - Measures speedup over random selection
       - Max possible ~6.5x (15% base rate)
       - Best models achieve ~4-5x

    4. Limitations:
       - Stability ≠ synthesizability
       - Doesn't test kinetics, metastability
       - Potential data leakage with MP structures
       - Doesn't guarantee accuracy on new chemistries

    5. Recommendation:
       - Use universal potentials as pre-filters
       - Verify top candidates with DFT
       - Don't trust for novel chemistries without validation

    URL: https://matbench-discovery.materialsproject.org/
    Paper: Nature Machine Intelligence (2025)

