# Tier 4 Benchmark: Reproduce TIP4P Water Paper
# One of the most cited papers in science - can the agent reproduce it?

id: BENCH-T4-002
name: Reproduce Jorgensen 1983 TIP4P Water
tier: 4
category: paper-reproduction

description: |
  Reproduce results from one of the most cited scientific papers of all time:
  Jorgensen et al. "Comparison of simple potential functions for simulating
  liquid water" J. Chem. Phys. 79, 926 (1983).

  This paper introduced TIP4P and TIP3P water models used in virtually all
  biomolecular simulations. With 45,000+ citations, it ranks among the top
  100 most cited papers in history.

prompt: |
  Your task is to reproduce results from this landmark paper:

  **Jorgensen, W. L.; Chandrasekhar, J.; Madura, J. D.; Impey, R. W.; Klein, M. L.
  "Comparison of simple potential functions for simulating liquid water"
  J. Chem. Phys. 79, 926-935 (1983)**

  This paper defined the TIP4P water model that became foundational for
  computational chemistry and biology. It has over 45,000 citations.

  Your objective:
  1. Find and read the paper (search Semantic Scholar, J. Chem. Phys.)
  2. Extract the TIP4P model parameters:
     - Geometry (O-H bond length, H-O-H angle, M-site position)
     - Charges on H and M sites
     - Lennard-Jones parameters on oxygen
  3. Set up a LAMMPS simulation of liquid water using TIP4P
  4. Run NPT simulation at 25°C and 1 atm
  5. Calculate the density and compare to:
     - Experimental value (0.997 g/cm³ at 25°C)
     - Jorgensen's simulation result
  6. Optionally: Calculate radial distribution function g_OO(r)

  Requirements:
  - Extract ALL model parameters from the paper (not from LAMMPS docs)
  - Document parameter sources in your notes
  - Use NPT ensemble as in the original paper (they used Monte Carlo NPT)
  - Calculate statistical uncertainty

  Deliverables:
  - literature_notes.md: Extracted parameters with page/table references
  - input.lmp: LAMMPS input for TIP4P water
  - data.water: Initial water box configuration
  - density_analysis.py: Script to calculate average density
  - report.md: Comparison of your results to paper

  Work in: workspaces/benchmarks/t4-002-tip4p-1983/

skills_required:
  - literature-search
  - lammps-simulation
  - data-analysis

time_limit_minutes: 150

milestones:
  - id: M1
    description: "Paper found and TIP4P parameters extracted"
    weight: 0.25
    validation: |
      Paper cited: Jorgensen et al., J. Chem. Phys. 79, 926 (1983)
      Geometry: O-H = 0.9572 Å, ∠HOH = 104.52°
      M-site: 0.15 Å from O along bisector
      Charges: q(H) = +0.52e, q(M) = -1.04e
      LJ: ε(O) = 0.1550 kcal/mol, σ(O) = 3.15365 Å

  - id: M2
    description: "TIP4P water box created"
    weight: 0.20
    validation: |
      LAMMPS data file with TIP4P geometry
      Reasonable system size (>200 molecules)
      Proper atom types and charges

  - id: M3
    description: "NPT simulation completed"
    weight: 0.25
    validation: |
      NPT at 298.15K, 1 atm
      Equilibration performed
      Production run for density averaging

  - id: M4
    description: "Density calculated and compared"
    weight: 0.30
    validation: |
      Average density computed
      Statistical uncertainty estimated
      Comparison to exp (0.997) and paper value
      Reasonable agreement (within 3%)

expected_outputs:
  files:
    - workspaces/benchmarks/t4-002-tip4p-1983/literature_notes.md
    - workspaces/benchmarks/t4-002-tip4p-1983/input.lmp
    - workspaces/benchmarks/t4-002-tip4p-1983/data.water
    - workspaces/benchmarks/t4-002-tip4p-1983/report.md

  values:
    water_density:
      description: "Calculated water density at 298K, 1atm"
      expected_range: [0.97, 1.02]  # g/cm³
      unit: "g/cm³"

grading:
  total_points: 100

  categories:
    literature_extraction:
      weight: 30
      checks:
        - name: "Found original paper"
          points: 8
          validation: |
            J. Chem. Phys. 79, 926 (1983) cited
        - name: "Geometry parameters correct"
          points: 8
          validation: |
            O-H, H-O-H angle, M-site position
        - name: "Force field parameters correct"
          points: 8
          validation: |
            LJ ε and σ, charges
        - name: "Table/page references given"
          points: 6
          validation: |
            Specific citations to paper sections

    simulation_setup:
      weight: 30
      checks:
        - name: "TIP4P model correct"
          points: 12
          validation: |
            4-site model properly implemented
        - name: "System size adequate"
          points: 8
          validation: |
            >= 200 molecules
        - name: "Thermodynamic conditions"
          points: 10
          validation: |
            NPT at 298.15K, 1 atm

    analysis_quality:
      weight: 25
      checks:
        - name: "Density calculated"
          points: 12
          validation: |
            Average from equilibrated portion
        - name: "Uncertainty estimated"
          points: 8
          validation: |
            Block averaging or similar
        - name: "Proper units"
          points: 5
          validation: |
            g/cm³

    results_comparison:
      weight: 15
      checks:
        - name: "Compared to experiment"
          points: 8
          validation: |
            Reference: 0.997 g/cm³ at 25°C
        - name: "Compared to paper"
          points: 7
          validation: |
            Jorgensen's TIP4P result discussed

clear_metrics:
  cost:
    max_tokens: 100000
    max_simulation_time: 7200

reference_solution:
  location: reference/solutions/t4-002-tip4p-1983/
  notes: |
    TIP4P Parameters (Jorgensen 1983, Table I):
    - O-H distance: 0.9572 Å
    - H-O-H angle: 104.52°
    - M-site distance from O: 0.15 Å
    - q(H) = +0.52e, q(M) = -1.04e
    - ε(O) = 0.1550 kcal/mol
    - σ(O) = 3.15365 Å

    Expected Results:
    - TIP4P density at 25°C: ~0.999-1.001 g/cm³
    - Experimental: 0.997 g/cm³

    Citation: DOI: 10.1063/1.445869

