# Tier 4 Benchmark: Validate Universal ML Potential
# Tests scientific judgment: Can the agent critically evaluate an ML model?

id: BENCH-T4-003
name: Validate MACE Potential for Novel System
tier: 4
category: scientific-reasoning

description: |
  Universal machine learning interatomic potentials (MLIPs) like MACE,
  M3GNet, and CHGNet claim to work across the periodic table. But do they
  actually work for YOUR system?

  This benchmark tests whether the agent can critically evaluate an ML
  potential's reliability for a specific application - a skill essential
  for modern computational materials science.

  Recent research shows MLIPs often fail silently - producing plausible
  but incorrect results. Can the agent catch this?

prompt: |
  You are tasked with validating whether the MACE universal potential
  can be trusted for studying a specific material system.

  **The question:**
  A colleague wants to use MACE-MP-0 (the Materials Project trained MACE
  model) to study lithium diffusion in Li₃PS₄ solid electrolyte.
  They ask: "Can I trust MACE for this system, or should I use DFT?"

  **Your task:**
  Conduct a systematic validation study to answer this question.

  You should:
  1. Research the MACE model and what it was trained on
  2. Research Li₃PS₄ - its structure, known properties, experimental data
  3. Design validation tests that would reveal if MACE is reliable:
     - Lattice parameters vs experimental/DFT
     - Energy ordering of polymorphs (α, β, γ phases)
     - Phonon stability (imaginary frequencies = problem)
     - Li migration barriers if feasible
  4. Discuss what properties MACE might get wrong and why
  5. Make a scientific recommendation with justification

  **Key insight needed:**
  MLIPs can fail in subtle ways - they might get the structure right but
  energetics wrong, or vice versa. Your validation must be comprehensive.

  This is an open-ended research task. Think critically.

  Work in: workspaces/benchmarks/t4-003-mace-validation/

skills_required:
  - literature-search
  - materials-database
  - data-analysis

time_limit_minutes: 120

# This tests reasoning more than execution
evaluation_type: scientific_reasoning

milestones:
  - id: M1
    description: "Understood MACE training data and limitations"
    weight: 0.20
    validation: |
      Identified: MACE-MP-0 trained on Materials Project data
      Noted: GGA-level DFT, bulk structures, may not have
      diffusion barriers or defects in training

  - id: M2
    description: "Researched Li3PS4 system"
    weight: 0.20
    validation: |
      Found: Multiple polymorphs (α, β, γ)
      Found: Experimental conductivity data
      Found: DFT studies for comparison

  - id: M3
    description: "Designed appropriate validation tests"
    weight: 0.25
    validation: |
      Proposed tests beyond just lattice parameters
      Considered: polymorph energetics, dynamics, barriers
      Showed understanding of how MLIPs can fail

  - id: M4
    description: "Made justified scientific recommendation"
    weight: 0.35
    validation: |
      Clear recommendation (use MACE / don't use / use with caveats)
      Justified with scientific reasoning
      Identified specific risks
      Suggested validation checks user should run

expected_outputs:
  files:
    - workspaces/benchmarks/t4-003-mace-validation/literature_review.md
    - workspaces/benchmarks/t4-003-mace-validation/validation_plan.md
    - workspaces/benchmarks/t4-003-mace-validation/recommendation.md

grading:
  total_points: 100

  # This benchmark is graded primarily on reasoning quality
  categories:
    understanding_of_mlips:
      weight: 25
      checks:
        - name: "Knows MACE training data"
          points: 10
          validation: |
            Identified Materials Project source
            Understands GGA-level accuracy
        - name: "Understands MLIP failure modes"
          points: 15
          validation: |
            Discussed: extrapolation errors
            Discussed: underrepresented chemistries
            Discussed: property-specific accuracy

    domain_knowledge:
      weight: 25
      checks:
        - name: "Researched Li3PS4"
          points: 12
          validation: |
            Found polymorph information
            Found experimental conductivity
        - name: "Found relevant DFT studies"
          points: 13
          validation: |
            Referenced DFT calculations for comparison

    validation_design:
      weight: 25
      checks:
        - name: "Proposed comprehensive tests"
          points: 15
          validation: |
            Multiple validation approaches
            Not just lattice constant
        - name: "Identified what could go wrong"
          points: 10
          validation: |
            Specific failure scenarios discussed

    scientific_judgment:
      weight: 25
      checks:
        - name: "Clear recommendation"
          points: 10
          validation: |
            Explicit answer to the question
        - name: "Well-justified reasoning"
          points: 10
          validation: |
            Logic follows from evidence
        - name: "Appropriate caveats"
          points: 5
          validation: |
            Acknowledges uncertainties

clear_metrics:
  cost:
    max_tokens: 60000
    max_api_calls: 40

  assurance:
    requires_literature_citations: true
    requires_justified_conclusions: true

reference_solution:
  location: reference/solutions/t4-003-mace-validation/
  notes: |
    Key points a good answer should include:

    1. MACE-MP-0 Limitations:
       - Trained on Materials Project bulk relaxations
       - GGA-level accuracy (PBE)
       - May not have sulfide electrolytes well-represented
       - Diffusion barriers not in training data

    2. Li3PS4 Considerations:
       - Multiple polymorphs with close energies
       - Fast Li-ion conductor (>10⁻⁴ S/cm)
       - Activation energy ~0.3-0.4 eV

    3. Recommended Validation:
       - Compare lattice parameters to DFT/experiment
       - Check polymorph energy ordering
       - Run short MD, check for instabilities
       - Compare to published DFT migration barriers

    4. Likely Recommendation:
       "Use with caution" - good for screening but
       verify key results with DFT, especially barriers.

    Recent papers (2024) show MLIPs struggle with
    sulfide electrolytes and diffusion barriers.

