# Tier 12 Benchmark: Literature-Driven Hypothesis Generation
# Generate testable hypotheses from scientific literature corpus

id: BENCH-T12-001
name: Literature-Driven Hypothesis Generation
tier: 12
category: theory-synthesis

description: |
  Use the theory-synthesis skill to generate research hypotheses from
  scientific literature, then design a computational test for the hypothesis.
  This tests the agent's ability to bridge literature synthesis with simulation.

prompt: |
  **Task: Generate and Test a Research Hypothesis**

  Your goal is to use literature-driven theory synthesis to generate a
  scientific hypothesis, then design a simulation to test it.

  **Topic: Thermal Conductivity of 2D Materials**

  2D materials like graphene have exceptional thermal properties, but
  understanding what controls thermal conductivity across different 2D
  materials remains an active research area.

  **Phase 1: Theory Synthesis**

  Use the theory-synthesis skill (ASTA Theorizer) to:
  1. Query: "Factors controlling thermal conductivity in 2D materials"
  2. Analyze 50-100 papers on the topic
  3. Extract:
     - Known relationships (quantitative if possible)
     - Key factors identified in literature
     - Gaps in current understanding
     - Conflicting findings across papers

  Document the synthesized theory including:
  - Main factors affecting thermal conductivity
  - Any quantitative relationships found
  - Confidence level of the theory
  - Specific gaps or uncertainties

  **Phase 2: Hypothesis Formulation**

  Based on the synthesized theory, formulate a specific, testable hypothesis.

  Good hypothesis characteristics:
  - Specific and measurable
  - Based on literature evidence
  - Testable with available tools (LAMMPS, MLIPs)
  - Addresses a gap or resolves a conflict

  Example format:
  "We hypothesize that [specific factor] has [relationship] with thermal
  conductivity in [material class], with magnitude [X] based on [evidence]."

  **Phase 3: Simulation Design**

  Design a computational experiment to test your hypothesis:
  1. Choose appropriate method (MD with MLIP, classical potential)
  2. Define test conditions (temperatures, system sizes)
  3. Specify what you'll measure
  4. Define success criteria

  **Phase 4: Execute Test (Simplified)**

  Run a proof-of-concept simulation:
  - Calculate thermal conductivity for 2-3 2D materials
  - Use Green-Kubo or NEMD method
  - Compare results to literature values
  - Assess if hypothesis is supported

  **Phase 5: Report**

  Write a research report:
  1. Literature synthesis summary
  2. Hypothesis statement with justification
  3. Simulation methodology
  4. Results and comparison
  5. Conclusion: Was hypothesis supported?
  6. Future directions

  Work in: workspaces/benchmarks/BENCH-T12-001/

skills_required:
  - theory-synthesis
  - lammps-simulation
  - mlip-simulation
  - data-analysis
  - literature-search

time_limit_minutes: 240

expected_outputs:
  files:
    - name: "synthesis/theory_output.json"
      description: "Raw Theorizer output"
    - name: "synthesis/literature_summary.md"
      description: "Summarized synthesis findings"
    - name: "hypothesis/hypothesis_statement.md"
      description: "Formal hypothesis with justification"
    - name: "simulation/design.md"
      description: "Simulation methodology"
    - name: "simulation/thermal_conductivity.py"
      description: "Calculation script"
    - name: "results/comparison.csv"
      description: "Results vs literature"
    - name: "report.md"
      description: "Full research report"

  values:
    papers_analyzed:
      description: "Number of papers in synthesis"
      expected_range: [30, 150]
    hypothesis_testable:
      description: "Hypothesis is specific and testable"
      expected_range: [0.8, 1.0]
      unit: "boolean"
    simulation_completed:
      description: "Proof-of-concept simulation ran"
      expected_range: [0.8, 1.0]
      unit: "boolean"

grading:
  categories:
    - name: theory_synthesis
      weight: 30
      criteria:
        - Theorizer used correctly
        - Sufficient papers analyzed
        - Key factors extracted
        - Gaps identified
        - Evidence properly cited

    - name: hypothesis_quality
      weight: 25
      criteria:
        - Hypothesis is specific
        - Based on literature evidence
        - Testable with available tools
        - Addresses real gap/question
        - Clearly stated

    - name: simulation_design
      weight: 20
      criteria:
        - Appropriate method chosen
        - Clear test conditions
        - Measurable outcomes defined
        - Reasonable scope

    - name: execution_analysis
      weight: 25
      criteria:
        - Simulation completed
        - Results interpreted correctly
        - Compared to hypothesis
        - Limitations acknowledged
        - Future directions suggested

metadata:
  difficulty: expert
  estimated_time_minutes: 240
  gpu_recommended: true
  external_api_required:
    - theorizer
    - semantic_scholar
  skills_tested:
    - theory_synthesis
    - hypothesis_generation
    - simulation_design
    - scientific_reasoning
  notes: |
    This is the first benchmark testing the theory-synthesis skill.
    The agent must bridge literature synthesis (Theorizer) with
    computational validation (simulation). Success requires both
    good literature understanding and simulation execution.
