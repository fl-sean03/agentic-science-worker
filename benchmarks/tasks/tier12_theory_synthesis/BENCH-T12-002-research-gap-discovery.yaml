# Tier 12 Benchmark: Research Gap Discovery and Exploitation
# Identify gaps in literature and propose computational studies to fill them

id: BENCH-T12-002
name: Research Gap Discovery
tier: 12
category: theory-synthesis

description: |
  Use theory synthesis to systematically identify research gaps in a field,
  then propose and execute a computational study to address one gap.

prompt: |
  **Task: Discover and Address a Research Gap**

  Use literature synthesis to find what the field doesn't know, then
  contribute new computational data to partially fill that gap.

  **Topic: Machine Learning Potentials for Surface Chemistry**

  MLIPs have revolutionized bulk property prediction, but surface chemistry
  remains challenging. Your task is to systematically identify gaps and
  contribute new knowledge.

  **Phase 1: Systematic Gap Analysis**

  Use theory-synthesis to analyze the state of MLIP surface chemistry:

  Query 1: "Universal MLIP accuracy for surface energies and adsorption"
  Query 2: "Limitations of machine learning potentials for catalysis"
  Query 3: "MACE CHGNet M3GNet surface chemistry benchmark"

  From the synthesis, identify:
  - What surface properties have been well-validated?
  - What surface properties are poorly characterized?
  - Which material classes lack MLIP surface data?
  - What systematic errors are known?

  Create a "gap map":
  | Property | Well-Studied | Gaps |
  |----------|--------------|------|
  | Surface energy | Metals | Oxides, complex surfaces |
  | Adsorption | Simple molecules | Multi-adsorbate |
  | ... | ... | ... |

  **Phase 2: Gap Selection**

  Choose ONE specific gap to address based on:
  - Feasibility with available tools
  - Scientific importance
  - Novelty (not already being addressed)
  - Your ability to make meaningful contribution

  Document your reasoning for gap selection.

  **Phase 3: Study Design**

  Design a computational study to partially fill the gap:
  - Define scope (which materials, which properties)
  - Choose methods (MLIP type, DFT for validation)
  - Plan calculations
  - Define success criteria

  **Phase 4: Execute Study**

  Run your computational study:
  - Calculate the property for selected systems
  - If possible, validate against DFT for 1-2 cases
  - Compare to any available literature values
  - Quantify uncertainties

  **Phase 5: Contribution Report**

  Write a report suitable for supplementary data contribution:
  1. Gap identification methodology
  2. Selected gap and rationale
  3. Computational methodology
  4. New data generated
  5. Validation where possible
  6. Recommendations for field

  Work in: workspaces/benchmarks/BENCH-T12-002/

skills_required:
  - theory-synthesis
  - mlip-simulation
  - quantum-espresso
  - data-analysis
  - literature-search

time_limit_minutes: 300

expected_outputs:
  files:
    - name: "gap_analysis/synthesis_results/"
      description: "Theorizer outputs for each query"
    - name: "gap_analysis/gap_map.md"
      description: "Systematic gap mapping"
    - name: "study_design/selected_gap.md"
      description: "Gap selection with rationale"
    - name: "study_design/methodology.md"
      description: "Computational study design"
    - name: "calculations/"
      description: "Calculation inputs and outputs"
    - name: "results/new_data.csv"
      description: "New computational data"
    - name: "results/validation.csv"
      description: "Validation against DFT/literature"
    - name: "report.md"
      description: "Full contribution report"

  values:
    gaps_identified:
      description: "Number of distinct gaps found"
      expected_range: [3, 15]
    new_datapoints:
      description: "Number of new data points generated"
      expected_range: [5, 50]
    validation_performed:
      description: "DFT validation attempted"
      expected_range: [0.5, 1.0]
      unit: "boolean"

grading:
  categories:
    - name: gap_analysis
      weight: 30
      criteria:
        - Multiple queries used
        - Systematic mapping created
        - Gaps clearly articulated
        - Evidence-based identification
        - Important gaps highlighted

    - name: study_design
      weight: 20
      criteria:
        - Feasible scope
        - Clear methodology
        - Appropriate methods
        - Success criteria defined

    - name: execution
      weight: 30
      criteria:
        - Calculations completed
        - Data properly organized
        - Validation attempted
        - Results reasonable

    - name: scientific_contribution
      weight: 20
      criteria:
        - New data is useful
        - Properly documented
        - Limitations acknowledged
        - Actionable conclusions

metadata:
  difficulty: expert
  estimated_time_minutes: 300
  gpu_recommended: true
  dft_optional: true
  external_api_required:
    - theorizer
    - semantic_scholar
  skills_tested:
    - systematic_review
    - gap_identification
    - study_design
    - independent_research
  notes: |
    This benchmark tests the agent's ability to do independent research:
    identify what's missing in the field and contribute to filling it.
    This is a core scientific skill - finding the important unknowns.
