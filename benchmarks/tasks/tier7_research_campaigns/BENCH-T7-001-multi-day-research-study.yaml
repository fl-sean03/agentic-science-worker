# Tier 7 Benchmark: Multi-Day Research Study
# Complete research project requiring days of HPC time

id: BENCH-T7-001
name: Multi-Day Research Study
tier: 7
category: research-campaign

description: |
  Conduct a complete research study on the thermal conductivity of silicon
  as a function of temperature. This requires multiple long-running simulations
  over the course of days, systematic data collection, and a publication-quality
  analysis. This benchmark tests the agent's ability to manage asynchronous,
  multi-day computational campaigns.

prompt: |
  **Research Project:**
  Calculate the thermal conductivity of silicon from 200K to 1000K using
  non-equilibrium molecular dynamics (NEMD). This is a complete research
  project requiring multiple days of HPC time.

  **Background:**
  Thermal conductivity (κ) is critical for thermal management in electronics.
  For silicon:
  - κ decreases with increasing temperature (Umklapp scattering)
  - Experimental κ at 300K ≈ 150 W/m·K (bulk)
  - MD with classical potentials typically gives lower values
  - NEMD method: impose heat flux, measure temperature gradient

  **Your Research Campaign:**

  **Phase 1: Literature and Setup (Day 1)**

  Step 1.1: Literature Research
  - Find experimental κ(T) data for silicon
  - Find MD studies of Si thermal conductivity
  - Find appropriate potential (Tersoff, Stillinger-Weber, or newer)
  - Understand NEMD methodology for thermal conductivity

  Step 1.2: Method Validation
  - Create small test system (1000-2000 atoms)
  - Run NEMD at 300K on atesting
  - Verify method works and estimate required system size

  Step 1.3: Production Design
  - Design full temperature series: 200, 300, 400, 500, 600, 800, 1000 K
  - Size: Large enough for converged results (10k-50k atoms)
  - Plan: equilibration time, NEMD production time, statistical averaging

  **Phase 2: Submit Production Jobs (Day 1-2)**

  Step 2.1: Create Job Infrastructure
  - Generate LAMMPS inputs for all temperatures
  - Create SLURM scripts with appropriate resources
  - Set up output organization

  Step 2.2: Submit to HPC
  - Submit all temperature points as separate jobs or job array
  - Use amilan or amilan128c for production runs
  - Track all job submissions with async system

  Step 2.3: Monitor Progress
  - Check job status periodically
  - Handle any failures or queue issues
  - Document estimated completion times

  **Phase 3: Collect and Analyze (Day 2-3+)**

  Step 3.1: Result Collection
  - As jobs complete, retrieve output files
  - Parse thermal conductivity from each temperature
  - Compile results into master dataset

  Step 3.2: Quality Control
  - Check convergence at each temperature
  - Identify any anomalous results
  - Rerun if necessary

  Step 3.3: Analysis
  - Plot κ vs T
  - Fit to expected T^n dependence
  - Compare to experimental data
  - Quantify discrepancies

  **Phase 4: Research Report**

  Write a publication-quality report including:
  - Introduction and motivation
  - Methodology (potential, NEMD setup, system size)
  - Results (κ vs T with error bars)
  - Comparison to experiment
  - Discussion of force field limitations
  - Conclusion

  **Async Management Requirements:**
  - Use non-blocking job submission
  - Track all jobs with job tracking files
  - Periodically check status and collect results
  - Handle multi-day queue times gracefully
  - Provide progress updates when queried

  Work in: workspaces/benchmarks/BENCH-T7-001/

skills_required:
  - hpc-cluster
  - lammps-simulation
  - literature-search
  - data-analysis

time_limit_minutes: 480  # 8 hours initial setup; simulations run async over days

