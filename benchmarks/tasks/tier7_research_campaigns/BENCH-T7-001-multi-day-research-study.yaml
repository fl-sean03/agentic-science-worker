        - Appropriate method selection (NEMD)
        - Reasonable temperature range
        - Proper validation on test system

    - name: hpc_campaign_management
      weight: 25
      criteria:
        - All temperatures submitted to HPC
        - Async job management used properly
        - Jobs tracked systematically
        - Multi-day timeline handled gracefully

    - name: data_collection
      weight: 20
      criteria:
        - Results collected as jobs complete
        - Missing or failed jobs identified
        - Data compiled systematically
        - Quality checks performed

    - name: scientific_analysis
      weight: 25
      criteria:
        - κ extracted correctly from NEMD
        - Temperature dependence analyzed
        - Comparison to experiment
        - Uncertainties quantified

    - name: research_quality
      weight: 15
      criteria:
        - Report is publication-quality
        - Methodology clearly described
        - Limitations discussed
        - Conclusions supported by data

