    - name: "results/thermal_conductivity.csv"
      description: "Compiled κ(T) data"
    - name: "analysis/kappa_vs_T.png"
      description: "Thermal conductivity vs temperature plot"
    - name: "analysis/comparison_to_experiment.png"
      description: "Comparison to experimental data"
    - name: "report.md"
