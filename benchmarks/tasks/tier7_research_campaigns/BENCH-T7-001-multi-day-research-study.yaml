      description: "Thermal conductivity at 300K"
      expected_range: [30, 200]  # W/m·K, depends on potential and size
      unit: "W/m·K"
    temperature_exponent:
      description: "Exponent n in κ ~ T^n fit"
      expected_range: [-1.5, -0.5]  # Should be negative (decreasing κ)

