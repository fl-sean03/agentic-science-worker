# Tier 7 Benchmark: Collaborative Local/HPC Computation
# Orchestrate work between local workstation and HPC

id: BENCH-T7-003
name: Collaborative Local/HPC Computation
tier: 7
category: research-campaign

description: |
  Complete a research task that requires intelligent orchestration between
  local workstation and HPC resources. The agent must decide what runs
  where, manage data flow between systems, and optimize for total time
  to completion while minimizing queue wait times.

prompt: |
  **Research Project:**
  Develop and validate an EAM potential for a gold-copper (AuCu) alloy by:
  1. Gathering reference data from DFT (local GPU)
  2. Running large-scale validation MD (HPC)
  3. Analyzing results and iterating

  **Background:**
  Alloy potential development requires:
  - Reference data from higher-fidelity methods (DFT)
  - Validation on properties that require large systems (MD)
  - Iteration between the two

  For AuCu alloys:
  - Form ordered phases (L1₀ AuCu, L1₂ Au₃Cu, Cu₃Au)
  - Mixing enthalpy is negative (exothermic)
  - Lattice parameters intermediate between Au and Cu

  **Your Task:**

  **Phase 1: DFT Reference Data (Local GPU)**

  Run on local workstation (fast DFT GPU):

  Step 1.1: Calculate bulk properties of pure elements
  - Au: lattice constant, bulk modulus, cohesive energy
  - Cu: lattice constant, bulk modulus, cohesive energy

  Step 1.2: Calculate alloy formation energies
  - L1₀ AuCu (50-50 ordered)
  - L1₂ Au₃Cu
  - L1₂ Cu₃Au
  - Random solid solution at various compositions

  **Why Local:** DFT calculations are small (few atoms) but benefit from
  GPU acceleration. Local GPU is faster than waiting in HPC queue.

  **Phase 2: Potential Selection (Analysis)**

  Step 2.1: Find existing AuCu potentials
  - Search literature and potential databases
  - Find EAM or similar potentials for Au-Cu

  Step 2.2: Compare to DFT reference
  - Check if potentials reproduce formation energies
  - Check lattice parameters
  - Identify best available potential

  **Phase 3: Large-Scale Validation (HPC)**

  Run on HPC (large system, many cores):

  Step 3.1: Mechanical Properties
  - Calculate elastic constants of ordered phases
  - Compare to DFT values

  Step 3.2: Thermal Properties
  - Calculate thermal expansion coefficients
  - Compare to experiment if available

  Step 3.3: Phase Stability
  - Run MD at various temperatures
  - Check if ordered phases are stable
  - Look for order-disorder transitions

  **Why HPC:** These calculations need large supercells (1000+ atoms)
  and long MD runs - impractical on local workstation.

  **Phase 4: Integration**

  Step 4.1: Compile all results
  - DFT reference values
  - Classical potential predictions
  - Experimental values (from literature)

  Step 4.2: Analysis
  - Quantify agreement between DFT, classical, experiment
  - Identify potential limitations
  - Recommend potential for specific applications

  **Orchestration Requirements:**

  The agent must intelligently manage:

  1. **Resource Selection**
     - Small DFT → Local GPU (fast, no queue)
     - Large MD → HPC (scalable, but queue wait)
     - Analysis → Local (no special resources)

  2. **Parallelization**
     - Run DFT jobs in parallel locally if independent
     - Submit HPC jobs while DFT runs
     - Analyze results as they arrive

  3. **Data Flow**
     - Transfer DFT results to inform potential selection
     - Transfer MD inputs to HPC
     - Collect HPC results for analysis

  4. **Time Optimization**
     - Don't wait for HPC queue if local work pending
     - Overlap computation phases where possible
     - Total wall time matters, not just compute time

  **Deliverables:**

  - DFT reference data table
  - Potential validation results
  - Comparison figure (DFT vs classical vs experiment)
  - Recommendation for which potential to use
  - Workflow diagram showing local/HPC orchestration

  Work in: workspaces/benchmarks/BENCH-T7-003/

skills_required:
  - hpc-cluster
  - quantum-espresso
  - lammps-simulation
  - materials-database
  - literature-search
  - data-analysis

time_limit_minutes: 360  # 6 hours for setup; HPC jobs async

expected_outputs:
  files:
    - name: "dft/au_bulk.out"
      description: "DFT calculation for Au bulk"
    - name: "dft/cu_bulk.out"
      description: "DFT calculation for Cu bulk"
    - name: "dft/aucu_ordered/*.out"
      description: "DFT calculations for ordered phases"
    - name: "dft/reference_data.csv"
      description: "Compiled DFT reference data"
    - name: "literature/potentials.md"
      description: "Survey of available AuCu potentials"
    - name: "md_validation/inputs/*.lmp"
      description: "LAMMPS inputs for validation"
    - name: "md_validation/jobs/*.slurm"
      description: "HPC job scripts"
    - name: "analysis/comparison.png"
      description: "DFT vs classical vs experiment comparison"
    - name: "workflow_diagram.md"
      description: "Orchestration workflow documentation"
    - name: "report.md"
      description: "Full research report"

  values:
    aucu_formation_energy_dft:
      description: "L1₀ AuCu formation energy from DFT"
      expected_range: [-0.15, -0.05]  # eV/atom, should be negative
      unit: "eV/atom"
    aucu_formation_energy_classical:
      description: "L1₀ AuCu formation energy from classical potential"
      expected_range: [-0.2, 0.0]
      unit: "eV/atom"

grading:
  categories:
    - name: resource_orchestration
      weight: 25
      criteria:
        - Appropriate choice of local vs HPC for each task
        - Parallelized independent calculations
        - Minimized total wall-clock time
        - Efficient data transfer between systems

    - name: dft_calculations
      weight: 20
      criteria:
        - All required DFT calculations completed
        - Calculations properly converged
        - Reference data compiled correctly
        - Used GPU acceleration effectively

    - name: md_validation
      weight: 20
      criteria:
        - Large-scale MD run on HPC
        - Multiple properties calculated
        - Results extracted correctly
        - System sizes appropriate

    - name: integration_analysis
      weight: 25
      criteria:
        - All data sources combined
        - Meaningful comparison made
        - Discrepancies explained
        - Clear recommendations provided

    - name: workflow_documentation
      weight: 10
      criteria:
        - Orchestration clearly documented
        - Data flow explained
        - Workflow could be reproduced
        - Time efficiency analyzed

metadata:
  difficulty: expert
  estimated_time_minutes: 360
  async_completion: true
  multi_system: true
  resources:
    local:
      - "QE GPU for DFT"
      - "Python for analysis"
    hpc:
      - "amilan for large MD"
      - "atesting for validation"
  skills_tested:
    - multi_system_orchestration
    - dft_reference_generation
    - potential_validation
    - workflow_optimization
  notes: |
    This benchmark tests the agent's ability to intelligently distribute
    work across computing resources. Real computational research often
    involves multiple systems - local workstations for quick jobs, HPC
    for large calculations. The agent must optimize for total time while
    managing the complexity of multiple concurrent workflows.
