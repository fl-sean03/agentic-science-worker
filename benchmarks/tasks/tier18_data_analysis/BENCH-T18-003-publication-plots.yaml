# Tier 18 Benchmark: Publication-Quality Plots
# Generate figures suitable for scientific publication

id: BENCH-T18-003
name: Publication-Quality Plots
tier: 18
category: data-analysis

description: |
  Test the agent's ability to generate publication-quality scientific figures
  from simulation data. Proper visualization is critical for communicating
  computational results - figures must be clear, properly labeled, and
  follow scientific conventions.

prompt: |
  **Task: Generate Publication-Quality Figures from Simulation Data**

  Create professional scientific figures suitable for journal submission.
  You will run a simple simulation and then produce multiple figure types
  with proper formatting, labels, and annotations.

  **IMPORTANT: You must complete ALL steps below.**

  **Step 1: Generate Source Data**

  Run a LAMMPS simulation of Cu melting/solidification:

  ```lammps
  # Cu melting - generates good thermodynamic data
  units metal
  atom_style atomic

  lattice fcc 3.615
  region box block 0 5 0 5 0 5
  create_box 1 box
  create_atoms 1 box
  mass 1 63.546

  pair_style eam/alloy
  pair_coeff * * Cu_Zhou04.eam.alloy Cu

  # Start hot (liquid)
  velocity all create 2000 12345

  # Equilibrate liquid
  fix 1 all nvt temp 2000 2000 0.1
  thermo 100
  thermo_style custom step temp pe ke etotal press vol density
  run 5000

  # Cool to solid
  fix 1 all nvt temp 2000 500 0.1
  dump 1 all custom 500 trajectory.dump id type x y z
  run 30000
  ```

  **Step 2: Create Figure 1 - Temperature vs Time**

  Create a publication-quality line plot:
  - X-axis: Time (ps)
  - Y-axis: Temperature (K)
  - Clean axis labels with units
  - Appropriate tick marks
  - Grid lines (subtle, not overwhelming)
  - Font size appropriate for column width (~3.5 inches)

  Requirements:
  - Resolution: 300 DPI minimum
  - Format: PNG and PDF
  - Font: Arial or similar sans-serif
  - Line width: 1.5-2 pt

  **Step 3: Create Figure 2 - Energy Evolution**

  Multi-line plot showing:
  - Potential energy vs time
  - Kinetic energy vs time
  - Total energy vs time

  Requirements:
  - Clear legend (outside plot or inset)
  - Different line styles (solid, dashed, dotted)
  - Color blind-friendly palette
  - Same formatting standards as Figure 1

  **Step 4: Create Figure 3 - Structure Analysis**

  Calculate and plot radial distribution function (RDF):
  - Use initial frame (liquid at 2000K)
  - Use final frame (solid at 500K)
  - Plot both on same axes for comparison

  Requirements:
  - Clear liquid vs solid distinction
  - First peak labeled with position
  - Appropriate axis limits (0-10 Å typical)
  - Inset showing near-neighbor region (optional)

  **Step 5: Create Figure 4 - Phase Transition Visualization**

  Create a 2-panel figure:
  - Panel (a): Temperature + energy on dual y-axes
  - Panel (b): Density or volume vs temperature

  Requirements:
  - Proper dual-axis formatting
  - Panel labels (a), (b) in corners
  - Shared x-axis or proper alignment
  - Caption-ready layout

  **Step 6: Style Consistency Check**

  Verify all figures:
  - Same font family and sizes
  - Consistent color scheme
  - Matching line weights
  - Uniform axis label formatting
  - All units displayed

  **Step 7: Create Figure Captions**

  Write proper scientific figure captions:
  - Describe what is shown
  - Note key parameters
  - Highlight important features
  - Self-contained (reader shouldn't need main text)

  **Deliverables:**
  Create in workspaces/benchmarks/BENCH-T18-003/:

  ```
  simulation/
  ├── cu_melt.in
  ├── cu_melt.log
  └── trajectory.dump
  figures/
  ├── fig1_temperature.png
  ├── fig1_temperature.pdf
  ├── fig2_energy.png
  ├── fig2_energy.pdf
  ├── fig3_rdf.png
  ├── fig3_rdf.pdf
  ├── fig4_combined.png
  ├── fig4_combined.pdf
  scripts/
  ├── plot_temperature.py
  ├── plot_energy.py
  ├── plot_rdf.py
  ├── plot_combined.py
  captions.md              # All figure captions
  style_guide.md           # Formatting choices documented
  ```

  Work in: workspaces/benchmarks/BENCH-T18-003/

skills_required:
  - lammps-simulation
  - data-analysis

time_limit_minutes: 60

