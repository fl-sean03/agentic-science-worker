    - name: "figures/fig2_energy.png"
      description: "Energy evolution plot"
    - name: "figures/fig3_rdf.png"
      description: "RDF comparison plot"
    - name: "figures/fig4_combined.png"
      description: "Multi-panel combined figure"
    - name: "captions.md"
      description: "Figure captions"

  values:
    figures_created:
      description: "Number of unique figures"
      expected_range: [4, 6]
    pdf_versions:
      description: "PDF versions exist"
      expected: true
    captions_written:
      description: "All captions provided"
      expected: true

grading:
