      weight: 35
      criteria:
        - High resolution (300+ DPI)
        - Clean lines and fonts
        - Appropriate colors
        - Professional appearance
        - Print-ready quality

    - name: scientific_accuracy
      weight: 25
      criteria:
        - Correct axis labels with units
        - Appropriate axis ranges
        - Data accurately represented
        - Error bars where appropriate

    - name: consistency
      weight: 20
      criteria:
        - Matching fonts across figures
        - Consistent color scheme
        - Uniform axis formatting
        - Style guide documented

    - name: captions
      weight: 20
      criteria:
        - Complete captions for all figures
        - Key features highlighted
        - Parameters noted
        - Self-contained descriptions

metadata:
  difficulty: medium
  estimated_time_minutes: 45
  skills_tested:
    - data_visualization
    - matplotlib/plotting
    - scientific_communication
    - style_consistency
  notes: |
    Publication-quality figures are essential for scientific communication.
    This benchmark tests not just plotting ability but also attention to
