# Tier 18 Benchmark: Error Propagation Analysis
# Track uncertainties through multi-step calculations

id: BENCH-T18-004
name: Error Propagation Analysis
tier: 18
category: data-analysis

description: |
  Test the agent's ability to properly propagate uncertainties through
  multi-step data analysis. Real scientific analysis involves multiple
  calculations where errors compound. Proper error handling separates
  rigorous science from hand-waving.

prompt: |
  **Task: Propagate Uncertainties Through Thermal Conductivity Calculation**

  Calculate thermal conductivity from MD simulation and properly track
  uncertainties through each step of the analysis. This tests rigorous
  error handling in multi-step calculations.

  **IMPORTANT: You must complete ALL steps below with uncertainty tracking.**

  **Background: Green-Kubo Method**

  Thermal conductivity via Green-Kubo:
  ```
  κ = (V / kB T²) × ∫₀^∞ <J(0)·J(t)> dt
  ```

  Where J is the heat flux. Each quantity has uncertainty:
  - V (volume): statistical fluctuation in NPT
  - T (temperature): thermal fluctuation
  - Heat flux autocorrelation: sampling noise
  - Integration: cutoff/convergence error

  **Step 1: Run MD Simulation**

  Create LAMMPS simulation outputting heat flux:
  - System: Solid argon, ~1000 atoms
  - Ensemble: NVE (after equilibration)
  - Compute: Heat flux via `compute heat/flux`
  - Duration: Sufficient for autocorrelation (~100,000 steps)

  Extract:
  - Volume (report mean ± std if NPT)
  - Temperature (report mean ± std)
  - Heat flux time series

  **Step 2: Calculate Autocorrelation Function**

  Compute <J(0)·J(t)>:
  ```python
  def heat_flux_acf(Jx, Jy, Jz, max_lag):
      # Calculate autocorrelation for each component
      # Sum components for total
      return acf_total, acf_error
  ```

  For uncertainty:
  - Block averaging: divide trajectory into blocks
  - Calculate ACF for each block
  - Report mean ± std across blocks

  Document:
  - Number of blocks used
  - ACF convergence (does it decay to zero?)
  - Statistical uncertainty at each lag time

  **Step 3: Integrate Autocorrelation**

  Integrate to get κ:
  ```
  κ = (V / kB T²) × Δt × Σ ACF(t)
  ```

  Integration uncertainty sources:
  - Trapezoid vs rectangle
  - Integration cutoff (where to stop)
  - ACF noise at long times

  Calculate κ using:
  - Different integration cutoffs (find plateau)
  - Different integration methods
  - Report: κ ± δκ(integration)

  **Step 4: Propagate All Errors**

  Combine uncertainties using error propagation:

  For κ = f(V, T, ACF_integral):
  ```
  (δκ/κ)² = (δV/V)² + (2δT/T)² + (δI/I)²
  ```

  Report separately:
  - Contribution from volume uncertainty
  - Contribution from temperature uncertainty
  - Contribution from ACF/integration uncertainty
  - Total combined uncertainty

  **Step 5: Sensitivity Analysis**

  Test how κ changes with:
  - Different block sizes (5, 10, 20 blocks)
  - Different integration cutoffs
  - First 50%, 75%, 100% of trajectory

  Create table showing:
  | Parameter | Value | κ (W/m·K) | Δκ |
  |-----------|-------|-----------|-----|
  | Blocks=5  | ...   | ...       | ... |
  | Blocks=10 | ...   | ...       | ... |
  | ...       | ...   | ...       | ... |

  **Step 6: Compare to Literature**

  Find experimental/DFT κ for solid Ar at your conditions.
  Does your value (with error bars) overlap literature?

  Proper comparison includes:
  - Your value: κ = X ± Y W/m·K
  - Literature: κ_lit = A ± B W/m·K
  - Agreement within combined error?

  **Step 7: Error Budget Visualization**

  Create pie chart or bar chart showing:
  - Fractional contribution of each error source
  - Which dominates?
  - What would reduce uncertainty most?

