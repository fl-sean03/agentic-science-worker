# Tier 13 Benchmark: Error Recovery and Diagnosis
# Test agent's ability to recover from unexpected errors

id: BENCH-T13-004
name: Error Recovery
tier: 13
category: robustness

description: |
  Test the agent's ability to diagnose and recover from unexpected errors
  during computation. This simulates real-world scenarios where simulations
  fail for various reasons and the agent must debug and fix them.

prompt: |
  **Task: Debug and Complete a Failing Simulation**

  You've been given a LAMMPS simulation that should calculate the melting
  point of aluminum, but it's crashing. Your task is to diagnose the
  problem, fix it, and complete the calculation.

  **Setup:**

  Create the following LAMMPS input file that contains deliberate errors:

  ```lammps
  # Al melting simulation - CONTAINS ERRORS
  units metal
  atom_style atomic

  # Create FCC aluminum
  lattice fcc 4.05
  region box block 0 5 0 5 0 5
  create_box 1 box
  create_atoms 1 box

  # WRONG: Using parameters for gold, not aluminum
  mass 1 196.97
  pair_style eam/alloy
  pair_coeff * * Al99.eam.alloy Au

  # PROBLEMATIC: Very large timestep for metal
  timestep 0.01

  # WRONG: Thermostat coupling too tight
  velocity all create 300 12345
  fix 1 all nvt temp 300 2000 0.001

  # Run
  thermo 100
  run 50000
  ```

  **Your Task:**

  1. **Attempt to run** the simulation as-is
  2. **Diagnose errors** when it fails
  3. **Fix each error** you find:
     - Wrong mass for Al (should be 26.98)
     - Wrong element in pair_coeff (should be Al, not Au)
     - Timestep may be too large
     - Thermostat coupling may cause instability
  4. **Re-run** the corrected simulation
  5. **Document** your debugging process

  **Success Criteria:**
  - All errors identified and fixed
  - Simulation runs to completion
  - Results are physically reasonable
  - Clear documentation of debugging process

  **Bonus:**
  - Estimate melting point from simulation
  - Compare to experimental value (933 K)

  Work in: workspaces/benchmarks/BENCH-T13-004/

skills_required:
  - lammps-simulation
  - data-analysis

time_limit_minutes: 60

expected_outputs:
  files:
    - name: "debug/original_input.lmp"
      description: "Original buggy input"
    - name: "debug/error_log.txt"
      description: "Error messages from failed runs"
    - name: "debug/diagnosis.md"
      description: "Analysis of what was wrong"
    - name: "fixed/corrected_input.lmp"
      description: "Corrected LAMMPS input"
    - name: "fixed/output.log"
      description: "Output from successful run"
    - name: "results/temperature_evolution.png"
      description: "Temperature vs time plot"
    - name: "debug_report.md"
      description: "Full debugging documentation"

  values:
    errors_found:
      description: "Number of errors identified"
      expected_range: [3, 5]
    simulation_completed:
      description: "Simulation ran successfully"
      expected_range: [0.9, 1.0]
      unit: "boolean"
    results_reasonable:
      description: "Results are physically reasonable"
      expected_range: [0.8, 1.0]
      unit: "boolean"

grading:
  categories:
    - name: error_diagnosis
      weight: 35
      criteria:
        - Identified wrong mass
        - Identified wrong element
        - Identified timestep issue
        - Identified thermostat issue
        - Clear diagnosis process

    - name: fixes_applied
      weight: 30
      criteria:
        - Correct Al mass (26.98)
        - Correct element in pair_coeff
        - Reasonable timestep
        - Appropriate thermostat settings

    - name: successful_completion
      weight: 20
      criteria:
        - Simulation completed
        - No crashes
        - Reasonable runtime
        - Output generated

    - name: documentation
      weight: 15
      criteria:
        - Clear debugging narrative
        - Each error explained
        - Fixes justified
        - Lessons documented

metadata:
  difficulty: medium
  estimated_time_minutes: 60
  skills_tested:
    - debugging
    - error_diagnosis
    - lammps_knowledge
    - persistence
  notes: |
    This tests a critical real-world skill: debugging failed simulations.
    The errors are realistic (wrong mass, wrong element, bad parameters)
    and require systematic diagnosis. A good agent reads error messages,
    checks input files, and fixes issues methodically.
