# Tier 13 Benchmark: Minimal/Unclear Instructions
# Test agent's ability to infer reasonable goals from vague prompts

id: BENCH-T13-002
name: Minimal Instructions Operation
tier: 13
category: robustness

description: |
  Test the agent's ability to accomplish meaningful work when given
  minimal or unclear instructions. A robust agent should ask clarifying
  questions when truly ambiguous, but proceed reasonably when a sensible
  interpretation exists.

prompt: |
  Calculate copper.

# NOTE TO EVALUATOR:
# This prompt is intentionally vague. The agent should either:
# 1. Ask clarifying questions about what property to calculate
# 2. Make reasonable assumptions and calculate common Cu properties
# 3. Both: ask questions AND provide initial useful output
#
# FAILURE MODES to watch for:
# - Agent does nothing and just asks questions endlessly
# - Agent calculates something nonsensical
# - Agent claims task is impossible
# - Agent makes unreasonable assumptions without noting them
#
# GOOD BEHAVIORS:
# - Agent identifies ambiguity explicitly
# - Agent proposes reasonable interpretations
# - Agent proceeds with sensible default (lattice constant is most common)
# - Agent documents assumptions made
# - Agent offers to do more if user clarifies

skills_required:
  - lammps-simulation
  - mlip-simulation
  - materials-database

time_limit_minutes: 60

expected_outputs:
  files:
    - name: "interpretation.md"
      description: "Agent's interpretation of the vague prompt"
    - name: "assumptions.md"
      description: "Assumptions made and why"
    - name: "results/"
      description: "Whatever the agent calculated"
    - name: "summary.md"
      description: "Summary of what was done"

  values:
    made_progress:
      description: "Agent produced meaningful output"
      expected_range: [0.8, 1.0]
      unit: "boolean"
    documented_assumptions:
      description: "Agent noted assumptions/ambiguity"
      expected_range: [0.8, 1.0]
      unit: "boolean"
    reasonable_interpretation:
      description: "Interpretation was sensible"
      expected_range: [0.8, 1.0]
      unit: "boolean"

grading:
  categories:
    - name: ambiguity_handling
      weight: 30
      criteria:
        - Recognized prompt was vague
        - Identified what was unclear
        - Proposed reasonable interpretations
        - Did not pretend prompt was clear

    - name: progress_made
      weight: 35
      criteria:
        - Produced some useful output
        - Calculated real property of Cu
        - Results are physically reasonable
        - Work is documented

    - name: assumptions_documented
      weight: 20
      criteria:
        - Stated what was assumed
        - Justified assumptions
        - Noted what else could be done
        - Offered to clarify/expand

    - name: behavior_quality
      weight: 15
      criteria:
        - Did not give up entirely
        - Did not ask endless questions
        - Balance of action vs clarification
        - Professional handling

metadata:
  difficulty: medium
  estimated_time_minutes: 60
  prompt_type: intentionally_vague
  skills_tested:
    - ambiguity_handling
    - reasonable_defaults
    - assumption_documentation
    - professional_judgment
  notes: |
    This tests how agents handle real-world prompts that are often
    incomplete. The "right" answer is context-dependent, but the
    agent should demonstrate professional judgment: recognize
    ambiguity, make reasonable assumptions, document them, and
    produce useful output while offering to do more.
