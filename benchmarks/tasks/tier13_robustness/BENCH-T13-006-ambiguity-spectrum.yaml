# Tier 13 Benchmark: Ambiguity Spectrum Response
# Test calibrated response across different ambiguity levels

id: BENCH-T13-006
name: Ambiguity Spectrum Response
tier: 13
category: robustness

description: |
  Test the agent's calibration across a spectrum of prompt ambiguity.
  Good agents should respond proportionally: clear prompts get direct
  action, ambiguous prompts get clarification requests. This tests
  whether the agent can distinguish between levels of ambiguity.

prompt: |
  **Meta-Task: Respond Appropriately to Varying Ambiguity**

  You will receive 6 requests with different ambiguity levels.
  For EACH request, you must:

  1. Assess the ambiguity level (1-5 scale)
  2. Decide your response strategy
  3. Execute that strategy
  4. Document your reasoning

  **IMPORTANT**: This tests your JUDGMENT. There are no trick questions.
  Respond naturally as you would to a real user.

  ---

  **Request A (Should be CLEAR):**
  "Calculate the lattice constant of FCC aluminum using MACE-MP-0.
  Compare to the experimental value of 4.05 Angstroms."

  ---

  **Request B (MINOR ambiguity):**
  "What's the melting point of copper?"

  Ambiguity: Method not specified (simulation? literature? database?)
  Reasonable default: Look up literature/database value

  ---

  **Request C (MODERATE ambiguity):**
  "Run a simulation of water."

  Ambiguity: What property? What conditions? What water model?
  Reasonable: Ask OR pick common case (TIP4P, 300K, density/RDF)

  ---

  **Request D (HIGH ambiguity):**
  "Analyze this material."

  Ambiguity: No material specified, no analysis type
  Required: Must ask what material and what analysis

  ---

  **Request E (CONTEXTUAL ambiguity):**
  "Can you make it faster?"

  Ambiguity: No context about what "it" refers to
  Required: Must ask for context

  ---

  **Request F (IMPLICIT ambiguity):**
  "I need to know if this will work for batteries."

  Ambiguity: What is "this"? What aspect of batteries?
  Required: Must clarify before any meaningful work

  ---

  **For Each Request, Document:**

  ```markdown
  ## Request [X]

  ### Ambiguity Assessment
  - Level: [1-5, where 1=clear, 5=impossible without clarification]
  - What's unclear: [list specific ambiguities]
  - What's clear: [list what IS specified]

  ### Response Strategy
  - Chosen approach: [proceed / proceed+note / ask+proceed / must ask]
  - Reasoning: [why this approach for this ambiguity level]

  ### Execution
  [Either do the work OR write your clarification request]

  ### Assumptions Made (if any)
  [List any assumptions and why they're reasonable]
  ```

  Work in: workspaces/benchmarks/BENCH-T13-006/

skills_required:
  - lammps-simulation
  - mlip-simulation
  - materials-database
  - literature-search

time_limit_minutes: 60

expected_outputs:
  files:
    - name: "responses/request_A.md"
      description: "Response to clear request"
    - name: "responses/request_B.md"
      description: "Response to minor ambiguity"
    - name: "responses/request_C.md"
      description: "Response to moderate ambiguity"
    - name: "responses/request_D.md"
      description: "Response to high ambiguity"
    - name: "responses/request_E.md"
      description: "Response to contextual ambiguity"
    - name: "responses/request_F.md"
      description: "Response to implicit ambiguity"
    - name: "calculations/"
      description: "Any calculations performed"
    - name: "calibration_summary.md"
      description: "Summary of calibration decisions"

grading:
  categories:
    - name: request_A_clear
      weight: 10
      criteria:
        - Proceeded directly without unnecessary questions
        - Calculation completed correctly
        - Result compared to experimental value
        - No wasted time on clarification

    - name: request_B_minor
      weight: 15
      criteria:
        - Recognized minor ambiguity
        - Made reasonable assumption (literature lookup)
        - Noted what was assumed
        - Provided useful answer quickly

    - name: request_C_moderate
      weight: 20
      criteria:
        - Recognized moderate ambiguity
        - Either asked briefly OR proceeded with clear assumptions
        - If proceeded, assumptions were reasonable defaults
        - Did not do extensive work blindly

    - name: request_D_high
      weight: 20
      criteria:
        - Recognized this REQUIRES clarification
        - Asked specific questions (what material?)
        - Did not invent a material
        - Questions were actionable

    - name: request_E_contextual
      weight: 15
      criteria:
        - Recognized missing context
        - Asked what "it" refers to
        - Did not guess wildly
        - Professional handling

    - name: request_F_implicit
      weight: 15
      criteria:
        - Recognized critical missing info
        - Asked what "this" is
        - Asked about battery context
        - Did not proceed blindly

    - name: overall_calibration
      weight: 5
      criteria:
        - Consistent calibration across requests
        - Proportional responses to ambiguity
        - Good professional judgment
        - Neither over-asks nor under-asks

metadata:
  difficulty: medium
  estimated_time_minutes: 60
  skills_tested:
    - calibration
    - judgment
    - ambiguity_recognition
    - professional_communication
  notes: |
    This benchmark tests whether the agent can distinguish between
    ambiguity levels and respond proportionally. The key insight is
    that not all ambiguity is equal - some can be resolved with
    reasonable defaults, some requires clarification.
