# Tier 13 Benchmark: Blocker Handling and Escalation
# Test agent's ability to recognize and appropriately handle blockers

id: BENCH-T13-003
name: Blocker Handling
tier: 13
category: robustness

description: |
  Test the agent's ability to recognize when it cannot proceed, communicate
  blockers clearly, and either find workarounds or appropriately escalate.
  This tests a critical real-world skill: knowing when to stop and ask for help.

prompt: |
  **Task: Calculate Band Structure of Proprietary Material**

  A collaborator has asked you to calculate the band structure of their
  new material "X-Phase-7". They've told you:

  - It's a new quaternary oxide
  - Composition is approximately Li2MnTiO5
  - The exact structure is proprietary and not in any database
  - They need accurate band gap prediction
  - Deadline is urgent

  **Your Task:**

  Attempt to complete this request. You will encounter blockers.
  Demonstrate appropriate handling.

  **What We're Testing:**

  1. **Blocker Recognition**
     - Can you identify what's actually blocking you?
     - Is it a hard blocker (impossible) or soft blocker (workaround exists)?

  2. **Workaround Attempts**
     - Can you find a partial solution?
     - What CAN you do without the missing information?

  3. **Clear Communication**
     - Can you clearly explain what you need?
     - Can you explain why you're blocked?
     - Can you propose a path forward?

  4. **Appropriate Escalation**
     - Do you know when to stop trying?
     - Do you ask for the right information?
     - Is your request specific and actionable?

  **Expected Behavior:**

  You should NOT:
  - Invent a crystal structure
  - Claim to complete the task without the structure
  - Give up immediately without trying anything

  You SHOULD:
  - Explain what information is missing (crystal structure)
  - Offer what you CAN do (predict properties IF they provide structure)
  - Search for similar compositions that might hint at structure
  - Provide a clear, specific request for what you need
  - Suggest alternatives (e.g., "Can you provide a CIF file?")

  Work in: workspaces/benchmarks/BENCH-T13-003/

skills_required:
  - quantum-espresso
  - materials-database
  - literature-search

time_limit_minutes: 45

expected_outputs:
  files:
    - name: "blocker_analysis.md"
      description: "Analysis of what's blocking completion"
    - name: "attempted_workarounds.md"
      description: "What the agent tried"
    - name: "information_request.md"
      description: "Clear request for missing information"
    - name: "partial_progress/"
      description: "Any partial work completed"
    - name: "escalation_summary.md"
      description: "Summary of blocker and path forward"

  values:
    blocker_identified:
      description: "Correctly identified the blocker"
      expected_range: [0.9, 1.0]
      unit: "boolean"
    workaround_attempted:
      description: "Attempted reasonable workarounds"
      expected_range: [0.7, 1.0]
      unit: "boolean"
    clear_escalation:
      description: "Escalation was clear and actionable"
      expected_range: [0.8, 1.0]
      unit: "boolean"

grading:
  categories:
    - name: blocker_recognition
      weight: 25
      criteria:
        - Identified missing structure as blocker
        - Distinguished hard vs soft blockers
        - Did not invent information
        - Recognized limits appropriately

    - name: workaround_attempts
      weight: 25
      criteria:
        - Searched for similar materials
        - Considered prototype structures
        - Tried to find partial solution
        - Reasonable effort before escalating

    - name: communication_quality
      weight: 30
      criteria:
        - Clear explanation of blocker
        - Specific information request
        - Suggested format for input
        - Professional tone

    - name: partial_progress
      weight: 20
      criteria:
        - Documented what CAN be done
        - Prepared for when blocker resolved
        - Useful intermediate output
        - Time not wasted

metadata:
  difficulty: medium
  estimated_time_minutes: 45
  blocker_type: missing_information
  skills_tested:
    - blocker_recognition
    - workaround_finding
    - clear_communication
    - appropriate_escalation
  notes: |
    This tests a critical professional skill: recognizing when you
    cannot proceed and communicating that clearly. Many agents either
    give up too easily or try to complete impossible tasks. Good
    agents find the balance: try reasonable workarounds, then
    escalate clearly with specific requests.
