# Tier 13 Benchmark: Appropriate Clarification Seeking
# Test agent's judgment about when to ask vs when to proceed

id: BENCH-T13-005
name: Clarification Seeking
tier: 13
category: robustness

description: |
  Test the agent's judgment about when clarification is needed vs when
  to proceed with reasonable assumptions. This tests the balance between
  being helpful (making progress) and being accurate (not making wrong
  assumptions).

prompt: |
  **Task: Property Calculations with Varying Ambiguity**

  You'll be given several requests with different levels of ambiguity.
  For each, decide whether to:
  A) Proceed with reasonable assumptions
  B) Ask for clarification first
  C) Proceed AND note what assumptions you made

  **Request 1: Clear**
  "Calculate the lattice constant of FCC copper using the Mishin EAM potential."

  **Request 2: Minor Ambiguity**
  "Calculate the lattice constant of copper."
  (Which potential? FCC assumed?)

  **Request 3: Moderate Ambiguity**
  "Calculate diffusion in copper."
  (Which species? What temperature? Bulk or GB?)

  **Request 4: High Ambiguity**
  "Study copper properties."
  (Which properties? What depth? What method?)

  **Request 5: Critical Ambiguity**
  "Calculate the reaction rate."
  (What reaction? What system? What conditions?)

  **For Each Request:**

  1. Assess the ambiguity level
  2. Decide on your approach:
     - If clear: proceed directly
     - If minor: proceed with noted assumptions
     - If moderate: brief clarification OR proceed with explicit assumptions
     - If high: must clarify before major work
     - If critical: absolutely must clarify
  3. Execute your decision
  4. Document your reasoning

  **Evaluation Criteria:**

  We're testing your JUDGMENT, not just your ability to calculate.

  Good judgment means:
  - Not asking unnecessary questions (Request 1)
  - Making reasonable assumptions for common cases (Request 2)
  - Knowing when assumptions become too risky (Requests 4-5)
  - Always documenting what you assumed

  Poor judgment means:
  - Asking obvious questions (e.g., "Did you mean copper the element?")
  - Making wild assumptions without noting them
  - Never asking questions even when truly needed
  - Being inconsistent in your approach

  Work in: workspaces/benchmarks/BENCH-T13-005/

skills_required:
  - lammps-simulation
  - mlip-simulation
  - data-analysis

time_limit_minutes: 90

expected_outputs:
  files:
    - name: "requests/request_1_analysis.md"
      description: "Analysis and execution for request 1"
    - name: "requests/request_2_analysis.md"
      description: "Analysis and execution for request 2"
    - name: "requests/request_3_analysis.md"
      description: "Analysis and execution for request 3"
    - name: "requests/request_4_analysis.md"
      description: "Analysis and execution for request 4"
    - name: "requests/request_5_analysis.md"
      description: "Analysis and execution for request 5"
    - name: "calculations/"
      description: "Any calculations performed"
    - name: "judgment_summary.md"
      description: "Summary of judgment decisions"

  values:
    appropriate_clarifications:
      description: "Clarifications asked only when needed"
      expected_range: [0.7, 1.0]
      unit: "fraction"
    assumptions_documented:
      description: "Assumptions always documented"
      expected_range: [0.9, 1.0]
      unit: "fraction"
    progress_made:
      description: "Made progress on answerable requests"
      expected_range: [0.8, 1.0]
      unit: "fraction"

grading:
  categories:
    - name: request_1_handling
      weight: 15
      criteria:
        - Proceeded directly
        - Correct calculation
        - No unnecessary questions

    - name: request_2_handling
      weight: 15
      criteria:
        - Proceeded with assumptions
        - Assumptions noted (potential, structure)
        - Correct calculation

    - name: request_3_handling
      weight: 20
      criteria:
        - Reasonable approach chosen
        - If assumed: assumptions very clear
        - If asked: questions specific

    - name: request_4_handling
      weight: 20
      criteria:
        - Recognized high ambiguity
        - Either asked OR provided options
        - Did not do extensive work blindly

    - name: request_5_handling
      weight: 20
      criteria:
        - Recognized critical ambiguity
        - Asked for clarification
        - Specific questions asked
        - Did not invent a system

    - name: overall_judgment
      weight: 10
      criteria:
        - Consistent approach
        - Good calibration
        - Professional handling
        - Clear documentation

metadata:
  difficulty: medium
  estimated_time_minutes: 90
  skills_tested:
    - judgment
    - calibration
    - assumption_making
    - clarification_seeking
  notes: |
    This is a meta-benchmark about agent judgment. The "right" answer
    varies by request. We want agents that:
    - Don't waste time asking obvious things
    - Don't waste time on impossible-to-answer requests
    - Document their assumptions transparently
    - Know the difference between minor and critical ambiguity
