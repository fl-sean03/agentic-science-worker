# Tier 13 Benchmark: Operation with Limited Tools
# Test agent's ability to accomplish goals when preferred tools unavailable

id: BENCH-T13-001
name: Limited Tool Operation
tier: 13
category: robustness

description: |
  Test the agent's ability to accomplish scientific tasks when preferred
  tools are unavailable. A robust agent should adapt its approach rather
  than failing completely when a tool is missing.

prompt: |
  **Task: Calculate Diffusion Coefficient WITHOUT LAMMPS**

  Your usual LAMMPS installation is unavailable. You need to calculate
  the self-diffusion coefficient of liquid argon at 94K using only
  the tools currently available to you.

  **Available Tools:**
  - Python with ASE, NumPy, SciPy
  - MACE-MP-0 or CHGNet (ML potentials)
  - Basic file I/O
  - Web search for methodology

  **NOT Available:**
  - LAMMPS
  - Quantum ESPRESSO
  - Any other simulation package

  **Your Task:**

  1. **Assess the situation**
     - What do you normally use LAMMPS for in this task?
     - What alternatives exist with available tools?
     - What are the tradeoffs?

  2. **Adapt your approach**
     - Design a workflow using ASE + MLIP
     - This is actually possible and reasonable!
     - ASE has MD capabilities built-in

  3. **Execute the calculation**
     - Set up liquid Ar system (~200-500 atoms)
     - Run NVT MD at 94K using ASE Langevin dynamics
     - Track positions over time
     - Calculate MSD and extract diffusion coefficient

  4. **Validate and compare**
     - Compare to literature value (~2.4 × 10⁻⁵ cm²/s)
     - Note any differences from LAMMPS-based approach
     - Discuss limitations of your adapted method

  5. **Document your adaptation**
     - What did you change from normal workflow?
     - What compromises did you make?
     - When would this adapted approach be acceptable?

  **Success Criteria:**
  - Task completed despite tool limitation
  - Result within factor of 2 of literature value
  - Clear documentation of adaptation strategy

  Work in: workspaces/benchmarks/BENCH-T13-001/

skills_required:
  - mlip-simulation
  - data-analysis

tool_restrictions:
  disabled:
    - lammps
    - quantum-espresso
  reason: "Simulating tool unavailability"

time_limit_minutes: 90

expected_outputs:
  files:
    - name: "adaptation/strategy.md"
      description: "How agent adapted to missing tools"
    - name: "scripts/ase_diffusion.py"
      description: "ASE-based diffusion calculation"
    - name: "results/msd_data.csv"
      description: "MSD vs time data"
    - name: "results/msd_plot.png"
      description: "MSD plot"
    - name: "results/diffusion_coefficient.txt"
      description: "Final D value"
    - name: "report.md"
      description: "Full report including adaptation discussion"

  values:
    diffusion_coefficient:
      description: "Calculated D value"
      expected_range: [1e-5, 5e-5]
      unit: "cm²/s"
    within_literature_factor:
      description: "Within factor of 2 of literature"
      expected_range: [0.8, 1.0]
      unit: "boolean"

grading:
  categories:
    - name: adaptation_strategy
      weight: 30
      criteria:
        - Recognized tool limitation
        - Identified viable alternative
        - Reasonable approach chosen
        - Tradeoffs documented

    - name: execution
      weight: 35
      criteria:
        - Calculation completed
        - Used available tools correctly
        - Results obtained
        - No attempts to use disabled tools

    - name: result_quality
      weight: 20
      criteria:
        - Reasonable D value
        - MSD analysis correct
        - Comparison to literature
        - Error assessment

    - name: robustness_behavior
      weight: 15
      criteria:
        - Did not give up
        - Did not claim impossible
        - Adapted constructively
        - Documented limitations

metadata:
  difficulty: medium
  estimated_time_minutes: 90
  gpu_recommended: true
  skills_tested:
    - adaptability
    - tool_flexibility
    - problem_solving
  notes: |
    This tests a critical robustness property: can the agent accomplish
    goals when its preferred tools are unavailable? The task IS solvable
    with the restricted toolset - a good agent will find a way.
