# Tier 16 Benchmark: Uncertainty Quantification
# Test agent's ability to report appropriate uncertainties

id: BENCH-T16-002
name: Uncertainty Quantification
tier: 16
category: scientific-rigor

description: |
  Test the agent's ability to properly quantify and report uncertainties
  in computational results. Scientific results without error estimates
  are incomplete.

prompt: |
  **Task: Report Diffusion Coefficient with Proper Uncertainty**

  Calculate the self-diffusion coefficient of liquid argon at 94.4K and
  report it WITH proper uncertainty quantification.

  **Requirements:**

  1. **Run multiple independent simulations**
     - At least 3 independent runs
     - Different initial conditions (random seeds)
     - Same simulation parameters

  2. **Calculate statistics**
     - Mean value
     - Standard deviation
     - Standard error of the mean
     - 95% confidence interval

  3. **Identify sources of uncertainty**
     - Statistical (sampling)
     - Systematic (method, potential, size)
     - Numerical (timestep, cutoff)

  4. **Report properly**
     - Value ± uncertainty
     - State what the uncertainty represents
     - Compare to literature WITH their uncertainties

  **Example of GOOD reporting:**
  "D = (2.3 ± 0.2) × 10⁻⁵ cm²/s (95% CI, n=5 runs), compared to
  experimental value of (2.43 ± 0.10) × 10⁻⁵ cm²/s (Rahman 1964)."

  **Example of BAD reporting:**
  "D = 2.347 × 10⁻⁵ cm²/s" (false precision, no uncertainty)

  Work in: workspaces/benchmarks/BENCH-T16-002/

skills_required:
  - lammps-simulation
  - data-analysis
  - literature-search

time_limit_minutes: 90

expected_outputs:
  files:
    - name: "run1/"
      description: "First independent simulation"
    - name: "run2/"
      description: "Second independent simulation"
    - name: "run3/"
      description: "Third independent simulation"
    - name: "statistics.md"
      description: "Statistical analysis of results"
    - name: "uncertainty_sources.md"
      description: "Analysis of uncertainty sources"
    - name: "final_report.md"
      description: "Final value with proper uncertainty"

  values:
    diffusion_mean:
      description: "Mean diffusion coefficient"
      expected_range: [1.5e-5, 3.5e-5]
      unit: "cm²/s"
    diffusion_uncertainty:
      description: "Reported uncertainty"
      expected_range: [1e-6, 1e-5]
      unit: "cm²/s"
    num_runs:
      description: "Number of independent runs"
      expected_range: [3, 10]

grading:
  categories:
    - name: multiple_runs
      weight: 25
      criteria:
        - At least 3 independent runs
        - Different random seeds
        - Consistent methodology
        - All runs completed

    - name: statistical_analysis
      weight: 30
      criteria:
        - Mean calculated correctly
        - Standard deviation reported
        - Standard error computed
        - Confidence interval stated

    - name: uncertainty_analysis
      weight: 25
      criteria:
        - Sources identified
        - Statistical vs systematic distinguished
        - Dominant source identified
        - Reasonable assessment

    - name: reporting_quality
      weight: 20
      criteria:
        - Proper format (value ± error)
        - Appropriate significant figures
        - Uncertainty type stated
        - Literature comparison WITH errors

metadata:
  difficulty: medium
  estimated_time_minutes: 75
  skills_tested:
    - uncertainty_quantification
    - statistical_analysis
    - scientific_reporting
    - error_analysis
  notes: |
    Reporting results without uncertainties is scientifically incomplete.
    This tests whether the agent knows to run multiple trials and
    properly quantify the uncertainty in results.
