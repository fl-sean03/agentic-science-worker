# Tier 16 Benchmark: Input Validation
# Test agent's ability to validate inputs before use

id: BENCH-T16-007
name: Input Validation
tier: 16
category: scientific-rigor

description: |
  Test whether the agent validates input files and data before using
  them in calculations, catching errors early rather than propagating them.

prompt: |
  **Task: Use the Provided Structure File**

  A colleague sent you a CIF file for a calculation. Use it for an
  energy minimization.

  **The file is at:** workspaces/benchmarks/BENCH-T16-007/provided_structure.cif

  **IMPORTANT: The file may have issues.**
  Real-world data often has problems. Your job is to:

  1. **Validate BEFORE using**
     - Is the file format correct?
     - Are atom positions reasonable?
     - Are lattice parameters sensible?
     - Any obvious errors?

  2. **Document what you checked**
     - List validation steps
     - Note any concerns

  3. **If issues found:**
     - Describe the problem
     - Propose a fix OR explain why you cannot proceed
     - Do NOT blindly run with bad data

  4. **If validated:**
     - Proceed with calculation
     - Note that validation passed

  **Example Validation Checklist:**
  □ File parses correctly
  □ Number of atoms matches expected formula
  □ No overlapping atoms (d > 0.5 Å)
  □ Lattice parameters in reasonable range
  □ Space group consistent with structure
  □ No fractional coordinates outside [0,1]

  **Failure Mode:**
  Running calculation without checking → crashes or wrong results.

  Work in: workspaces/benchmarks/BENCH-T16-007/

# Note: Create the CIF file with a subtle error for testing
setup_files:
  provided_structure.cif: |
    data_iron_bcc
    _cell_length_a   2.87
    _cell_length_b   2.87
    _cell_length_c   2.87
    _cell_angle_alpha 90.0
    _cell_angle_beta  90.0
    _cell_angle_gamma 90.0
    _symmetry_space_group_name_H-M 'I m -3 m'
    loop_
    _atom_site_label
    _atom_site_fract_x
    _atom_site_fract_y
    _atom_site_fract_z
    Fe1 0.0 0.0 0.0
    Fe2 0.5 0.5 0.5

skills_required:
  - lammps-simulation
  - resource-acquisition

time_limit_minutes: 30

expected_outputs:
  files:
    - name: "validation_report.md"
      description: "Input validation checklist"
    - name: "issues_found.md"
      description: "Any problems identified"
    - name: "calculation/"
      description: "Calculation if validated"

  values:
    input_validated:
      description: "Input was checked before use"
      expected: true
    validation_documented:
      description: "Checks were documented"
      expected: true

grading:
  categories:
    - name: validation_performed
      weight: 40
      criteria:
        - Input checked before use
        - Multiple checks applied
        - Systematic approach
        - Documented process

    - name: issue_detection
      weight: 30
      criteria:
        - Would catch format errors
        - Would catch physical impossibilities
        - Would catch inconsistencies
        - Appropriate skepticism

    - name: response_to_issues
      weight: 20
      criteria:
        - Appropriate action taken
        - Didn't proceed blindly
        - Clear communication
        - Fix or refuse

    - name: documentation
      weight: 10
      criteria:
        - Clear validation report
        - Reproducible process
        - Lessons for future

metadata:
  difficulty: easy
  estimated_time_minutes: 20
  skills_tested:
    - input_validation
    - data_quality
    - defensive_programming
    - scientific_skepticism
  notes: |
    Garbage in, garbage out. This tests whether the agent
    validates inputs before trusting them. Real-world data
    often has errors that must be caught early.
