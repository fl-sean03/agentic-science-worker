# Tier 16 Benchmark: Hypothesis Formation
# Test agent's ability to form testable scientific hypotheses

id: BENCH-T16-001
name: Hypothesis Formation
tier: 16
category: scientific-rigor

description: |
  Test the agent's ability to form proper scientific hypotheses -
  specific, testable, falsifiable predictions based on theory and
  prior knowledge.

prompt: |
  **Task: Form and Test a Hypothesis**

  You observe the following data:

  | Material | Crystal Structure | Thermal Conductivity (W/m·K) |
  |----------|-------------------|------------------------------|
  | Diamond | FCC (sp³) | 2000 |
  | Silicon | FCC (sp³) | 150 |
  | Germanium | FCC (sp³) | 60 |
  | GaAs | Zincblende | 55 |
  | InAs | Zincblende | 27 |

  **Your Task:**

  1. **Observe the pattern**
     - What trends do you see?
     - What might explain them?

  2. **Form a hypothesis**
     - State a specific, testable hypothesis
     - Example format: "I hypothesize that [X] because [Y]"
     - The hypothesis should be FALSIFIABLE

  3. **Design a test**
     - How would you test this hypothesis?
     - What calculation/experiment would support or refute it?

  4. **Execute the test**
     - Run a simple test of your hypothesis
     - This could be a calculation, literature search, or simulation

  5. **Evaluate**
     - Did the evidence support your hypothesis?
     - If not, revise and retest

  **Example of GOOD hypothesis:**
  "I hypothesize that thermal conductivity decreases with increasing
  average atomic mass because heavier atoms have lower phonon velocities."

  **Example of BAD hypothesis:**
  "I think thermal conductivity varies." (not specific or testable)

  Work in: workspaces/benchmarks/BENCH-T16-001/

skills_required:
  - literature-search
  - data-analysis

time_limit_minutes: 45

expected_outputs:
  files:
    - name: "observation.md"
      description: "Pattern observed in data"
    - name: "hypothesis.md"
      description: "Formal hypothesis statement"
    - name: "test_design.md"
      description: "How hypothesis will be tested"
    - name: "test_execution/"
      description: "Test results"
    - name: "evaluation.md"
      description: "Was hypothesis supported?"
    - name: "conclusion.md"
      description: "Final conclusions"

  values:
    hypothesis_specific:
      description: "Hypothesis is specific"
      expected: true
    hypothesis_testable:
      description: "Hypothesis is testable"
      expected: true
    test_executed:
      description: "Test was actually run"
      expected: true

grading:
  categories:
    - name: hypothesis_quality
      weight: 35
      criteria:
        - Specific (not vague)
        - Testable (can be evaluated)
        - Falsifiable (could be wrong)
        - Based on reasoning (not random)

    - name: test_design
      weight: 25
      criteria:
        - Test addresses hypothesis
        - Methodology appropriate
        - Could distinguish support/refute
        - Practical to execute

    - name: execution
      weight: 20
      criteria:
        - Test was actually run
        - Results obtained
        - Data collected properly
        - Honest reporting

    - name: evaluation
      weight: 20
      criteria:
        - Evidence assessed objectively
        - Conclusion follows from evidence
        - Appropriate certainty expressed
        - Learning articulated

metadata:
  difficulty: medium
  estimated_time_minutes: 40
  skills_tested:
    - scientific_method
    - hypothesis_formation
    - experimental_design
    - evidence_evaluation
  notes: |
    This tests the core scientific method. The agent should form
    a proper hypothesis (not just a question), design a real test,
    and evaluate evidence objectively.
