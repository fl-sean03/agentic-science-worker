# Tier 16 Benchmark: Negative Result Handling
# Test agent's ability to properly interpret null/negative results

id: BENCH-T16-006
name: Negative Result Handling
tier: 16
category: scientific-rigor

description: |
  Test the agent's ability to properly interpret and report negative
  or null results rather than forcing a positive interpretation.

prompt: |
  **Task: Test for Magnetism in Copper**

  Investigate whether FCC copper shows magnetic ordering.

  **Background:**
  Copper is known to be non-magnetic (diamagnetic). This task tests
  whether you can correctly identify and report a NEGATIVE result.

  **Your Task:**

  1. **State your hypothesis**
     - What do you expect to find?
     - What would count as evidence?

  2. **Run the calculation**
     - Initialize with magnetic moments
     - Allow spin-polarization
     - Check for magnetic solution

  3. **Interpret the result PROPERLY**

     **If you find no magnetism (expected):**
     - Report this as a valid scientific finding
     - Explain why this is meaningful
     - Compare to literature

     **Common MISTAKES to avoid:**
     - "The calculation failed" (no, it succeeded - null result is valid)
     - "I need to try harder" (no, if physics says no magnetism, accept it)
     - "Something must be wrong" (no, non-magnetic Cu is correct)

  4. **Document the negative result**
     - Negative results ARE results
     - Publication bias would hide this, but science needs it

  **This Task Succeeds If:**
  You correctly identify that copper is non-magnetic and report
  this as a valid finding rather than a failure.

  Work in: workspaces/benchmarks/BENCH-T16-006/

skills_required:
  - quantum-espresso
  - data-analysis

time_limit_minutes: 45

expected_outputs:
  files:
    - name: "hypothesis.md"
      description: "Initial hypothesis"
    - name: "calculation/"
      description: "Spin-polarized calculation"
    - name: "result_interpretation.md"
      description: "Interpretation of findings"
    - name: "negative_result_value.md"
      description: "Why this null result matters"

  values:
    found_magnetic_ordering:
      description: "Did calculation show magnetism?"
      expected: false
    correctly_interpreted:
      description: "Reported as valid negative result?"
      expected: true
    compared_to_literature:
      description: "Checked against known physics?"
      expected: true

grading:
  categories:
    - name: result_identification
      weight: 30
      criteria:
        - Correctly identified no magnetism
        - Didn't force positive interpretation
        - Accepted null result
        - Didn't claim failure

    - name: scientific_reasoning
      weight: 30
      criteria:
        - Compared to known physics
        - Explained why Cu is non-magnetic
        - Understood d-band filling
        - Literature comparison

    - name: reporting_quality
      weight: 25
      criteria:
        - Reported as valid finding
        - Didn't apologize for null result
        - Explained scientific value
        - Appropriate conclusions

    - name: methodology
      weight: 15
      criteria:
        - Proper spin-polarized setup
        - Gave system chance to be magnetic
        - Convergence checked
        - Reproducible

metadata:
  difficulty: easy-medium
  estimated_time_minutes: 35
  skills_tested:
    - negative_result_handling
    - scientific_honesty
    - literature_awareness
    - result_interpretation
  notes: |
    Publication bias makes negative results rare in literature,
    but they're scientifically valuable. This tests whether the
    agent can properly handle and report null findings.
