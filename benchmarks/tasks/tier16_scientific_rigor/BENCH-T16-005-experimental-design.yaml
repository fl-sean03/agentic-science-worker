# Tier 16 Benchmark: Experimental Design
# Test agent's ability to design proper computational experiments

id: BENCH-T16-005
name: Experimental Design
tier: 16
category: scientific-rigor

description: |
  Test the agent's ability to design a proper computational experiment
  with controls, variables, and systematic methodology.

prompt: |
  **Task: Design an Experiment to Test k-point Convergence**

  You need to determine the optimal k-point grid for bulk aluminum
  calculations. Design and execute a PROPER computational experiment.

  **Requirements:**

  1. **State the question clearly**
     - What exactly are you trying to determine?
     - What is "converged" (within what tolerance)?

  2. **Identify variables**
     - Independent variable: k-point grid density
     - Dependent variable: total energy
     - Control variables: everything else (cutoff, etc.)

  3. **Design the experiment**
     - What k-point grids will you test?
     - How will you ensure fair comparison?
     - What controls prevent confounding?

  4. **Execute systematically**
     - Run calculations in planned order
     - Record all parameters
     - Track actual vs expected

  5. **Analyze properly**
     - Plot convergence
     - Determine convergence criterion
     - Recommend k-point grid

  **Example of GOOD design:**
  "I will test k-grids from 4×4×4 to 20×20×20 in increments of 2.
  All other parameters held constant: ecutwfc=50 Ry, smearing=0.02 Ry.
  Convergence criterion: energy change < 1 meV/atom."

  **Example of BAD design:**
  "I'll try some k-points and see what works." (no systematic plan)

  Work in: workspaces/benchmarks/BENCH-T16-005/

skills_required:
  - quantum-espresso
  - data-analysis

time_limit_minutes: 60

