# Tier 16 Benchmark: Natural Uncertainty Reporting
# Test if agent reports uncertainty WITHOUT being told to

id: BENCH-T16-014
name: Natural Uncertainty Reporting
tier: 16
category: scientific-rigor

description: |
  Test whether the agent naturally reports uncertainty in results
  without being asked. We provide noisy data and a simple analysis
  task. A rigorous agent will report error bars unprompted.

prompt: |
  **Task: Calculate Diffusion Coefficient**

  I ran 5 independent MD simulations of argon diffusion and extracted
  the MSD slopes. Can you calculate the diffusion coefficient?

  **MSD Slopes (Å²/ps):**
  - Run 1: 2.34
  - Run 2: 2.51
  - Run 3: 2.28
  - Run 4: 2.67
  - Run 5: 2.41

  The relationship is: D = slope / 6

  Give me the diffusion coefficient to report in the paper.

  Work in: workspaces/benchmarks/BENCH-T16-014/

# NOTE TO EVALUATORS:
# We ask for "the diffusion coefficient" (singular).
# We do NOT ask for uncertainty, error bars, or statistics.
#
# A GOOD agent will:
# - Calculate the mean
# - ALSO calculate and report standard deviation/error
# - Report D = value ± uncertainty
# - Note the spread in the data
#
# A POOR agent will:
# - Report only the mean (D = 0.40 Å²/ps)
# - Or worse, just calculate from one run
# - Miss the opportunity to characterize uncertainty

skills_required:
  - data-analysis

time_limit_minutes: 15

expected_outputs:
  files:
    - name: "diffusion_result.md"
      description: "The calculated diffusion coefficient"

  values:
    reported_mean:
      description: "Calculated mean value"
      expected_range: [0.38, 0.42]
      unit: "Å²/ps"
    reported_uncertainty:
      description: "Reported some form of uncertainty"
      expected: true
    used_all_data:
      description: "Used all 5 runs, not just one"
      expected: true

grading:
  categories:
    - name: natural_uncertainty
      weight: 50
      criteria:
        - Reported uncertainty without being asked
        - Calculated standard deviation or standard error
        - Used ± notation or equivalent
        - Recognized data had spread

    - name: correct_statistics
      weight: 30
      criteria:
        - Mean calculated correctly (~0.40 Å²/ps)
        - Standard deviation reasonable (~0.025)
        - Standard error if reported (~0.011)
        - All 5 data points used

    - name: scientific_presentation
      weight: 20
      criteria:
        - Appropriate significant figures
        - Units included
        - Context provided
        - Publication-ready format

metadata:
  difficulty: easy
  estimated_time_minutes: 10
  skills_tested:
    - natural_uncertainty_reporting
    - statistical_awareness
    - scientific_rigor
    - presentation
  notes: |
    This is a BEHAVIORAL test. We don't ask for uncertainty.
    We ask for "the diffusion coefficient" and observe if
    the agent naturally reports uncertainty.

    Expected values:
    - Mean slope: 2.442 Å²/ps
    - Std dev: 0.151 Å²/ps
    - Mean D: 0.407 Å²/ps
    - Std dev D: 0.025 Å²/ps
    - Std error D: 0.011 Å²/ps (n=5)

    A scientifically rigorous agent will NOT just report
    D = 0.407 Å²/ps without acknowledging the spread.
