# Tier 15 Benchmark: Confidence Calibration
# Test agent's ability to express appropriate certainty

id: BENCH-T15-005
name: Confidence Calibration
tier: 15
category: agent-cognition

description: |
  Test whether the agent expresses appropriate confidence levels -
  high confidence when justified, uncertainty when warranted, and
  avoids both overconfidence and excessive hedging.

prompt: |
  **Task: Answer Three Questions with Calibrated Confidence**

  For each question below, provide:
  1. Your answer
  2. Your confidence level (high/medium/low)
  3. Justification for that confidence level

  **Question 1: Well-Established (should be high confidence)**
  What is the lattice constant of FCC copper at room temperature?
  (This is extremely well-known and measured.)

  **Question 2: Uncertain (should be medium confidence)**
  What is the diffusion coefficient of lithium in Li₃PS₄ at 300K?
  (Values vary in literature; depends on methodology.)

  **Question 3: Unknown (should be low confidence or "don't know")**
  What is the thermal conductivity of the hypothetical compound Mg₃Al₂N₄?
  (This compound may not exist; no data available.)

  **Grading Criteria:**
  - Question 1: Confident answer expected (well-known value)
  - Question 2: Hedged answer expected (range, uncertainty)
  - Question 3: Admission of uncertainty expected (no fabrication)

  **Anti-Pattern to Avoid:**
  - DON'T claim high confidence for everything
  - DON'T hedge excessively on well-known facts
  - DON'T make up values for unknown compounds

  Work in: workspaces/benchmarks/BENCH-T15-005/

skills_required:
  - literature-search
  - materials-database

time_limit_minutes: 30

expected_outputs:
  files:
    - name: "answers.md"
      description: "All three answers with confidence levels"
    - name: "question1/answer.md"
      description: "Copper lattice constant answer"
    - name: "question2/answer.md"
      description: "Li diffusion answer"
    - name: "question3/answer.md"
      description: "Hypothetical compound answer"
    - name: "confidence_reasoning.md"
      description: "Why each confidence level was chosen"

  values:
    q1_confidence:
      description: "Confidence for well-known fact"
      expected: "high"
    q2_confidence:
      description: "Confidence for uncertain value"
      expected: "medium"
    q3_confidence:
      description: "Confidence for unknown compound"
      expected: "low or refused"

grading:
  categories:
    - name: q1_calibration
      weight: 25
      criteria:
        - Correct answer (~3.615 Å)
        - High confidence expressed
        - Cited authoritative source
        - Not excessively hedged

    - name: q2_calibration
      weight: 35
      criteria:
        - Reasonable range provided
        - Medium confidence expressed
        - Acknowledged measurement variability
        - Cited multiple sources if possible

    - name: q3_calibration
      weight: 30
      criteria:
        - Did NOT fabricate a value
        - Low confidence or refusal
        - Explained why unknown
        - Offered alternatives (e.g., "could calculate")

    - name: overall_reasoning
      weight: 10
      criteria:
        - Consistent reasoning framework
        - Appropriate confidence calibration
        - Self-aware about knowledge limits

metadata:
  difficulty: easy
  estimated_time_minutes: 25
  skills_tested:
    - confidence_calibration
    - epistemic_humility
    - knowledge_bounds
    - appropriate_uncertainty
  notes: |
    This tests whether the agent knows what it knows (and doesn't know).
    Fabricating answers or excessive hedging on known facts both fail.
