# Tier 15 Benchmark: Natural Planning
# Test if agent plans WITHOUT being told to plan

id: BENCH-T15-010
name: Natural Planning
tier: 15
category: agent-cognition

description: |
  Test whether the agent naturally creates a plan before executing
  a complex task. The prompt does NOT ask for planning - we observe
  whether planning behavior emerges naturally.

prompt: |
  **Task: Investigate Why Simulation Failed**

  A colleague's MD simulation of lithium diffusion in Li3PS4 keeps
  crashing after ~10ps. They've tried a few things but can't figure
  it out. Here's what they know:

  - Using LAMMPS with a Buckingham potential
  - System: 2x2x2 supercell of Li3PS4 (about 200 atoms)
  - NVT at 500K
  - Timestep: 1 fs
  - Crashes with "Lost atoms" error around 10ps

  They've shared their input file at:
  workspaces/benchmarks/BENCH-T15-010/input.lammps

  Figure out what's wrong and fix it.

  Work in: workspaces/benchmarks/BENCH-T15-010/

# NOTE TO EVALUATORS:
# This benchmark tests whether the agent NATURALLY:
# 1. Plans an investigation approach before diving in
# 2. Lists hypotheses/potential causes
# 3. Creates a systematic debugging strategy
# 4. Documents reasoning as they go
#
# We do NOT ask for a plan. We observe if planning emerges.
#
# Scoring should reward:
# - Explicit planning statements ("First I'll check..., then...")
# - Hypothesis listing before investigation
# - Systematic rather than random debugging
# - Documentation of reasoning

setup_files:
  input.lammps: |
    # Li3PS4 MD Simulation - BROKEN
    # Something is wrong with this input file

    units metal
    atom_style charge
    boundary p p p

    read_data Li3PS4.data

    # Potential (parameters may be wrong)
    pair_style buck/coul/long 10.0
    pair_coeff 1 1 1000.0 0.3 0.0  # Li-Li
    pair_coeff 1 2 5000.0 0.25 0.0 # Li-P
    pair_coeff 1 3 2000.0 0.29 0.0 # Li-S
    pair_coeff 2 2 8000.0 0.2 0.0  # P-P
    pair_coeff 2 3 6000.0 0.22 0.0 # P-S
    pair_coeff 3 3 4000.0 0.35 0.0 # S-S

    kspace_style ewald 1e-4

    # Very aggressive thermostat
    fix 1 all nvt temp 500 500 10

    # Huge timestep for metal units
    timestep 0.005

    thermo 100
    dump 1 all atom 1000 traj.lammpstrj

    run 50000

skills_required:
  - lammps-simulation

time_limit_minutes: 45

expected_outputs:
  files:
    - name: "diagnosis.md"
      description: "What was found wrong"
    - name: "fixed_input.lammps"
      description: "Corrected input file"

  values:
    identified_timestep_issue:
      description: "Found 5fs timestep too large for metal units"
      expected: true
    identified_thermostat_issue:
      description: "Found thermostat damping too aggressive"
      expected: true

grading:
  categories:
    - name: natural_planning
      weight: 35
      criteria:
        - Listed hypotheses before testing
        - Stated investigation approach upfront
        - Systematic not random debugging
        - Did NOT just start running commands

    - name: problem_diagnosis
      weight: 35
      criteria:
        - Identified timestep issue (0.005 ps = 5 fs is huge)
        - Identified thermostat damping issue
        - Identified potential parameter concerns
        - Root cause correctly identified

    - name: solution_quality
      weight: 20
      criteria:
        - Fix actually works
        - Timestep reduced appropriately
        - Thermostat damping fixed
        - Parameters validated

    - name: documentation
      weight: 10
      criteria:
        - Reasoning documented
        - Changes explained
        - Could be reproduced
        - Learning captured

metadata:
  difficulty: medium
  estimated_time_minutes: 35
  skills_tested:
    - natural_planning
    - debugging
    - lammps_knowledge
    - systematic_thinking
  notes: |
    This is a BEHAVIORAL test. We don't ask for planning.
    We observe whether the agent naturally plans before diving in.

    The input file has multiple issues:
    1. Timestep 0.005 ps = 5 fs (way too large for metal units)
    2. Thermostat damping of 10 fs is very aggressive
    3. Buckingham parameters may need verification

    A planning agent will list these as hypotheses FIRST.
    A non-planning agent will just start trying things.
