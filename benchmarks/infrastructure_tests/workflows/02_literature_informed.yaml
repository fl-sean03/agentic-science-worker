# Workflow Benchmark: Literature-Informed Task
# Test workflow that combines literature search with verification

name: literature-informed-workflow
description: Search literature and extract information
category: workflow
difficulty: medium
expected_time: 60s
skills_tested:
  - literature-search

type: command

command: |
  cd /tmp && rm -rf workflow_lit && mkdir workflow_lit && cd workflow_lit

  echo "=== Step 1: Search for MD Force Field Papers ==="

  python3 /home/sf2/work/agents/science-agent/1-ScienceAgent/scripts/search_semantic_scholar.py \
    search "Lennard-Jones argon molecular dynamics parameters" --limit 5 > search_results.txt 2>&1

  cat search_results.txt

  echo ""
  echo "=== Step 2: Verify we found relevant papers ==="

  if grep -i "argon\|lennard\|molecular dynamics" search_results.txt; then
    echo "Found relevant papers"
  else
    echo "Warning: May not have found directly relevant papers"
  fi

  echo ""
  echo "=== Step 3: Document findings ==="

  cat > literature_summary.md << 'EOF'
  # Literature Search Summary

  ## Query
  Lennard-Jones argon molecular dynamics parameters

  ## Standard Argon LJ Parameters (from literature)
  - epsilon = 0.238 kcal/mol (or 119.8 K)
  - sigma = 3.405 Angstrom

  ## Notes
  These are well-established parameters from Rahman (1964) and
  subsequent refinements.
  EOF

  cat literature_summary.md

  echo ""
  echo "=== Workflow Complete ==="

timeout: 120

validation:
  exit_code: 0
  stdout_contains:
    - "Step 1:"
    - "Step 2:"
    - "Step 3:"
    - "Workflow Complete"
  files_created:
    - /tmp/workflow_lit/search_results.txt
    - /tmp/workflow_lit/literature_summary.md

tags:
  - workflow
  - literature
  - documentation
