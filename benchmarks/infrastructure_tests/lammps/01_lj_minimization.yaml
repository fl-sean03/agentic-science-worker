# LAMMPS Benchmark: LJ Minimization
# Test basic energy minimization with Lennard-Jones potential

name: lammps-lj-minimization
description: Run LAMMPS energy minimization on LJ system
category: lammps
difficulty: easy
expected_time: 30s
skills_tested:
  - lammps-simulation

type: command

command: |
  cd /tmp && rm -rf lammps_bench_lj && mkdir lammps_bench_lj && cd lammps_bench_lj

  # Create simple LJ data file
  cat > lj.data << 'EOF'
  LAMMPS data file for LJ particles

  10 atoms
  1 atom types

  0.0 10.0 xlo xhi
  0.0 10.0 ylo yhi
  0.0 10.0 zlo zhi

  Masses

  1 1.0

  Atoms

  1 1 1.0 1.0 1.0
  2 1 3.0 1.0 1.0
  3 1 5.0 1.0 1.0
  4 1 7.0 1.0 1.0
  5 1 9.0 1.0 1.0
  6 1 1.0 5.0 5.0
  7 1 3.0 5.0 5.0
  8 1 5.0 5.0 5.0
  9 1 7.0 5.0 5.0
  10 1 9.0 5.0 5.0
  EOF

  # Create input file
  cat > in.min << 'EOF'
  units lj
  atom_style atomic
  boundary p p p

  read_data lj.data

  pair_style lj/cut 2.5
  pair_coeff 1 1 1.0 1.0 2.5

  neighbor 0.3 bin
  neigh_modify delay 0 every 1

  thermo 10
  thermo_style custom step pe ke etotal press

  minimize 1.0e-6 1.0e-8 1000 10000

  write_data minimized.data
  EOF

  # Run LAMMPS
  /home/sf2/work/compute/gpu-tests/1-GPUTests/md-lammps/install/bin/lmp -in in.min

timeout: 60

validation:
  exit_code: 0
  stdout_contains:
    - "Minimization stats"
    - "Energy initial"
  files_created:
    - /tmp/lammps_bench_lj/minimized.data
  no_errors: false  # LAMMPS outputs to stderr sometimes

tags:
  - lammps
  - minimization
  - lj
