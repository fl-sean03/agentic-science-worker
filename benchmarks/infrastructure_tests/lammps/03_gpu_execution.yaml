# LAMMPS Benchmark: GPU Execution
# Test GPU-accelerated LAMMPS run

name: lammps-gpu-execution
description: Verify LAMMPS GPU acceleration works
category: lammps
difficulty: medium
expected_time: 60s
skills_tested:
  - lammps-simulation

type: command

command: |
  cd /tmp && rm -rf lammps_bench_gpu && mkdir lammps_bench_gpu && cd lammps_bench_gpu

  # Use the standard LJ benchmark
  cat > in.lj << 'EOF'
  units lj
  atom_style atomic
  boundary p p p

  lattice fcc 0.8442
  region box block 0 10 0 10 0 10
  create_box 1 box
  create_atoms 1 box
  mass 1 1.0

  velocity all create 1.0 12345

  pair_style lj/cut 2.5
  pair_coeff 1 1 1.0 1.0 2.5

  neighbor 0.3 bin
  neigh_modify delay 0 every 1 check yes

  fix 1 all nve

  timestep 0.005
  thermo 100

  run 500
  EOF

  # Run with GPU
  /home/sf2/builds/lammps/build/lmp \
    -sf gpu -pk gpu 1 neigh yes \
    -in in.lj 2>&1 | tee output.log

  # Check for GPU usage
  grep -i "gpu" output.log || echo "No GPU info in output"

timeout: 120

validation:
  exit_code: 0
  stdout_contains:
    - "500"
    - "Loop time"

tags:
  - lammps
  - gpu
  - performance
