# LAMMPS Benchmark: NVT Dynamics
# Test NVT molecular dynamics run

name: lammps-nvt-dynamics
description: Run short NVT MD simulation
category: lammps
difficulty: easy
expected_time: 45s
skills_tested:
  - lammps-simulation

type: command

command: |
  cd /tmp && rm -rf lammps_bench_nvt && mkdir lammps_bench_nvt && cd lammps_bench_nvt

  # Create simple LJ data file
  cat > lj.data << 'EOF'
  LAMMPS data file for LJ particles

  27 atoms
  1 atom types

  0.0 6.0 xlo xhi
  0.0 6.0 ylo yhi
  0.0 6.0 zlo zhi

  Masses

  1 1.0

  Atoms

  1 1 1.0 1.0 1.0
  2 1 3.0 1.0 1.0
  3 1 5.0 1.0 1.0
  4 1 1.0 3.0 1.0
  5 1 3.0 3.0 1.0
  6 1 5.0 3.0 1.0
  7 1 1.0 5.0 1.0
  8 1 3.0 5.0 1.0
  9 1 5.0 5.0 1.0
  10 1 1.0 1.0 3.0
  11 1 3.0 1.0 3.0
  12 1 5.0 1.0 3.0
  13 1 1.0 3.0 3.0
  14 1 3.0 3.0 3.0
  15 1 5.0 3.0 3.0
  16 1 1.0 5.0 3.0
  17 1 3.0 5.0 3.0
  18 1 5.0 5.0 3.0
  19 1 1.0 1.0 5.0
  20 1 3.0 1.0 5.0
  21 1 5.0 1.0 5.0
  22 1 1.0 3.0 5.0
  23 1 3.0 3.0 5.0
  24 1 5.0 3.0 5.0
  25 1 1.0 5.0 5.0
  26 1 3.0 5.0 5.0
  27 1 5.0 5.0 5.0
  EOF

  # Create input file
  cat > in.nvt << 'EOF'
  units lj
  atom_style atomic
  boundary p p p

  read_data lj.data

  pair_style lj/cut 2.5
  pair_coeff 1 1 1.0 1.0 2.5

  neighbor 0.3 bin
  neigh_modify delay 0 every 1

  velocity all create 1.0 12345 mom yes rot yes

  fix 1 all nvt temp 1.0 1.0 0.1

  timestep 0.001

  thermo 100
  thermo_style custom step temp pe ke etotal press

  dump 1 all custom 500 trajectory.lammpstrj id type x y z vx vy vz

  run 1000

  write_restart final.restart
  EOF

  # Run LAMMPS
  /home/sf2/work/compute/gpu-tests/1-GPUTests/md-lammps/install/bin/lmp -in in.nvt

timeout: 90

validation:
  exit_code: 0
  stdout_contains:
    - "Step Temp"
    - "1000"
  files_created:
    - /tmp/lammps_bench_nvt/trajectory.lammpstrj
    - /tmp/lammps_bench_nvt/final.restart

tags:
  - lammps
  - nvt
  - dynamics
