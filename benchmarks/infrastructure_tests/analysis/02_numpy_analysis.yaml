# Analysis Benchmark: NumPy Analysis
# Test numpy-based data analysis in blackwell-ml environment

name: numpy-analysis
description: Test NumPy analysis capabilities
category: analysis
difficulty: easy
expected_time: 20s
skills_tested:
  - data-analysis

type: command

command: |
  conda run -n blackwell-ml python3 << 'EOF'
  import numpy as np

  # Simulate trajectory data
  n_frames = 100
  n_atoms = 10

  # Random walk for MSD calculation
  np.random.seed(42)
  positions = np.cumsum(np.random.randn(n_frames, n_atoms, 3) * 0.1, axis=0)

  # Calculate MSD
  msd = np.zeros(n_frames)
  for t in range(n_frames):
      disp = positions[t] - positions[0]
      msd[t] = np.mean(np.sum(disp**2, axis=1))

  # Fit for diffusion coefficient
  time = np.arange(n_frames)
  # D = slope / 6 for 3D
  from numpy.polynomial import polynomial as P
  coeffs = np.polyfit(time[10:], msd[10:], 1)
  D = coeffs[0] / 6

  print(f"Frames: {n_frames}")
  print(f"Atoms: {n_atoms}")
  print(f"Final MSD: {msd[-1]:.4f}")
  print(f"Diffusion coefficient: {D:.6f}")
  print("OK: NumPy analysis working")
  EOF

timeout: 60

validation:
  exit_code: 0
  stdout_contains:
    - "Frames: 100"
    - "Final MSD:"
    - "Diffusion coefficient:"
    - "OK: NumPy analysis working"

tags:
  - analysis
  - numpy
  - msd
  - diffusion
