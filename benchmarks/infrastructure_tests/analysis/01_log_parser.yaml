# Analysis Benchmark: LAMMPS Log Parser
# Test the LAMMPS log parsing script

name: lammps-log-parser
description: Test parse_lammps_log.py with sample data
category: analysis
difficulty: easy
expected_time: 15s
skills_tested:
  - data-analysis

type: command

command: |
  cd /tmp && rm -rf analysis_bench && mkdir analysis_bench && cd analysis_bench

  # Create sample LAMMPS log
  cat > log.lammps << 'EOF'
  LAMMPS (2 Aug 2023)
  Reading data file ...
    orthogonal box = (0 0 0) to (10 10 10)
    1000 atoms
  Neighbor list info ...
  Setting up run ...
  Step Temp PotEng KinEng TotEng Press
         0    1.0   -6.7734    1.4956   -5.2778   -0.50234
       100    0.98   -6.7823    1.4659   -5.3164   -0.48123
       200    0.97   -6.7912    1.4512   -5.3400   -0.45012
       300    0.99   -6.7856    1.4802   -5.3054   -0.47845
       400    1.01   -6.7745    1.5101   -5.2644   -0.51234
       500    1.00   -6.7789    1.4956   -5.2833   -0.49567
  Loop time of 0.234567 on 1 procs for 500 steps
  EOF

  # Run parser
  python3 /home/sf2/work/agents/science-agent/1-ScienceAgent/scripts/parse_lammps_log.py log.lammps --stats

timeout: 30

validation:
  exit_code: 0
  stdout_contains:
    - "Total steps: 6"
    - "Columns:"
    - "mean:"

tags:
  - analysis
  - parser
  - lammps
