# Materials Benchmark: Materials Project API
# Test Materials Project API access

name: materials-project-api
description: Test Materials Project API connectivity (without API key)
category: materials
difficulty: easy
expected_time: 30s
skills_tested:
  - materials-database

type: command

command: |
  # Test Materials Project API endpoint (public info)
  curl -s "https://api.materialsproject.org/materials/summary/?formula=Si&_limit=1" -H "Accept: application/json" | python3 -c "
  import json
  import sys

  try:
      data = json.load(sys.stdin)
      # May get auth error without key, that's OK - we're testing connectivity
      if 'detail' in data and 'API_KEY' in str(data['detail']):
          print('API accessible but requires API key')
          print('OK: Materials Project API reachable')
      elif 'data' in data:
          print(f'Found {len(data[\"data\"])} materials')
          print('OK: Materials Project API working')
      else:
          print(f'Response: {str(data)[:200]}')
          print('OK: Materials Project API reachable')
  except Exception as e:
      print(f'Error: {e}')
      sys.exit(1)
  "

timeout: 60

validation:
  exit_code: 0
  stdout_contains:
    - "OK:"
    - "Materials Project"

tags:
  - materials
  - api
  - materials-project
