# Environment Benchmark: System Baseline
# Validates that the system meets basic requirements

name: system-baseline
description: Verify basic system configuration (bare-metal Ubuntu since 2026-06;
  WSL2 checks retired with the machine migration — rebase-2026-07-02)
category: environment
difficulty: trivial
expected_time: 5s

type: validation

checks:
  - name: Linux kernel detected
    type: command_succeeds
    command: "uname -s | grep -i linux"

  - name: Home directory exists
    type: file_exists
    path: /home/sf2

  - name: Workspace directory exists
    type: file_exists
    path: /home/sf2/work

  - name: Python3 available
    type: command_succeeds
    command: "python3 --version"

  - name: Bash available
    type: command_succeeds
    command: "bash --version"

validation:
  exit_code: 0

tags:
  - baseline
  - system
