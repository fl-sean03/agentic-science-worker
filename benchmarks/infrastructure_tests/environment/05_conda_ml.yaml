# Environment Benchmark: ML Conda Environment
# Validates blackwell-ml conda environment

name: conda-ml-environment
description: Verify blackwell-ml conda environment with PyTorch
category: environment
difficulty: trivial
expected_time: 15s

type: command

command: |
  conda run -n blackwell-ml python -c "
  import sys
  print(f'Python: {sys.version}')

  import torch
  print(f'PyTorch: {torch.__version__}')
  print(f'CUDA available: {torch.cuda.is_available()}')

  if torch.cuda.is_available():
      print(f'GPU: {torch.cuda.get_device_name(0)}')

  import numpy as np
  print(f'NumPy: {np.__version__}')

  print('OK: All ML packages available')
  "

timeout: 60

validation:
  exit_code: 0
  stdout_contains:
    - "PyTorch:"
    - "CUDA available: True"
    - "OK: All ML packages available"

tags:
  - conda
  - pytorch
  - ml
  - gpu
