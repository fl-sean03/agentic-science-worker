# Environment Benchmark: Quantum ESPRESSO Binary
# Validates QE CPU and GPU installations

name: qe-binary
description: Verify Quantum ESPRESSO binaries exist
category: environment
difficulty: trivial
expected_time: 5s

type: validation

checks:
  - name: QE CPU pw.x exists
    type: file_exists
    path: /home/sf2/work/compute/gpu-tests/1-GPUTests/dft-qe/build-cpu/bin/pw.x

  - name: QE GPU pw.x exists
    type: file_exists
    path: /home/sf2/work/compute/gpu-tests/1-GPUTests/dft-qe/build-gpu/bin/pw.x

  - name: NVHPC setup script exists
    type: file_exists
    path: /home/sf2/work/compute/gpu-tests/1-GPUTests/dft-qe/env/setup_nvhpc.sh

  - name: QE CPU responds to help
    type: command_succeeds
    command: "/home/sf2/work/compute/gpu-tests/1-GPUTests/dft-qe/build-cpu/bin/pw.x --help 2>&1 | head -3 || true"

validation:
  exit_code: 0

tags:
  - qe
  - binary
  - dft
