# Environment Benchmark: GPU Baseline
# Validates NVIDIA GPU and CUDA availability

name: gpu-baseline
description: Verify NVIDIA GPU and CUDA 12.8 availability
category: environment
difficulty: trivial
expected_time: 10s

type: validation

checks:
  - name: nvidia-smi works
    type: command_succeeds
    command: "nvidia-smi"

  - name: CUDA 12.8 toolkit exists
    type: file_exists
    path: /usr/local/cuda-12.8

  - name: WSL CUDA library exists
    type: file_exists
    path: /usr/lib/wsl/lib/libcuda.so.1

  - name: nvcc compiler available
    type: command_succeeds
    command: "/usr/local/cuda-12.8/bin/nvcc --version"

validation:
  exit_code: 0

tags:
  - gpu
  - cuda
  - baseline
