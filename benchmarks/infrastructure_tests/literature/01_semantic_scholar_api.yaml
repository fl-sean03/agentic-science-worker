# Literature Benchmark: Semantic Scholar API
# Test basic Semantic Scholar API access

name: semantic-scholar-api
description: Test Semantic Scholar API connectivity
category: literature
difficulty: easy
expected_time: 30s
skills_tested:
  - literature-search

type: command

command: |
  # Test Semantic Scholar API
  curl -s "https://api.semanticscholar.org/graph/v1/paper/search?query=molecular+dynamics&limit=3&fields=title,year" | python3 -c "
  import json
  import sys

  try:
      data = json.load(sys.stdin)
      if 'data' in data:
          print(f'Found {len(data[\"data\"])} papers')
          for paper in data['data']:
              print(f'  - {paper.get(\"title\", \"No title\")} ({paper.get(\"year\", \"?\")})')
          print('OK: Semantic Scholar API working')
      else:
          print(f'Unexpected response: {data}')
          sys.exit(1)
  except Exception as e:
      print(f'Error: {e}')
      sys.exit(1)
  "

timeout: 60

validation:
  exit_code: 0
  stdout_contains:
    - "Found"
    - "papers"
    - "OK: Semantic Scholar API working"

tags:
  - literature
  - api
  - semantic-scholar
