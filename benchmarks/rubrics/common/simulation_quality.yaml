# Common Rubric: Simulation Quality
# Reusable checks for LAMMPS/QE simulation execution

name: simulation_quality
version: "1.0.0"
description: Validates that simulations run correctly and produce reasonable results

checks:
  # Basic completion checks
  - id: simulation_completes
    description: Simulation runs to completion without crashes
    points: 15
    type: simulation_completes
    params:
      log_pattern: "log.lammps"
      success_markers:
        - "Total wall time"
        - "Loop time"
    evidence_capture: true

  - id: no_errors
    description: No ERROR or FATAL messages in output
    points: 10
    type: file_not_contains
    params:
      path: "log.lammps"
      patterns:
        - "ERROR"
        - "FATAL"
        - "Segmentation fault"
    evidence_capture: true

  - id: no_nan_values
    description: No NaN values indicating numerical instability
    points: 5
    type: file_not_contains
    params:
      path: "log.lammps"
      patterns:
        - "nan"
        - "NaN"
        - "inf"
    evidence_capture: true

  # Energy sanity checks
  - id: energy_decreases_minimization
    description: Energy decreases during minimization (if applicable)
    points: 10
    type: llm_evaluate
    params:
      prompt: |
        Check if this is an energy minimization run. If so, verify that
        the potential energy decreased from start to end. If not a
        minimization, this check passes automatically.
      criteria:
        - "Energy decreased OR not a minimization run"
    evidence_capture: true

  - id: energy_stable_equilibrium
    description: Energy is stable during equilibration (if applicable)
    points: 10
    type: llm_evaluate
    params:
      prompt: |
        Check if this run includes equilibration. If so, verify that
        energy fluctuations are reasonable (not monotonically increasing
        or showing instability). If not equilibration, pass automatically.
      criteria:
        - "Energy stable OR not an equilibration run"
    evidence_capture: true

  # Temperature checks (MD only)
  - id: temperature_correct
    description: System temperature matches target (MD simulations)
    points: 10
    type: llm_evaluate
    params:
      prompt: |
        If this is an MD simulation with temperature control, verify the
        average temperature is within 5% of the target. Extract the target
        from the input file and compare to logged values.
      criteria:
        - "Temperature within 5% of target OR not temperature-controlled"
    evidence_capture: true

  # Trajectory/output checks
  - id: trajectory_written
    description: Trajectory file was written (if requested)
    points: 5
    type: llm_evaluate
    params:
      prompt: |
        Check if the simulation was supposed to write trajectory data
        (dump command in input). If so, verify the trajectory file exists
        and is non-empty.
      criteria:
        - "Trajectory exists OR not requested"
    evidence_capture: true
