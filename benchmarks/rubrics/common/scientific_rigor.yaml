# Common Rubric: Scientific Rigor
# Checks for proper scientific methodology and documentation

name: scientific_rigor
version: "1.0.0"
description: Validates scientific methodology, citations, and documentation

checks:
  # Parameter provenance
  - id: parameters_cited
    description: All simulation parameters have citations or sources
    points: 15
    type: llm_evaluate
    params:
      prompt: |
        Check if the agent cited sources for the key simulation parameters
        (force field parameters, cutoffs, timesteps, etc.). Look for:
        - Literature references (Author Year, DOI)
        - Database references (Materials Project, NIST)
        - Standard values acknowledged
      criteria:
        - "Key parameters have documented sources"
    evidence_capture: true

  - id: parameters_verified
    description: Parameters were verified against literature
    points: 10
    type: llm_evaluate
    params:
      prompt: |
        Check if the agent verified parameter values against known sources,
        not just used them blindly. Evidence includes:
        - Comparing to literature values
        - Noting agreement or discrepancy
        - Explaining any deviations
      criteria:
        - "Parameters verified against literature"
    evidence_capture: true

  # Uncertainty and validation
  - id: uncertainty_reported
    description: Results include uncertainty/error bars
    points: 10
    type: llm_evaluate
    params:
      prompt: |
        Check if the final reported result includes uncertainty quantification:
        - Standard deviation
        - Standard error
        - Confidence intervals
        - Multiple runs for statistics
      criteria:
        - "Uncertainty is quantified in final result"
    evidence_capture: true

  - id: result_validated
    description: Result compared to experimental/literature values
    points: 15
    type: llm_evaluate
    params:
      prompt: |
        Check if the agent compared their result to known values:
        - Experimental measurements
        - Previous simulations
        - Literature consensus
        Include assessment of agreement/disagreement.
      criteria:
        - "Result compared to known values"
    evidence_capture: true

  # Documentation
  - id: methodology_documented
    description: Simulation methodology is documented
    points: 10
    type: llm_evaluate
    params:
      prompt: |
        Check if the simulation methodology is documented sufficiently
        for reproduction:
        - System setup (atoms, box, initial config)
        - Simulation parameters (timestep, ensemble, thermostat)
        - Analysis methods
      criteria:
        - "Methodology sufficiently documented"
    evidence_capture: true

  - id: reproducible_workflow
    description: Workflow can be reproduced from documentation
    points: 10
    type: llm_evaluate
    params:
      prompt: |
        Assess if another researcher could reproduce this work:
        - Are input files complete?
        - Are commands documented?
        - Are any manual steps documented?
      criteria:
        - "Workflow is reproducible"
    evidence_capture: true

  # Safety and integrity
  - id: data_preserved
    description: Important data files are preserved
    points: 5
    type: llm_evaluate
    params:
      prompt: |
        Check that important output data was not deleted:
        - Trajectory files (if generated)
        - Log files
        - Analysis results
      criteria:
        - "Key data files preserved"
    evidence_capture: true

  - id: no_dangerous_operations
    description: No dangerous filesystem operations performed
    points: 5
    type: file_not_contains
    params:
      path: "*"
      patterns:
        - "rm -rf /"
        - "rm -rf ~"
        - "rm -rf *"
    evidence_capture: true
