# Rubric Schema Definition
# All rubrics must conform to this structure

version: "1.0"
description: Schema for benchmark grading rubrics

# A rubric consists of categories, each with weighted checks
rubric_structure:
  name: string          # Rubric identifier
  version: string       # Semver for tracking changes
  description: string   # What this rubric evaluates

  categories:
    - name: string      # Category name (e.g., "setup_quality")
      weight: integer   # Percentage of total score (0-100)
      description: string

      checks:
        - id: string              # Unique check identifier
          description: string     # Human-readable description
          points: integer         # Points if check passes
          type: enum              # Validation type (see below)
          params: object          # Type-specific parameters
          evidence_capture: bool  # Whether to store evidence

# Validation Types
check_types:

  # File existence and content checks
  file_exists:
    params:
      path: string        # Glob pattern for file

  file_contains:
    params:
      path: string        # Glob pattern for file
      pattern: string     # Regex pattern to find

  file_not_contains:
    params:
      path: string
      patterns: list      # Patterns that should NOT exist

  # Value validation
  value_in_range:
    params:
      source: string      # File or "agent_output"
      extract: string     # Regex with capture group
      min: number
      max: number

  value_equals:
    params:
      source: string
      extract: string
      expected: any
      tolerance: number   # Optional, for floats

  # Simulation-specific
  simulation_completes:
    params:
      log_pattern: string # Glob for log file
      success_markers:    # Patterns indicating success
        - string

  energy_reasonable:
    params:
      log_pattern: string
      energy_regex: string
      min_energy: number
      max_energy: number

  # Scientific validation
  parameter_cited:
    params:
      parameter_name: string
      expected_source: string  # Optional

  uncertainty_reported:
    params:
      value_name: string

  # LLM-based (flexible)
  llm_evaluate:
    params:
      prompt: string      # Evaluation prompt
      criteria: list      # What to look for
      model: string       # Optional, default claude-haiku

# Example rubric using this schema
example_rubric:
  name: basic_simulation
  version: "1.0.0"
  description: Basic simulation quality rubric

  categories:
    - name: setup_quality
      weight: 30
      description: Input file correctness and setup
      checks:
        - id: input_file_exists
          description: LAMMPS input file was created
          points: 10
          type: file_exists
          params:
            path: "*.lmp"
          evidence_capture: true

        - id: correct_potential
          description: Correct potential parameters used
          points: 20
          type: file_contains
          params:
            path: "*.lmp"
            pattern: "pair_coeff.*0\\.238.*3\\.405"
          evidence_capture: true

    - name: execution_quality
      weight: 40
      description: Simulation ran correctly
      checks:
        - id: simulation_completed
          description: Simulation finished without errors
          points: 20
          type: simulation_completes
          params:
            log_pattern: "log.lammps"
            success_markers:
              - "Total wall time"
              - "Loop time"

        - id: energy_reasonable
          description: Final energy is physically reasonable
          points: 20
          type: energy_reasonable
          params:
            log_pattern: "log.lammps"
            energy_regex: "PotEng\\s+=\\s+(-?[\\d.]+)"
            min_energy: -100
            max_energy: 0

    - name: result_quality
      weight: 30
      description: Results are correct and documented
      checks:
        - id: result_reported
          description: Final result was reported
          points: 15
          type: llm_evaluate
          params:
            prompt: "Did the agent report a final numerical result?"
            criteria:
              - "Reported a specific value"
              - "Included units"
              - "Compared to expected/literature"

        - id: methodology_documented
          description: Methodology was documented
          points: 15
          type: file_exists
          params:
            path: "*.md"
